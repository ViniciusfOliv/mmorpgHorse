# Verificação do protótipo no GitHub (T4 da auditoria, D7): roda em cada envio para a main e em cada PR.
#   - "check": ./scripts/check.sh (as 8 etapas) e confere que prototype/dist e docs/wiki.md estão commitados em dia.
#   - "balanco": node prototype/tools/balance.js completo (metas M6, M9, P1, S1, A1 e G1–G7, que o --quick não cobra).
# O Playwright vem de prototype/tools/package.json (versão fixa, só das ferramentas; o jogo não tem dependências).
# Não grava capturas oficiais nem mexe em save: só lê o repositório.
name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: prototype/tools/package-lock.json
      - name: Playwright das ferramentas
        run: |
          npm ci --prefix prototype/tools
          npx --prefix prototype/tools playwright install --with-deps chromium
      - name: Verificação completa (check.sh)
        run: ./scripts/check.sh
      - name: dist e wiki commitados em dia com o src
        run: |
          if ! git diff --quiet -- prototype/dist docs/wiki.md || [ -n "$(git ls-files --others --exclude-standard -- prototype/dist docs/wiki.md)" ]; then
            echo "O build mudou prototype/dist/ ou docs/wiki.md: rode node prototype/build.mjs e commite junto com o src."
            git status --short -- prototype/dist docs/wiki.md
            exit 1
          fi

  balanco:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Balanceamento completo
        run: node prototype/tools/balance.js
