<title>Galope Elemental</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
@import url('https://fonts.googleapis.com/css2?family=Jersey+10&family=Press+Start+2P&display=swap');

/* Layout: uma coluna central (até 520px) de painéis no estilo "programa de corrida";
   a pista quebra a coluna (sangra até a borda no celular, cresce até 1120px no desktop).
   Mundo único: estábulo à noite (piso de tábuas), cerca creme e placar dourado.
   Grade de pixel: molduras e sombras em múltiplos de 2px; Press Start 2P só em 8, 16 ou 24px. */
:root {
  color-scheme: dark;
  /* chão e painéis */
  --noite: #0f1c17;
  --noite-2: #0b1611;
  --painel: #16271f;
  --painel-2: #1e3329;
  --painel-3: #284438;
  --linha: #335446;
  --sombra: #060d0a;
  /* madeira (placas) */
  --madeira: #6b4a2b;
  --madeira-2: #523720;
  --madeira-luz: #8a6440;
  /* texto */
  --texto: #f1e9d4;
  --texto-2: #b3c2b2;
  --texto-3: #95a99b;
  --tinta: #1a1405;
  /* acentos */
  --ouro: #f2c230;
  --ouro-claro: #ffe27a;
  --ouro-escuro: #9c7210;
  --ganho: #7be07a;
  --perda: #ff6b5e;
  --foco: #62e6ff;
  /* elementos (texto legível sobre o painel) */
  --fogo: #ff8a4c;
  --agua: #62b8ff;
  --grama: #86d86a;
  --neutro: #cfc8b4;
  /* raridades (GameData.RARITIES) */
  --r-comum: #9e9e9e;
  --r-magico: #4caf50;
  --r-raro: #2196f3;
  --r-lendario: #ff9800;
  --r-mitico: #9c27b0;
  /* ligas (GameData.LEAGUES) */
  --l-bronze: #b0703c;
  --l-prata: #b8c2cc;
  --l-ouro: #f2c230;
  --l-platina: #5fd3c8;
  --l-diamante: #7ab8ff;
  --l-lenda: #ff7a3d;
  /* sedas dos jóqueis (Sprites.SILKS) */
  --seda-0: #d8353b;
  --seda-1: #2f6fd8;
  --seda-2: #f2c230;
  --seda-3: #8a4ad8;
  --seda-4: #30b060;
  --seda-5: #f07a2a;
  --seda-6: #e85aa8;
  --seda-7: #2ab8b0;
  /* pódio */
  --prata: #c9d3dc;
  --bronze: #c98a52;
  /* cena dos retratos (baia) */
  --tabua: #243a31;
  --palha: #a5823f;
  --palha-2: #6f5526;
  /* véus e brilhos (sobreposições) */
  --escuro-35: rgb(0 0 0 / 0.35);
  --escuro-25: rgb(0 0 0 / 0.25);
  --brilho-08: rgb(255 255 255 / 0.08);
  --brilho-33: rgb(255 255 255 / 0.33);
  --veu: rgb(6 13 10 / 0.74);
  --holofote: rgb(255 226 122 / 0.06);
  /* tipografia */
  --fonte-display: 'Press Start 2P', ui-monospace, 'Courier New', monospace;
  --fonte-ui: 'Jersey 10', 'Arial Narrow', 'Roboto Condensed', 'Helvetica Neue', system-ui, sans-serif;
  --t-xs: 0.9375rem;
  --t-s: 1.0625rem;
  --t-m: 1.25rem;
  --t-l: 1.625rem;
  /* contorno em pixel (cantos recortados) */
  --px: 2px;
  --gl: max(16px, env(safe-area-inset-left, 0px));
  --gr: max(16px, env(safe-area-inset-right, 0px));
}

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
html { background: var(--noite); }
body {
  background-color: var(--noite);
  /* piso de tábuas do estábulo: linhas de 2px, sem gradiente suave */
  background-image:
    linear-gradient(var(--noite-2) 2px, transparent 2px),
    linear-gradient(90deg, var(--noite-2) 2px, transparent 2px);
  background-size: 100% 32px, 128px 32px;
  color: var(--texto);
  font: 400 var(--t-m)/1.25 var(--fonte-ui);
  font-synthesis: none;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; }
b, strong { font-weight: 400; color: var(--texto); }
.ord { font-size: 0.5em; vertical-align: 0.8em; line-height: 0; }
canvas { image-rendering: pixelated; image-rendering: crisp-edges; display: block; }
[hidden] { display: none !important; }
:focus-visible { outline: 3px solid var(--foco); outline-offset: 3px; }
[tabindex="-1"]:focus { outline: none; }
.sr { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }

.app {
  min-height: 100%;
  padding-left: var(--gl);
  padding-right: var(--gr);
  padding-block: 16px 40px;
  overflow-x: clip;
}
.app--corrida { padding-block: 8px max(8px, env(safe-area-inset-bottom, 0px)); }

/* ---------- telas ---------- */
.tela { max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
.tela--larga { max-width: 1120px; }
.tela-cabeca { display: flex; flex-direction: column; gap: 6px; }

h1, h2, h3 { margin: 0; text-wrap: balance; font-weight: 400; }
.logo {
  font-family: var(--fonte-display);
  font-size: 24px;
  line-height: 1.5;
  color: var(--ouro);
  text-shadow: 4px 4px 0 var(--sombra);
}
.logo-mini {
  font-family: var(--fonte-display); font-size: 8px; color: var(--ouro); line-height: 2;
  min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.titulo { font-family: var(--fonte-display); font-size: 16px; line-height: 1.5; color: var(--texto); }
.titulo--tela { text-shadow: 2px 2px 0 var(--sombra); }
.rotulo {
  font-size: var(--t-xs); font-weight: 600; text-transform: uppercase; letter-spacing: 0.12em; color: var(--texto-3);
}
.sub { color: var(--texto-2); margin: 0; max-width: 60ch; }
.nota { color: var(--texto-3); font-size: var(--t-s); margin: 0; }

/* ---------- caixas: moldura pixel (cantos recortados), bisel e sombra projetada ---------- */
.caixa {
  background: var(--painel);
  box-shadow:
    0 calc(-1 * var(--px)) 0 0 var(--linha),
    0 var(--px) 0 0 var(--linha),
    calc(-1 * var(--px)) 0 0 0 var(--linha),
    var(--px) 0 0 0 var(--linha),
    0 6px 0 0 var(--sombra),
    inset 0 2px 0 0 var(--brilho-08),
    inset 0 -2px 0 0 var(--escuro-25);
  padding: 14px;
  margin: var(--px) var(--px) 6px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  min-width: 0;
}
.caixa > h2 { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.caixa > h2.titulo::before {
  content: ""; flex: none; width: 8px; height: 8px; background: var(--ouro); box-shadow: 2px 2px 0 0 var(--sombra);
  align-self: center; margin-right: -2px;
}
.caixa > h2.titulo { justify-content: flex-start; }
.caixa > h2 .nota { font-family: var(--fonte-ui); font-size: var(--t-s); letter-spacing: 0; margin-left: auto; }

/* placa de madeira (título da sala de largada) */
.placa {
  background: var(--madeira);
  padding: 12px 14px;
  margin: var(--px) var(--px) 6px;
  box-shadow:
    0 -2px 0 0 var(--sombra), 0 2px 0 0 var(--sombra), -2px 0 0 0 var(--sombra), 2px 0 0 0 var(--sombra),
    0 6px 0 0 var(--sombra),
    inset 0 2px 0 0 var(--madeira-luz), inset 0 -4px 0 0 var(--madeira-2);
  background-image: linear-gradient(var(--madeira-2) 2px, transparent 2px);
  background-size: 100% 18px;
  background-position: 0 8px;
}
.placa .rotulo { color: #e8d7b0; }
.placa .nota { color: #e8d7b0; }

/* ---------- botões ---------- */
.btn {
  appearance: none;
  border: 0;
  margin: var(--px);
  min-height: 48px;
  padding: 10px 16px;
  background: var(--painel-2);
  color: var(--texto);
  font-family: var(--fonte-ui);
  font-weight: 600;
  font-size: var(--t-m);
  line-height: 1.15;
  cursor: pointer;
  box-shadow:
    0 calc(-1 * var(--px)) 0 0 var(--sombra),
    0 var(--px) 0 0 var(--sombra),
    calc(-1 * var(--px)) 0 0 0 var(--sombra),
    var(--px) 0 0 0 var(--sombra),
    inset 0 -4px 0 0 var(--escuro-35),
    inset 0 2px 0 0 var(--brilho-08);
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  text-align: center;
  touch-action: manipulation;
  -webkit-user-select: none; user-select: none;
}
.btn:hover:not(:disabled) { background: var(--painel-3); }
.btn:active:not(:disabled) {
  transform: translateY(2px);
  box-shadow:
    0 calc(-1 * var(--px)) 0 0 var(--sombra),
    0 var(--px) 0 0 var(--sombra),
    calc(-1 * var(--px)) 0 0 0 var(--sombra),
    var(--px) 0 0 0 var(--sombra),
    inset 0 -2px 0 0 var(--escuro-35);
}
.btn:disabled { opacity: 0.42; cursor: not-allowed; }
.btn:focus-visible { outline-offset: 5px; }
.btn--ouro { background: var(--ouro); color: var(--tinta); box-shadow:
    0 -2px 0 0 var(--sombra), 0 2px 0 0 var(--sombra), -2px 0 0 0 var(--sombra), 2px 0 0 0 var(--sombra),
    inset 0 -4px 0 0 var(--ouro-escuro), inset 0 2px 0 0 var(--ouro-claro); }
.btn--ouro:hover:not(:disabled) { background: var(--ouro-claro); }
.btn--grande { min-height: 56px; font-size: var(--t-l); width: calc(100% - 2 * var(--px)); }
.btn--pequeno { min-height: 48px; padding: 6px 12px; font-size: var(--t-s); }
.btn--texto { background: transparent; box-shadow: none; color: var(--texto-2); text-decoration: underline; text-underline-offset: 3px; min-height: 48px; }
.btn--texto:hover:not(:disabled) { background: transparent; color: var(--texto); }
.btn--perigo { color: var(--perda); }
.acoes { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; }
.barra-acao {
  position: sticky; bottom: 0; z-index: 5;
  padding-top: 16px; padding-bottom: max(12px, env(safe-area-inset-bottom, 0px));
  margin-bottom: -12px;
  /* degraus de pixel em vez de degradê suave */
  background: linear-gradient(to bottom, transparent 0 6px, rgb(15 28 23 / 0.6) 6px 10px, var(--noite) 10px);
}

/* opções selecionáveis (aria-pressed) */
.opcoes { display: grid; gap: 10px; }
.opcoes--3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.opcoes--itens { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.opcoes--itens .opcao--nenhum { grid-column: 1 / -1; flex-direction: row; align-items: baseline; gap: 10px; min-height: 48px; padding-block: 8px; }
.opcoes--itens .opcao--nenhum .opcao-nome { flex: none; white-space: nowrap; }
.opcao {
  text-align: left; align-items: flex-start; justify-content: flex-start; flex-direction: column; gap: 2px;
  min-width: 0; font-weight: 500;
}
.opcao[aria-pressed="true"] {
  background: var(--painel-3);
  box-shadow:
    0 calc(-1 * var(--px)) 0 0 var(--ouro),
    0 var(--px) 0 0 var(--ouro),
    calc(-1 * var(--px)) 0 0 0 var(--ouro),
    var(--px) 0 0 0 var(--ouro),
    inset 0 -4px 0 0 var(--escuro-35);
}
.opcao .opcao-nome { font-weight: 700; display: flex; align-items: center; gap: 6px; }
.opcao .opcao-desc { font-size: var(--t-xs); color: var(--texto-2); font-weight: 400; line-height: 1.3; display: flex; flex-wrap: wrap; gap: 4px 6px; align-items: center; }
.opcao--centro { align-items: center; text-align: center; justify-content: center; }

/* ---------- moeda, chips, emblemas ---------- */
.ouro { display: inline-flex; align-items: center; gap: 6px; font-family: var(--fonte-display); font-size: 16px; line-height: 1; color: var(--ouro); white-space: nowrap; font-variant-numeric: tabular-nums; }
.ouro svg { width: 16px; height: 16px; flex: none; }
.saldo {
  background: var(--painel);
  padding: 8px 12px;
  margin: var(--px);
  flex: none;
  box-shadow: 0 -2px 0 0 var(--ouro-escuro), 0 2px 0 0 var(--ouro-escuro), -2px 0 0 0 var(--ouro-escuro), 2px 0 0 0 var(--ouro-escuro), 0 6px 0 0 var(--sombra);
}
.topo { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: nowrap; min-width: 0; }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  display: inline-flex; align-items: center; gap: 6px;
  background: var(--painel-2); color: var(--texto);
  padding: 4px 9px; font-size: var(--t-s); font-weight: 500; line-height: 1.3;
  box-shadow: 0 -2px 0 0 var(--linha), 0 2px 0 0 var(--linha), -2px 0 0 0 var(--linha), 2px 0 0 0 var(--linha);
  margin: 2px;
}
.chip b { font-weight: 700; }
.chip .rotulo { font-size: 0.875rem; letter-spacing: 0.1em; color: var(--texto-2); }

.el { display: inline-flex; align-items: center; gap: 5px; font-weight: 700; }
.el canvas { flex: none; }
.el--fogo { color: var(--fogo); }
.el--agua { color: var(--agua); }
.el--grama { color: var(--grama); }
.el--neutro { color: var(--neutro); }

.raridade {
  display: inline-block; font-size: 0.875rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em;
  padding: 1px 6px; color: var(--tinta); background: var(--r-comum); line-height: 1.5;
  box-shadow: inset 0 -2px 0 0 var(--escuro-25);
}
.raridade--magico { background: var(--r-magico); }
.raridade--raro { background: var(--r-raro); }
.raridade--lendario { background: var(--r-lendario); }
.raridade--mitico { background: var(--r-mitico); color: var(--texto); }

.liga { display: inline-flex; align-items: center; gap: 6px; font-weight: 700; }
.liga::before { content: ""; width: 10px; height: 10px; background: currentColor; box-shadow: 0 0 0 2px var(--sombra); }
.liga--bronze { color: var(--l-bronze); }
.liga--prata { color: var(--l-prata); }
.liga--ouro { color: var(--l-ouro); }
.liga--platina { color: var(--l-platina); }
.liga--diamante { color: var(--l-diamante); }
.liga--lenda { color: var(--l-lenda); }

.seda-0 { background: var(--seda-0); } .seda-1 { background: var(--seda-1); } .seda-2 { background: var(--seda-2); } .seda-3 { background: var(--seda-3); }
.seda-4 { background: var(--seda-4); } .seda-5 { background: var(--seda-5); } .seda-6 { background: var(--seda-6); } .seda-7 { background: var(--seda-7); }
.seda-voce { background: var(--ouro); }

/* ---------- status ---------- */
.status { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 8px 10px; align-items: center; margin: 0; }
.status dt { font-family: var(--fonte-display); font-size: 8px; color: var(--texto-2); display: flex; align-items: center; gap: 6px; min-width: 52px; }
.status dd { margin: 0; }
.status .valor { font-family: var(--fonte-display); font-size: 16px; text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; min-width: 3ch; }
.status .delta { font-family: var(--fonte-ui); font-size: var(--t-s); font-weight: 700; margin-left: 4px; }
.icone-status { width: 16px; height: 16px; flex: none; fill: var(--ouro); }
.icone-status--vel { fill: #ffd86a; }
.icone-status--acel { fill: var(--fogo); }
.icone-status--est { fill: var(--perda); }
.icone-status--forca { fill: var(--grama); }
.icone-status--garra { fill: var(--agua); }
.barra {
  position: relative; height: 12px; background: var(--sombra);
  box-shadow: 0 0 0 2px var(--sombra);
}
.barra > i { position: absolute; top: 0; bottom: 0; left: 0; display: block; background: var(--ouro); }
/* barra em segmentos inteiros (20 x 5 pontos) */
.barra--seg { display: flex; gap: 2px; background: var(--sombra); height: 12px; }
.barra--seg > i { position: static; flex: 1 1 0; background: var(--painel-3); }
.barra--seg > i.on { background: var(--ouro); box-shadow: inset 0 -2px 0 0 var(--ouro-escuro); }
.barra--seg > i.extra { background: var(--ganho); box-shadow: inset 0 -2px 0 0 #3f9a3e; }
.barra--seg > i.menos { background: transparent; box-shadow: inset 0 0 0 2px var(--perda); }
.barra--xp::after {
  content: ""; position: absolute; inset: 0;
  background-image: linear-gradient(90deg, transparent calc(100% - 2px), var(--sombra) 0);
  background-size: 5% 100%;
}
.mais { color: var(--ganho); }
.menos-t { color: var(--perda); }

.xp { display: flex; flex-direction: column; gap: 4px; }
.xp .barra { height: 10px; }
.xp .barra > i { background: var(--agua); }
.xp-linha { display: flex; justify-content: space-between; font-size: var(--t-xs); color: var(--texto-2); font-variant-numeric: tabular-nums; }

/* ---------- retrato do cavalo ---------- */
.retrato { flex: none; box-shadow: 0 0 0 2px var(--sombra), 0 6px 0 0 var(--sombra); }
.cavalo-cabeca { display: flex; gap: 14px; align-items: flex-start; }
.cavalo-info { display: flex; flex-direction: column; gap: 6px; min-width: 0; flex: 1; }
.cavalo-nome { font-family: var(--fonte-display); font-size: 16px; line-height: 1.5; color: var(--texto); text-shadow: 2px 2px 0 var(--sombra); }
.cavalo-titulo { color: var(--texto-2); font-size: var(--t-s); margin: 0; }
.linha-meta { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; font-size: var(--t-s); }
.nivel { font-family: var(--fonte-display); font-size: 8px; color: var(--texto); }

.habilidade { display: flex; flex-direction: column; gap: 2px; background: var(--painel-2); padding: 8px 10px; box-shadow: inset 4px 0 0 0 var(--ouro-escuro); }
.habilidade b { display: flex; align-items: center; gap: 6px; }
.habilidade span { font-size: var(--t-s); color: var(--texto-2); }

.afinidade { display: grid; grid-template-columns: auto 1fr; gap: 4px 10px; margin: 0; font-size: var(--t-s); }
.afinidade dt { color: var(--texto-3); font-weight: 600; text-transform: uppercase; font-size: 0.875rem; letter-spacing: 0.08em; padding-top: 2px; }
.afinidade dd { margin: 0; }

/* ---------- tela inicial ---------- */
.iniciais { display: grid; gap: 18px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); align-items: stretch; }
.inicial > .btn--grande { margin-top: auto; }
@media (min-width: 960px) { .inicial .cavalo-titulo { min-height: 4.2em; } .iniciais-nav { display: none; } }
.inicial .retrato-palco { position: relative; display: flex; justify-content: center; background: var(--painel-2); padding: 8px 0 10px; margin: -14px -14px 0; box-shadow: inset 0 -2px 0 0 var(--linha); }
.inicial .contador { position: absolute; right: 8px; top: 8px; font-family: var(--fonte-display); font-size: 8px; color: var(--texto-2); background: var(--sombra); padding: 4px 6px; }
.inicial .cavalo-nome { font-size: 24px; }
.inicial-topo { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.iniciais-nav { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.iniciais-nav .pilula { min-height: 48px; padding-inline: 10px; gap: 6px; }
.iniciais-nav .nota { flex-basis: 100%; }

/* ---------- estábulo ---------- */
.selvagens { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
.selvagem { background: var(--painel-2); padding: 8px; display: flex; flex-direction: column; gap: 4px; align-items: flex-start; min-width: 0; }
.selvagem .retrato { align-self: center; margin-bottom: 6px; }
.selvagem b { font-size: var(--t-m); }
.selvagem .nota { font-size: var(--t-xs); line-height: 1.3; }
.selvagem--comum { box-shadow: inset 0 -4px 0 0 var(--r-comum); }
.selvagem--magico { box-shadow: inset 0 -4px 0 0 var(--r-magico); }
.selvagem--raro { box-shadow: inset 0 -4px 0 0 var(--r-raro); }
.selvagem--lendario { box-shadow: inset 0 -4px 0 0 var(--r-lendario); }
.selvagem--mitico { box-shadow: inset 0 -4px 0 0 var(--r-mitico); }
.aviso { background: var(--painel-2); padding: 10px 12px; color: var(--texto); font-size: var(--t-s); box-shadow: inset 4px 0 0 0 var(--ouro); margin: 0; }
.aviso--perda { box-shadow: inset 4px 0 0 0 var(--perda); }
.confirma { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }

/* ---------- sala de largada ---------- */
.perfil { margin: 0 auto; }
.dicas { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; font-size: var(--t-s); }
.dicas li { display: flex; gap: 8px; align-items: baseline; }
.dicas li::before { content: ""; flex: none; width: 8px; height: 8px; background: var(--texto-3); transform: translateY(-1px); }
.dicas li.bom::before { background: var(--ganho); }
.dicas li.ruim::before { background: var(--perda); }
.dicas li.anulado::before { background: var(--agua); }
.dicas li.dica { color: var(--texto-2); }
.dicas li.dica::before { background: var(--ouro); }

 * MMORPG Horse — simulação de corrida (protótipo descartável).
 *
 * RaceSim.simulate(config) é uma FUNÇÃO PURA e DETERMINÍSTICA de (config, seed):
 * sem Math.random, sem Date, sem estado global. O servidor simularia; o cliente só
 * anima os frames. No laço só há + - * / (raízes por Newton), então o resultado é
 * idêntico bit a bit em qualquer motor JS.
 *
 * ============================== MODELO ======================================
 * Passo fixo dt = 0.1 s. RNG mulberry32; cada corredor tem um fluxo próprio
 * derivado de hash(seed, índice). Constantes em RaceSim.TUNING (ajustadas com
 * tools/balance.js).
 *
 * STATUS EFETIVOS (computeStats)
 *   status = base + pot*0.1 + (level-1) * (0.50 + 0.65*pot/31) * raridade.growth
 *   limitado a raridade.statCap; depois + bônus do elemento (+8 no status dele) e
 *   + mods do item. Na corrida, a AFINIDADE do elemento multiplica todos os status
 *   (cada regra ±4% × peso da regra; total limitado a 0,92–1,08) e, quando favorável,
 *   22% dela vai direto na vMax (afinidade +8% => vMax +1,8%). Sem isso, um único fator
 *   favorável (ex.: só a chuva para Água) quase não mudava a chance de vitória.
 *
 * POR CORREDOR (n(x) = status/100)
 *   vMax  = (16.8 + 2.2*n(vel)) * formaDoDia * (1 + 0.22*max(0, afinidade-1))   ~16,8–19 m/s
 *   accel = 0.6 + 2.4*n(acel) m/s²   (largada e retomadas; Aceleração encurta a reação)
 *   tanque de estamina = 66 + 20*n(est)
 *   formaDoDia: ruído triangular ±10% por corredor (racerInfo.disposicao). É a maior
 *   fonte de zebra: sem ele um Comum nunca venceria um Lendário.
 *
 * ESTAMINA
 *   gasto/s = (v / tetoComBoosts)^4 * (1600/distância)^0.4 * mods / tanque
 *   mods: areia/terra, sol (+4%), subida (+30%, aliviada por Força), vácuo (−10%
 *   para perseguidor/arrancador a 0,5–4 m atrás de alguém), habilidades.
 *   Pistas longas apertam mais o tanque => Estamina pesa mais em 2400 m.
 *   Boosts de Garra, de habilidade e da tática elevam o teto SEM custo extra.
 *   Estamina 0 => ritmo cai para 75% até o fim + evento 'cansou'.
 *
 * RITMO (fração s de vMax), pelo "jóquei"
 *   aff = ritmo constante que o tanque restante sustenta até o fim (forma fechada,
 *   affordablePace); o jóquei lê o tanque com um erro de −2%..+6% (às vezes cansa).
 *   ponteiro:    até 30% corre a 1.00 SEM economizar (+3% grátis em curta, +1,5% em média),
 *                depois min(0.97, aff), sprint até 1.00. Forte em curta, murcha em longa.
 *   perseguidor: min(0.97, aff) até 72%, sprint até 1.03. Ganha vácuo. Estável.
 *   arrancador:  guarda 4% (min(0.93/0.95, aff*0.96)) até 70%, sprint até 1.06 com
 *                explosão grátis (+0% curta, +2,5% média, +5% longa) e +15% de chance
 *                de Garra. Fraco em curta, forte em longa.
 *   Ritmo mínimo voluntário 0.80.
 *
 * VELOCIDADE-ALVO = s * vMax * terreno * pelotão * chuva * boosts * jitter(±0,3%)
 *   terreno: terra −3%, areia −6%, subida −15% (Força alivia 70–80%);
 *   pelotão: até −3% com vizinhos a ≤2,5 m (Força alivia 80%); chuva −1,5% para todos.
 *   A velocidade sobe com accel e desce a 1,2 m/s².

 * GARRA: ao cruzar 80%, rola chance = 0.10 + 0.70*n(garra) (+ item, + tática).

 *

 *

    var h = (Math.imul((a >>> 0) ^ 0x85EBCA6B, 0x9E3779B1) + Math.imul((b >>> 0) + 0x27D4EB2F, 0xC2B2AE35)) >>> 0;

    h ^= h >>> 15; h = Math.imul(h, 0x846CA68B) >>> 0;
    h ^= h >>> 16;
    return h >>> 0;
  }

  function clamp(x, lo, hi) { return x < lo ? lo : (x > hi ? hi : x); }

  // Aritmética só com + - * / (IEEE 754 exato em qualquer motor JS), para que a mesma
  // seed dê o mesmo resultado no Node, Chrome, Safari etc. Nada de Math.pow/exp/log no laço.
  function powi(x, k) { var r = 1; for (var i = 0; i < k; i++) r *= x; return r; }
  function nthRoot(x, m) {
    if (!(x > 0)) return 0;
    if (m === 1) return x;
    var y = 1 + (x - 1) / m;
    if (y <= 0) y = 0.5;
    for (var i = 0; i < 80; i++) {
      var ny = ((m - 1) * y + x / powi(y, m - 1)) / m;
      var d = ny - y;
      y = ny;
      if (d < 1e-13 * y && d > -1e-13 * y) break;
    }
    return y;
  }
  // x^(num/den); exp pode ser [num, den] ou um inteiro.
  function ratPow(x, exp) {
    if (typeof exp === 'number') return (exp % 1 === 0) ? powi(x, exp) : Math.pow(x, exp); // não-inteiro: não portátil
    return nthRoot(powi(x, exp[0]), exp[1]);
  }
  function r2(x) { return Math.round(x * 100) / 100; }
  function r3(x) { return Math.round(x * 1000) / 1000; }
  function fmtTime(s) { return s.toFixed(2).replace('.', ',') + 's'; }

  // ---------------------------------------------------------------------------
  // Status
  // ---------------------------------------------------------------------------
  function computeStats(horse, itemId) {
    var rar = GameData.RARITIES[horse.rarity] || GameData.RARITIES.comum;
    var lvl = clamp(Math.floor(horse.level || 1), 1, GameData.ECONOMY.maxLevel || 50);
    var el = GameData.ELEMENTS[horse.element];
    var item = itemId ? GameData.ITEMS[itemId] : null;
    var out = {};
    for (var i = 0; i < STAT_KEYS.length; i++) {
      var k = STAT_KEYS[i];
      var base = (horse.base && horse.base[k]) || 1;
      var pot = clamp((horse.potential && horse.potential[k]) || 0, 0, 31);
      var growth = (T.growthBase + T.growthPot * pot / 31) * (rar.growth || 1);
      var v = base + pot * T.potFlat + (lvl - 1) * growth;
      v = Math.min(v, rar.statCap);
      if (el && el.statBonus && el.statBonus.stat === k) v += el.statBonus.amount;
      if (item && item.mods && item.mods[k]) v += item.mods[k];
      out[k] = clamp(Math.round(v), 1, 120);
    }
    return out;
  }

  // Rating de Poder: soma ponderada dos status efetivos + habilidades + especial do item.
  // Cada habilidade vale 20 × a chance de o gatilho disparar numa corrida típica: clima, piso e
  // subida só acontecem em ~1/3 das corridas, então valem ~1/3 (antes valiam 20 cheios e
  // inflavam o rating de Garoa, Mandacaru etc.).
  var SKILL_TRIGGER_WEIGHT = { start: 1, straight: 1, curve: 0.8, curveExit: 0.8, hill: 0.6, lowStamina: 0.8, final: 1, dice: 1 };
  function skillWeight(id) {
    var sk = GameData.SKILLS[id];
    if (!sk) return 0;
    var trig = sk.trigger || '';
    if (trig.indexOf('weather:') === 0) return 0.4;
    return SKILL_TRIGGER_WEIGHT[trig] != null ? SKILL_TRIGGER_WEIGHT[trig] : 1;
  }
  function itemSpecialPoints(horse, itemId) {
    var item = itemId ? GameData.ITEMS[itemId] : null;
    var sp = item && item.special;
    if (!sp) return 0;
    var pts = 0;
    if (sp.staminaPoolMult) pts += (sp.staminaPoolMult - 1) * 400;
    if (sp.garraChanceBonus) pts += sp.garraChanceBonus * 120;
    if (sp.ignoreWeatherPenalty) pts += 8;
    return pts;
  }
  // Chance de uma skill disparar quando o gatilho acontece.
  function skillChance(horse, stats) {
    var rar = GameData.RARITIES[horse.rarity] || GameData.RARITIES.comum;
    var c = rar.skillChance + T.skillPerLevel * ((horse.level || 1) - 1) + T.skillPerSorte * ((stats && stats.sorte) || 0);
    return Math.min(T.skillChanceMax, c);
  }
  // Sorteia uma skill nova ao subir de nível (ou null). Não muta a montaria.
  // Ordem das chamadas de rng: 1) portão de T.learnChance, 2) escolha do candidato.
  function learnSkill(mount, rng) {
    var rar = GameData.RARITIES[mount.rarity] || GameData.RARITIES.comum;
    var owned = mount.skills || [];
    if (owned.length >= rar.skillSlots) return null;
    if (rng() >= T.learnChance) return null;
    var cands = [];
    Object.keys(GameData.SKILLS).forEach(function (id) {
      var sk = GameData.SKILLS[id];
      if (sk.element !== 'neutro' && sk.element !== mount.element) return;
      if (sk.exclusive && sk.exclusive !== mount.id) return;
      if (owned.indexOf(id) >= 0) return;
      cands.push(id);
    });
    if (!cands.length) return null;
    return cands[Math.floor(rng() * cands.length)];
  }
  function powerRating(horse, itemId) {
    var s = computeStats(horse, itemId);
    var skillPts = 0;
    (horse.skills || []).forEach(function (id) { skillPts += 20 * skillWeight(id); });
    var w = T.ratingW, sum = 0;
    for (var i = 0; i < STAT_KEYS.length; i++) sum += s[STAT_KEYS[i]] * w[STAT_KEYS[i]];
    return Math.round(sum + skillPts + itemSpecialPoints(horse, itemId));
  }

  function leagueFor(rating) {
    var L = GameData.LEAGUES, pick = L[0];
    for (var i = 0; i < L.length; i++) if (rating >= L[i].min) pick = L[i];
    var idx = L.indexOf(pick);
    var next = L[idx + 1];
    return { id: pick.id, name: pick.name, min: pick.min, max: next ? next.min - 1 : null, color: pick.color };
  }

  // ---------------------------------------------------------------------------
  // Condições
  // ---------------------------------------------------------------------------
  var SURF_LIST = ['grama', 'terra', 'areia'];
  var WEATHER_LIST = ['sol', 'chuva', 'nevoa', 'nublado'];
  var BLOCK_LIST = ['reta', 'curva', 'subida'];

  // Pista em blocos, toda derivada da seed. Ordem das chamadas de rng:
  // distância, nº de blocos B, pesos (B), tipos (B-2), superfície, clima.
  function randomConditions(seed) {
    var rng = mulberry32(hash2(seed, 0xC0FFEE));
    var distance = 1000 + 100 * Math.floor(rng() * 15);
    var B = 5 + Math.floor(rng() * 5);
    var weights = [], total = 0, i;
    for (i = 0; i < B; i++) { weights.push(0.5 + rng()); total += weights[i]; }
    var blocks = [], acc = 0, from = 0, to;
    for (i = 0; i < B; i++) {
      acc += weights[i];
      // fronteiras acumuladas arredondadas a 10 m; o último bloco fecha em `distance`
      to = (i === B - 1) ? distance : Math.round(distance * acc / total / 10) * 10;
      var type = (i === 0 || i === B - 1) ? 'reta' : BLOCK_LIST[Math.floor(rng() * 3)];
      blocks.push({ type: type, from: from, to: to });
      from = to;
    }
    var surface = SURF_LIST[Math.floor(rng() * 3)];
    var weather = WEATHER_LIST[Math.floor(rng() * 4)];
    return { distance: distance, surface: surface, weather: weather, blocks: blocks };
  }

  // Blocos são válidos se contíguos a partir de 0 e (quando dada) terminam em `distance`.
  function validBlocks(blocks, distance) {
    if (!blocks || !blocks.length) return false;
    var prev = 0;
    for (var i = 0; i < blocks.length; i++) {
      var b = blocks[i];
      if (!b || !GameData.BLOCK_TYPES[b.type]) return false;
      if (b.from !== Math.floor(b.from) || b.to !== Math.floor(b.to) || !(b.from < b.to)) return false;
      if (b.from !== prev) return false;
      prev = b.to;
    }
    return distance == null || prev === distance;
  }

  // Campos ausentes (ex.: pista de exemplo sem `weather`) são sorteados pela seed;
  // sem seed (dicas de UI) ficam neutros (1600 m, grama, nublado, uma reta única).
  function normalizeConditions(c, seed) {
    c = c || {};
    var rnd = (seed == null) ? null : randomConditions(seed);
    var given = c.distance || null;
    var blocks;
    if (validBlocks(c.blocks, given)) {
      blocks = c.blocks;
      if (!given) given = blocks[blocks.length - 1].to;
    } else {
      if (!given) given = rnd ? rnd.distance : 1600;
      if (rnd && rnd.distance === given) blocks = rnd.blocks;
      else blocks = rnd && !c.distance ? rnd.blocks : [{ type: 'reta', from: 0, to: given }];
    }
    return {
      distance: given,
      surface: GameData.SURFACES[c.surface] ? c.surface : (rnd ? rnd.surface : 'grama'),
      weather: GameData.WEATHERS[c.weather] ? c.weather : (rnd ? rnd.weather : 'nublado'),
      blocks: blocks.map(function (b) { return { type: b.type, from: b.from, to: b.to }; })
    };
  }

  // Índice do bloco que contém `pos` (varredura linear; pos >= fim -> último; pos < 0 -> 0).
  function blockAt(blocks, pos) {
    for (var i = 0; i < blocks.length; i++) if (pos < blocks[i].to) return i;
    return blocks.length - 1;
  }

  // Fração (0-1) do comprimento total ocupada por blocos do tipo dado.
  function blockShare(blocks, type) {
    var len = 0;
    for (var i = 0; i < blocks.length; i++) if (blocks[i].type === type) len += blocks[i].to - blocks[i].from;
    var total = blocks.length ? blocks[blocks.length - 1].to - blocks[0].from : 0;
    return total > 0 ? len / total : 0;
  }

  function rangesOf(blocks, type) {
    var out = [];
    for (var i = 0; i < blocks.length; i++) if (blocks[i].type === type) out.push([blocks[i].from, blocks[i].to]);
    return out;
  }
  function hillsFromBlocks(blocks) { return rangesOf(blocks, 'subida'); }
  function curvesFromBlocks(blocks) { return rangesOf(blocks, 'curva'); }

  // ---------------------------------------------------------------------------
  // Pagamentos
  // ---------------------------------------------------------------------------
  function payouts(entryFee, numRacers, finishOrder) {
    var E = GameData.ECONOMY;
    entryFee = Math.max(0, Math.floor(entryFee));
    var pot = entryFee * numRacers;
    var fee = Math.round(pot * E.houseFee);
    var dist = pot - fee;
    var order = finishOrder || [];
    var places = Math.min(E.payoutSplit.length, order.length, numRacers);
    var prizes = [];
    if (places <= 0) return { pot: pot, fee: pot, prizes: prizes };
    // divisão por tamanho do campo (ECONOMY.payoutSplitFor): em campos pequenos pagam menos
    // posições, para que todo lugar premiado receba pelo menos a entrada de volta.
    var full = (typeof E.payoutSplitFor === 'function' ? E.payoutSplitFor(numRacers) : null) || E.payoutSplit;
    places = Math.min(places, full.length);
    var split = full.slice(0, places);
    var tot = 0, i;
    for (i = 0; i < split.length; i++) tot += split[i];
    var given = 0;
    for (i = 0; i < places; i++) {
      var amount = (i === places - 1) ? dist - given : Math.floor(dist * split[i] / tot);
      given += amount;
      prizes.push({ racer: order[i], place: i + 1, amount: amount });
    }
    // o resto do arredondamento cai no último pago e, com fees minúsculos, invertia prêmios
    // (ex.: fee 1, n=6 → [2, 1, 2]); reordena os valores para nunca pagar mais a quem chega depois
    var amounts = prizes.map(function (p) { return p.amount; }).sort(function (a, b) { return b - a; });
    for (i = 0; i < places; i++) prizes[i].amount = amounts[i];
    return { pot: pot, fee: fee, prizes: prizes };
  }

  // ---------------------------------------------------------------------------
  // Simulação
  // ---------------------------------------------------------------------------
  // Fração do trecho [from, to) que cai em blocos de subida (usada na estimativa de gasto do jóquei).
  function hillFraction(blocks, from, to) {
    if (to <= from) return 0;
    var len = 0;
    for (var i = 0; i < blocks.length; i++) {
      if (blocks[i].type !== 'subida') continue;
      var a = Math.max(from, blocks[i].from), b = Math.min(to, blocks[i].to);
      if (b > a) len += b - a;
    }
    return len / (to - from);
  }

  // Maior ritmo constante s (fração de vMax) que o tanque restante sustenta até o fim.
  // gasto = rem/(s*v) * K * c * s^k / pool  =>  s = (avail*pool*v / (rem*K*c))^(1/(k-1))
  function affordablePace(avail, remaining, vRef, pool, cdrain) {
    if (avail <= 0) return 0;
    if (remaining <= 0) return 9;
    var x = avail * pool * vRef / (remaining * T.drainK * cdrain);
    return nthRoot(x, T.drainExp - 1);
  }

  // Multiplicador de clima de um elemento: dono do clima => T.weatherMult (T.weatherMultDouble
  // com skill de clima ativa); elemento penalizado => 2 - T.weatherMult (0,95); senão 1.
  function weatherMult(element, weather, doubled) {
    var w = GameData.WEATHERS[weather];
    var el = GameData.ELEMENTS[element];
    if (!w || !el) return 1;
    if (el.weather === weather) return doubled ? T.weatherMultDouble : T.weatherMult;
    if (w.penalizes === element) return 2 - T.weatherMult;
    return 1;
  }

  // (Re)calcula os números do corredor que dependem do clima. Pode ser chamada de novo no meio da
  // corrida (troca de clima, skill que dobra o bônus, bônus de Garra): só lê statsN e os totais.
  function applyWeather(r, weather) {
    var m = weatherMult(r.element, weather, r.weatherDouble);
    if (m < 1 && r.ignoreWeatherPenalty) m = 1;   // item Capa: anula a penalidade
    var sn = r.statsN;
    r.weatherM = m;
    r.vMax = (T.vBase + T.vRange * sn.vel * m) * (1 + T.weatherVel * (m - 1));
    r.accel = T.aBase + T.aRange * sn.acel * m;
    r.nf = sn.forca * m;
    r.nm = sn.man * m;
    var ng = sn.garra * m;
    r.garraChance = clamp(T.garraChanceBase + T.garraChanceRange * ng + r.garraBonusTotal, 0, T.garraChanceMax);
    r.garraBoost = 1 + T.garraBoostBase + T.garraBoostRange * ng + r.garraBoostBonusTotal;
  }

  // Ordem das chamadas de r.rng() (fluxo próprio de cada corredor; manter estável):
  //   montagem: 1) startDelay, 2) jockeyErr;
  //   por tick: 3) tentativas de skill (só quando um gatilho acontece; na ordem dos gatilhos
  //   start/bloco/clima/lowStamina/final e, dentro de cada gatilho, na ordem da lista de skills),
  //   4) sorteio da Garra (uma vez, ao cruzar garraZone), 5) jitter.
  function buildRacer(entry, index, cond, rng) {
    var horse = entry.horse;
    var itemId = entry.itemId || null;
    var item = itemId ? GameData.ITEMS[itemId] : null;
    var special = (item && item.special) || {};
    var stats = computeStats(horse, itemId);
    var statsN = {};
    for (var i = 0; i < STAT_KEYS.length; i++) statsN[STAT_KEYS[i]] = stats[STAT_KEYS[i]] / 100;
    var skills = (horse.skills || []).filter(function (id) { return !!GameData.SKILLS[id]; });
    var r = {
      index: index,
      name: entry.name || horse.name,
      horseName: horse.name,
      element: horse.element,
      stats: stats,
      statsN: statsN,
      skillChance: skillChance(horse, stats),
      pool: (T.poolBase + T.poolEst * statsN.est) * (special.staminaPoolMult || 1),   // tanque fixo (sem clima)
      ignoreWeatherPenalty: !!special.ignoreWeatherPenalty,
      garraBonusTotal: special.garraChanceBonus || 0,
      garraBoostBonusTotal: 0,
      weatherDouble: false,
      extraDice: 0,
      startDelay: rng() * T.startDelayMax * (1 - 0.5 * clamp(statsN.acel, 0, 1)),
      jockeyErr: T.jockeyErrMin + rng() * (T.jockeyErrMax - T.jockeyErrMin),
      rng: rng,
      skills: skills,
      started: false,
      blockIdx: -1,
      tried: {},
      effects: [],
      pos: 0, v: 0, stamina: 1,
      exhausted: false, finished: false, finishTime: null,
      garraRolled: false, garraMult: 1
    };
    applyWeather(r, cond.weather);
    return r;
  }

  // Dado da Sorte de uma montaria. Ordem das chamadas de rng() (manter estável): d1, sorteio do
  // 2º dado (sempre consumido, mesmo com sorte 0 ou 100), d2 (se houver), dado extra (Dado Viciado).
  // Sorte = chance, em %, de rolar dois dados e ficar com o melhor; extraDice limitado a 1 (até 3 dados).
  function rollDice(rng, sorte, extraDice) {
    var dice = [1 + Math.floor(rng() * 100)];
    var p = clamp((sorte || 0) / 100, 0, 1);
    if (rng() < p) dice.push(1 + Math.floor(rng() * 100));
    var extra = clamp(Math.floor(extraDice || 0), 0, 1);
    for (var k = 0; k < extra; k++) dice.push(1 + Math.floor(rng() * 100));
    var best = dice[0];
    for (k = 1; k < dice.length; k++) if (dice[k] > best) best = dice[k];
    return { dice: dice, best: best };
  }

  var DICE_PHRASE = { sol: 'o sol abre!', chuva: 'começa a chover!', nevoa: 'a névoa desce!' };

  function simulate(config) {
    config = config || {};
    var seed = (config.seed >>> 0);
    var cond = normalizeConditions(config.conditions || randomConditions(seed), seed);
    var D = cond.distance;
    var blocks = cond.blocks;
    var entries = config.racers || [];
    var n = entries.length;
    var dt = T.dt;
    var record = config.recordFrames !== false;
    var surf = GameData.SURFACES[cond.surface];
    // efeitos gerais do clima vigente (recalculados quando o Dado vira o clima)
    var weatherDrain, weatherSlow;
    function setWeatherGlobals(w) {
      weatherDrain = w === 'sol' ? T.sunDrain : 1;
      weatherSlow = w === 'chuva' ? (1 - T.rainSlow) : 1;
    }
    setWeatherGlobals(cond.weather);
    var distDrain = ratPow(T.drainRefDist / D, T.drainDistExp); // pistas longas gastam menos por segundo (mas duram mais)
    // clima vigente (o Dado da Sorte troca no meio da corrida e chama applyWeather de novo)
    cond.weatherAtual = cond.weather;
    // Dado da Sorte: fluxo próprio, para não perturbar os fluxos por corredor
    var diceRng = mulberry32(hash2(seed, 0xD1CE));
    var diceAt = T.diceAt || [];
    var diceIdx = 0;

    var R = [];
    for (var i = 0; i < n; i++) R.push(buildRacer(entries[i], i, cond, mulberry32(hash2(seed, i + 1))));
    // nome usado na narração: nome do cavalo; se dois corredores têm cavalos de mesmo nome, acrescenta o jogador
    for (i = 0; i < n; i++) {
      var dup = false;
      for (var q = 0; q < n; q++) if (q !== i && R[q].horseName === R[i].horseName) dup = true;
      R[i].label = (dup && R[i].name !== R[i].horseName) ? R[i].horseName + ' (' + R[i].name + ')' : R[i].horseName;
    }

    var events = [];
    function ev(t, racer, type, text) { events.push({ t: r2(t), racer: racer, type: type, text: text }); }

    var frames = [];
    function pushFrame(t) {
      if (!record) return;
      var pos = new Array(n), speed = new Array(n), stam = new Array(n);
      for (var j = 0; j < n; j++) { pos[j] = r2(R[j].pos); speed[j] = r2(R[j].v); stam[j] = r3(R[j].stamina); }
      frames.push({ t: t, pos: pos, speed: speed, stamina: stam });
    }
    pushFrame(0);

    // Uma tentativa por gatilho (por corrida; por bloco se blockScoped): sorteia contra r.skillChance.
    function tryFire(r, id, t, pos, blockTo) {
      var sk = GameData.SKILLS[id];
      var e = sk.effect || {};
      var key = e.blockScoped ? id + '#' + r.blockIdx : id;
      if (r.tried[key]) return;
      r.tried[key] = true;
      if (!(r.rng() < r.skillChance)) return;
      if (e.staminaRestore && !r.exhausted) r.stamina = Math.min(1, r.stamina + e.staminaRestore);
      if (e.extraDice) r.extraDice += e.extraDice;
      var reweather = false;
      if (e.garraChanceBonus) { r.garraBonusTotal += e.garraChanceBonus; reweather = true; }
      if (e.garraBoostBonus) { r.garraBoostBonusTotal += e.garraBoostBonus; reweather = true; }
      if (e.weatherDouble) { r.weatherDouble = true; reweather = true; }
      if (reweather) applyWeather(r, cond.weatherAtual);
      if (e.speedMult || e.accelMult || e.drainMult || e.curveBonus || e.hillBonus || e.hillDrainMult) {
        r.effects.push({
          untilT: e.durationS ? t + e.durationS : null,
          untilPos: e.distanceM ? pos + e.distanceM : (e.blockScoped ? blockTo : null),
          speedMult: e.speedMult || 1,
          accelMult: e.accelMult || 1,
          drainMult: e.drainMult || 1,
          curveBonus: e.curveBonus || 0,
          hillBonus: e.hillBonus || 0,
          hillDrainMult: e.hillDrainMult || 1
        });
      }
      ev(t, r.index, 'skill', r.label + ' ativou ' + sk.name + '!');
    }

    // Tenta todas as skills do corredor com o gatilho dado (na ordem da lista).
    function trigger(r, trig, t, pos, blockTo) {
      for (var s = 0; s < r.skills.length; s++) {
        if (GameData.SKILLS[r.skills[s]].trigger === trig) tryFire(r, r.skills[s], t, pos, blockTo);
      }
    }

    // Liderança
    var leader = -1, cand = -1, candSince = 0, lastLeadEvent = -1e9, leadInit = false;

    var finishedCount = 0;
    var step = 0;
    var prevPos = new Array(n);
    var order = [];
    for (i = 0; i < n; i++) order.push(i);

    while (finishedCount < n) {
      step++;
      var t = step / 10; // dt = 0.1 exato, sem acumular erro
      if (t > T.maxTime) break;
      var tPrev = (step - 1) / 10;

      for (i = 0; i < n; i++) prevPos[i] = R[i].pos;
      // ranking pelo snapshot (maior pos primeiro; empate: menor índice)
      order.sort(function (a, b) { return (prevPos[b] - prevPos[a]) || (a - b); });

      for (i = 0; i < n; i++) {
        var r = R[i];
        if (r.finished) {
          r.v = Math.max(0, r.v - 8 * dt);
          continue;
        }
        var pos = prevPos[i];
        if (!r.started) { r.started = true; trigger(r, 'start', tPrev, pos, null); }
        if (tPrev < r.startDelay) continue;   // ainda reagindo ao sinal de largada
        var p = pos / D;
        var rem = D - pos;

        // gatilhos de bloco (checados antes de mover, com o bloco de `pos`)

  function LruCanvasCache(maxBytes) { this.map = new Map(); this.bytes = 0; this.max = maxBytes; }

    this.map.set(k, c);
    this.bytes += c.width * c.height * 4;

  function drawBoard(ctx, cx, top, text, P, bg, fg) {
    var tw = measureText(text, P);
    var w = tw + 4 * P, h = 9 * P;
    var x = Math.round(cx - w / 2);
    ctx.fillStyle = '#1c1820'; ctx.fillRect(x - P, top - P, w + 2 * P, h + 2 * P);
    ctx.fillStyle = bg; ctx.fillRect(x, top, w, h);
    ctx.fillStyle = 'rgba(0,0,0,0.15)'; ctx.fillRect(x, top + h - P, w, P);
    drawText(ctx, text, x + 2 * P, top + 2 * P, { scale: P, color: fg });
    return { x: x, w: w, h: h };
  }

  // Subidas em relevo: a faixa da pista (e quem corre nela) sobe em rampa ao longo do trecho e
  // desce rápido no fim (placa FIM), o mesmo desenho do perfil da sala de largada. Em rampa (e não
  // em lombada) a inclinação aparece em qualquer ponto da subida, não só nas bordas.
  var HILL_AMP = 24;   // altura máxima em pixels de arte (trechos longos)
  function hillShape(m, a, b) {
    if (!(m > a && m < b)) return 0;
    var len = b - a, d = Math.min(0.3, 30 / len), u = (m - a) / len;
    return u < 1 - d ? u / (1 - d) : (1 - u) / d;
  }
  function hillAmp(a, b) { return Math.max(10, Math.min(HILL_AMP, Math.round((b - a) * 0.1))); }
  // maxLift (opcional): teto da altura quando falta espaço acima da pista (ex.: celular deitado)
  function hillLiftAt(m, hills, maxLift) {
    if (!hills) return 0;
    for (var i = 0; i < hills.length; i++) {
      var a = hills[i][0], b = hills[i][1];
      if (m > a && m < b) {
        var amp = hillAmp(a, b);
        if (maxLift != null) amp = Math.min(amp, maxLift);
        return Math.round(amp * hillShape(m, a, b));
      }
    }
    return 0;
  }

  function drawTrack(ctx, o) {
    var W = o.width, Hh = o.height;
    var lanes = o.lanes || 6, laneH = o.laneH || 24, laneTop = o.laneTop || Math.round(Hh * 0.35);
    var ppm = Math.max(0.05, o.pxPerMeter || 4), cam = o.cameraX || 0, t = o.t || 0;
    var weather = o.weather || 'sol', surface = o.surface || 'grama';
    var P = o.pixel || Math.max(1, Math.round(laneH / 12));
    var trackH = lanes * laneH, trackBottom = laneTop + trackH;
    var camPx = cam * ppm;
    function sx(m) { return Math.round((m - cam) * ppm); }
    crisp(ctx);

    // --- céu em faixas
    var sky = SKY[weather] || SKY.sol;
    var horizon = laneTop - 22 * P; // linha do chão atrás da arquibancada
    var bandH = Math.ceil(horizon / sky.length / P) * P;
    for (var b = 0; b < sky.length; b++) { ctx.fillStyle = sky[b]; ctx.fillRect(0, b * bandH, W, bandH + 1); }
    if (horizon > sky.length * bandH) { ctx.fillStyle = sky[sky.length - 1]; ctx.fillRect(0, sky.length * bandH, W, horizon - sky.length * bandH); }

    // sol de fundo
    if (weather === 'sol') {
      var sunX = Math.round(W * 0.82), sunY = Math.round(Math.max(10 * P, horizon * 0.25)), r = 7 * P;
      ctx.fillStyle = 'rgba(255,240,180,0.35)';
      ctx.fillRect(sunX - r - 3 * P, sunY - r + 2 * P, 2 * r + 6 * P, 2 * r - 4 * P);
      ctx.fillRect(sunX - r + 2 * P, sunY - r - 3 * P, 2 * r - 4 * P, 2 * r + 6 * P);
      ctx.fillStyle = '#fff3b0';
      ctx.fillRect(sunX - r, sunY - r + 2 * P, 2 * r, 2 * r - 4 * P);
      ctx.fillRect(sunX - r + 2 * P, sunY - r, 2 * r - 4 * P, 2 * r);
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(sunX - r + 3 * P, sunY - r + 2 * P, 3 * P, 2 * P);
    }

    // nuvens de fundo
    var nClouds = weather === 'sol' ? 3 : weather === 'nublado' ? 7 : 9;
    for (var ci = 0; ci < nClouds; ci++) {
      var cc = cloudCanvas(ci % 5, P, weather);
      var span = W + cc.width * 2;
      var cxp = mod(hash(ci + 40) * span - camPx * 0.02 - t * (3 + ci % 3) * P, span) - cc.width;
      var cyp = Math.round((0.08 + 0.55 * hash(ci + 70)) * (horizon - 30 * P));
      if (weather !== 'sol') cyp = Math.round((hash(ci + 70) * 0.6) * (horizon - 30 * P));
      ctx.drawImage(cc, Math.round(cxp), Math.max(0, cyp));
    }

    // montanhas distantes e colinas
    var HC = HILLS[weather] || HILLS.sol;
    function ridge(par, base, amp, freq, col, seedOff) {
      ctx.fillStyle = col;
      var off = camPx * par;
      for (var x = 0; x < W; x += P) {
        var wx = (x + off) / P;
        var hgt = base + amp * (0.65 * vnoise(wx * freq + seedOff) + 0.35 * vnoise(wx * freq * 3.1 + seedOff * 2));
        hgt = Math.round(hgt) * P;
        ctx.fillRect(x, horizon - hgt, P, hgt);
      }
    }
    ridge(0.03, 8, 22, 0.012, HC.far, 10);
    ridge(0.08, 4, 14, 0.02, HC.mid, 50);
    // copas de árvores na colina próxima
    ridge(0.15, 2, 6, 0.08, HC.near, 90);

    // arquibancada (tile repetido)
    var frame = Math.floor(t * 3) % 2;
    var st = standTile(weather, frame);
    var stW = st.width * P, stH = st.height * P;
    var stY = laneTop - 4 * P - stH;
    var stOff = mod(camPx * 0.35, stW);
    for (var sxp = -stOff; sxp < W; sxp += stW) ctx.drawImage(st, Math.round(sxp), stY, stW, stH);

    // gramado entre arquibancada e pista
    ctx.fillStyle = weather === 'chuva' ? '#3f6a3c' : weather === 'nublado' ? '#4a7c44' : '#58944a';
    ctx.fillRect(0, laneTop - 4 * P, W, 4 * P);

    // --- superfície da pista
    var artH = Math.ceil(trackH / P);
    var tile = surfaceTile(surface, weather, artH);
    var tw = tile.width * P;
    var tOff = mod(camPx, tw);
    for (var tx = -tOff; tx < W; tx += tw) ctx.drawImage(tile, Math.round(tx), laneTop, tw, artH * P);

    // divisórias de raia
    var SC = SURF[surface] || SURF.grama;
    for (var l = 1; l < lanes; l++) {
      var ly = laneTop + l * laneH;
      ctx.fillStyle = rgba('#ffffff', surface === 'areia' ? 0.28 : 0.16);
      var dash = 6 * P, gap = 4 * P, dOff = mod(camPx, dash + gap);
      for (var dx = -dOff; dx < W; dx += dash + gap) ctx.fillRect(Math.round(dx), ly - Math.floor(P / 2), dash, Math.max(1, Math.floor(P / 2) || 1));
    }
    // borda escura no topo da pista (sombra da cerca)
    ctx.fillStyle = 'rgba(0,0,0,0.18)'; ctx.fillRect(0, laneTop, W, P);
    // raia destacada (a do jogador): faixa dourada translúcida com bordas tracejadas
    var hl = o.highlightLane;
    if (hl != null && hl >= 0 && hl < lanes) {
      var hly = laneTop + hl * laneH;
      ctx.fillStyle = 'rgba(242,194,48,0.12)'; ctx.fillRect(0, hly, W, laneH);
      ctx.fillStyle = 'rgba(242,194,48,0.6)';
      var hd = 4 * P, hOff = mod(camPx, hd * 2);
      for (var hlx = -hOff; hlx < W; hlx += hd * 2) { ctx.fillRect(Math.round(hlx), hly, hd, P); ctx.fillRect(Math.round(hlx), hly + laneH - P, hd, P); }
    }

    // --- subidas
    var hills = o.hills || [];
    for (var hi = 0; hi < hills.length; hi++) {
      var a = sx(hills[hi][0]), bb = sx(hills[hi][1]);
      if (bb < -60 * P || a > W + 60 * P) continue;
      var x0 = Math.max(0, a), x1 = Math.min(W, bb);
      if (x1 > x0) {
        ctx.fillStyle = 'rgba(40,20,10,0.22)'; ctx.fillRect(x0, laneTop, x1 - x0, trackH);
        // hachura diagonal ancorada no mundo
        ctx.fillStyle = 'rgba(255,255,255,0.07)';
        var step = 10 * P;
        for (var yy = laneTop; yy < trackBottom; yy += P) {
          var shift = mod(-(yy - laneTop) + camPx, step);
          for (var hx = x0 - shift + step; hx < x1; hx += step) ctx.fillRect(Math.round(hx), yy, 3 * P, P);
        }
      }
      // linhas amarelas de início/fim
      ctx.fillStyle = '#f2c230';
      for (var ly2 = laneTop; ly2 < trackBottom; ly2 += 4 * P) {
        if (a >= 0 && a < W) ctx.fillRect(a, ly2, P, 2 * P);
        if (bb >= 0 && bb < W) ctx.fillRect(bb, ly2, P, 2 * P);
      }
    }

    // --- marcas de distância (linhas na pista)
    var ev = Math.max(10, o.distanceMarkersEvery || 200);
    var finishM = o.finishM || 1000;
    var mStart = Math.max(ev, Math.ceil((cam - 40 / ppm) / ev) * ev);
    var mEnd = cam + (W + 80) / ppm;
    for (var mm = mStart; mm <= mEnd; mm += ev) {
      if (mm >= finishM) break;
      var mx = sx(mm);
      ctx.fillStyle = 'rgba(255,255,255,0.28)';
      for (var my = laneTop; my < trackBottom; my += 3 * P) ctx.fillRect(mx, my, P, P * 2);
    }
    // largada
    var sx0 = sx(0);
    if (sx0 > -10 && sx0 < W + 10) { ctx.fillStyle = 'rgba(255,255,255,0.8)'; ctx.fillRect(sx0, laneTop, P, trackH); }

    // --- linha de chegada quadriculada
    var fx = sx(finishM);
    if (fx > -40 * P && fx < W + 40 * P) {
      var sq = 2 * P;
      for (var fy = laneTop, k = 0; fy < trackBottom; fy += sq, k++) {
        for (var col = 0; col < 2; col++) {
          ctx.fillStyle = (k + col) % 2 ? '#ffffff' : '#141218';
          ctx.fillRect(fx + col * sq, fy, sq, Math.min(sq, trackBottom - fy));
        }
      }
    }

    // --- cercas (externa em cima, interna embaixo)
    function rail(y, postsUp) {
      // postes a cada 4 m
      var every = 4, ps = Math.floor((cam - 8) / every) * every;
      for (var pm = ps; pm < cam + W / ppm + 8; pm += every) {
        var pxp = sx(pm);
        ctx.fillStyle = '#c9c2b6';
        ctx.fillRect(pxp, y - (postsUp ? 6 * P : 0), P, 6 * P);
      }
      ctx.fillStyle = '#1c1820'; ctx.fillRect(0, y - 6 * P - P, W, P);
      ctx.fillStyle = '#f6f2ea'; ctx.fillRect(0, y - 6 * P, W, 2 * P);
      ctx.fillStyle = '#c9c2b6'; ctx.fillRect(0, y - 4 * P, W, P);
      ctx.fillStyle = 'rgba(0,0,0,0.25)'; ctx.fillRect(0, y - 3 * P, W, P);
    }
    rail(laneTop, true);

    // placas de distância sobre a cerca externa
    for (var m2 = mStart; m2 <= mEnd; m2 += ev) {
      if (m2 >= finishM) break;
      var bx = sx(m2);
      ctx.fillStyle = '#e8e2d6'; ctx.fillRect(bx, laneTop - 18 * P, P, 18 * P);
      ctx.fillStyle = '#c83c3c';
      for (var sy2 = laneTop - 18 * P; sy2 < laneTop - 6 * P; sy2 += 4 * P) ctx.fillRect(bx, sy2, P, 2 * P);
      drawBoard(ctx, bx, laneTop - 28 * P, m2 + 'm', P, '#f6f2ea', '#1c1820');
    }
    // placas de subida
    for (var h2 = 0; h2 < hills.length; h2++) {
      var ha = sx(hills[h2][0]), hb = sx(hills[h2][1]);
      if (ha > -40 * P && ha < W + 40 * P) {
        ctx.fillStyle = '#5a3a24'; ctx.fillRect(ha, laneTop - 16 * P, P, 16 * P);
        var bd = drawBoard(ctx, ha, laneTop - 26 * P, 'SUBIDA', P, '#f2c230', '#1c1820');
        // rampinha
        ctx.fillStyle = '#1c1820';
        for (var q = 0; q < 4; q++) ctx.fillRect(bd.x + bd.w + 2 * P + q * P, laneTop - 19 * P - q * P, P, (q + 1) * P);
      }
      if (hb > -40 * P && hb < W + 40 * P) {
        ctx.fillStyle = '#5a3a24'; ctx.fillRect(hb, laneTop - 12 * P, P, 12 * P);
        drawBoard(ctx, hb, laneTop - 22 * P, 'FIM', P, '#f2c230', '#1c1820');
      }
    }
    if (sx0 > -40 * P && sx0 < W + 40 * P) {
      ctx.fillStyle = '#e8e2d6'; ctx.fillRect(sx0, laneTop - 14 * P, P, 14 * P);
      drawBoard(ctx, sx0, laneTop - 24 * P, 'LARGADA', P, '#3a7ae0', '#ffffff');
    }
    // poste de chegada + faixa quadriculada
    if (fx > -60 * P && fx < W + 60 * P) {
      var postTop = Math.max(22 * P, laneTop - 40 * P);
      ctx.fillStyle = '#1c1820'; ctx.fillRect(fx - P, postTop - P, 4 * P, laneTop - postTop + P);
      ctx.fillStyle = '#f6f2ea'; ctx.fillRect(fx, postTop, 2 * P, laneTop - postTop);
      // disco vermelho no topo
      ctx.fillStyle = '#1c1820'; ctx.fillRect(fx - 3 * P, postTop - 7 * P, 8 * P, 7 * P);
      ctx.fillStyle = '#d83030'; ctx.fillRect(fx - 2 * P, postTop - 6 * P, 6 * P, 5 * P);
      ctx.fillStyle = '#ff8a7a'; ctx.fillRect(fx - P, postTop - 5 * P, 2 * P, P);
      // bandeira quadriculada ondulando
      var fw = 14, fh = 8;
      for (var bxi = 0; bxi < fw; bxi++) {
        var wave = Math.round(Math.sin(t * 6 - bxi * 0.6) * 1.2);
        for (var byi = 0; byi < fh; byi++) {
          ctx.fillStyle = ((bxi >> 1) + (byi >> 1)) % 2 ? '#141218' : '#f6f2ea';
          ctx.fillRect(fx + 2 * P + bxi * P, postTop + 2 * P + (byi + wave) * P, P, P);
        }
      }
      drawBoard(ctx, fx + P, postTop - 19 * P, 'CHEGADA', P, '#141218', '#ffffff');
    }

    // --- cerca interna e gramado interno
    ctx.fillStyle = weather === 'chuva' ? '#355c38' : weather === 'nublado' ? '#41703f' : '#4c8a44';
    ctx.fillRect(0, trackBottom, W, Hh - trackBottom);
    // tufos e flores do gramado interno
    var inOff = camPx;
    for (var gi = 0; gi < 40; gi++) {
      var gw = 1200;
      var gx = mod(hash(gi + 300) * gw - inOff, gw);
      if (gx > W) continue;
      var gy = trackBottom + 4 * P + Math.round(hash(gi + 400) * Math.max(1, (Hh - trackBottom - 8 * P) / P)) * P;
      if (gy > Hh - 2 * P) continue;
      ctx.fillStyle = weather === 'chuva' ? '#2c4c2e' : '#3a7238';
      ctx.fillRect(Math.round(gx), gy, P, 2 * P); ctx.fillRect(Math.round(gx) + 2 * P, gy - P, P, 3 * P);
      if (gi % 4 === 0) { ctx.fillStyle = gi % 8 ? '#f2e04a' : '#f0f0f0'; ctx.fillRect(Math.round(gx) + P, gy - 2 * P, P, P); }
    }
    ctx.fillStyle = 'rgba(0,0,0,0.25)'; ctx.fillRect(0, trackBottom, W, P);
    // cerca interna (postes para baixo)
    var every2 = 4, ps2 = Math.floor((cam - 8) / every2) * every2;
    for (var pm2 = ps2; pm2 < cam + W / ppm + 8; pm2 += every2) {
      ctx.fillStyle = '#c9c2b6'; ctx.fillRect(sx(pm2), trackBottom + P, P, 4 * P);
    }
    ctx.fillStyle = '#f6f2ea'; ctx.fillRect(0, trackBottom + P, W, 2 * P);
    ctx.fillStyle = '#1c1820'; ctx.fillRect(0, trackBottom + 3 * P, W, P);
    if (fx > -10 && fx < W + 10) { ctx.fillStyle = '#f6f2ea'; ctx.fillRect(fx, trackBottom, 2 * P, 8 * P); }

    // --- relevo das subidas: copia as colunas da faixa (da cerca externa para baixo) para cima
    if (hills.length && o.hillRelief !== false) {
      var y0 = laneTop - 8 * P, innerC = weather === 'chuva' ? '#355c38' : weather === 'nublado' ? '#41703f' : '#4c8a44';
      var spanX = -1, spanDy = 0;
      var flush = function (xEnd) {
        if (spanX < 0 || spanDy <= 0) return;
        var w = xEnd - spanX;
        ctx.drawImage(ctx.canvas, spanX, y0, w, Hh - y0, spanX, y0 - spanDy, w, Hh - y0);
        // encosta: faixa de terra escura sob a cerca levantada e gramado no rodapé exposto
        ctx.fillStyle = innerC; ctx.fillRect(spanX, Hh - spanDy, w, spanDy);
      };
      for (var cx2 = 0; cx2 < W; cx2 += P) {
        var dy = hillLiftAt(cam + (cx2 + P / 2) / ppm, hills, o.hillMaxLift) * P;
        if (dy !== spanDy || spanX < 0) { flush(cx2); spanX = cx2; spanDy = dy; }
      }
      flush(W);
    }
  }

  // ===================================================================
  // CLIMA (sobreposição em tela)
  // ===================================================================
  function drawWeather(ctx, weather, t, W, H, pixel) {
    t = t || 0;
    var P = pixel || Math.max(2, Math.round(Math.min(W, H) / 150));
    if (weather === 'chuva') {
      ctx.fillStyle = 'rgba(16,26,52,0.30)'; ctx.fillRect(0, 0, W, H);
      var n = Math.round(W * H / (450 * P * P));   // densidade constante em pixels de arte (independe do DPR)
      for (var i = 0; i < n; i++) {
        var sp = 0.75 + 0.5 * hash(i * 3 + 2);
        var yy = mod(hash(i * 3 + 1) * H * 1.3 + t * H * 1.4 * sp, H * 1.3) - H * 0.15;
        var xx = mod(hash(i * 3) * (W + 120) - yy * 0.3 - t * 30, W + 120) - 60;
        var near = hash(i * 5 + 9) > 0.7;
        ctx.fillStyle = near ? 'rgba(210,228,255,0.55)' : 'rgba(180,200,235,0.35)';
        var segs = near ? 4 : 3;
        for (var k = 0; k < segs; k++) ctx.fillRect(Math.round(xx - k * P * 0.6), Math.round(yy - k * P * 2), P, P * 2);
      }
      // respingos
      var ns = Math.round(W * H / (1500 * P * P));
      for (var j = 0; j < ns; j++) {
        var per = 0.5 + 0.4 * hash(j + 900);
        var ph = frac(t / per + hash(j + 901));
        if (ph > 0.25) continue;
        var cyc = Math.floor(t / per + hash(j + 901));
        var px = Math.round(hash(j * 7 + cyc * 13) * W), py = Math.round((0.4 + 0.6 * hash(j * 11 + cyc * 3)) * H);
        ctx.fillStyle = 'rgba(220,235,255,0.6)';
        var spread = ph < 0.12 ? 1 : 2;
        ctx.fillRect(px - spread * P, py - P, P, P); ctx.fillRect(px + spread * P, py - P, P, P); ctx.fillRect(px, py - 2 * P, P, P);
      }
      // relâmpago raro
      var lp = mod(t, 11.0);
      if (lp < 0.06 || (lp > 0.14 && lp < 0.2)) { ctx.fillStyle = 'rgba(230,240,255,0.22)'; ctx.fillRect(0, 0, W, H); }
    } else if (weather === 'nublado') {
      ctx.fillStyle = 'rgba(70,92,125,0.16)'; ctx.fillRect(0, 0, W, H);
      // sombras de nuvens passando
      for (var s = 0; s < 3; s++) {
        var cw = W * (0.5 + 0.3 * hash(s + 5));
        var cx = mod(hash(s + 1) * (W + cw) - t * (14 + 6 * s) * P, W + cw) - cw / 2;
        var cy = H * (0.35 + 0.4 * hash(s + 3));
        ctx.fillStyle = 'rgba(10,20,40,0.05)';
        for (var ring = 0; ring < 2; ring++) {
          var rw = Math.round(cw * (ring ? 0.3 : 0.5) / P) * P, rh = Math.round(rw * 0.35 / P) * P;
          ctx.fillRect(Math.round(cx / P) * P - rw, Math.round(cy / P) * P - rh, rw * 2, rh * 2);
        }
      }
      // nuvens em primeiro plano no topo
      for (var c = 0; c < 4; c++) {
        var cc = cloudCanvas(10 + c, P * 2, 'nublado');
        var span = W + cc.width * 2;
        var x = mod(hash(c + 77) * span - t * (8 + 4 * c) * P, span) - cc.width;
        ctx.globalAlpha = 0.85;
        ctx.drawImage(cc, Math.round(x), Math.round(-cc.height * 0.35 + hash(c + 9) * H * 0.06));
        ctx.globalAlpha = 1;
      }
    } else { // sol
      ctx.fillStyle = 'rgba(255,196,110,0.06)'; ctx.fillRect(0, 0, W, H);
      // brilho do sol em 3 degraus de pixel (sem gradiente suave)
      var gx = Math.round(W * 0.86), R0 = Math.max(W, H) * 0.5;
      var steps = [[1.0, 0.05], [0.62, 0.06], [0.32, 0.08]];
      for (var gs = 0; gs < steps.length; gs++) {
        var rr = Math.round(R0 * steps[gs][0] / P) * P;
        ctx.fillStyle = 'rgba(255,240,190,' + steps[gs][1] + ')';
        for (var ry = 0; ry < rr; ry += 2 * P) {
          var hw = Math.round(Math.sqrt(Math.max(0, rr * rr - ry * ry)) / P) * P;
          ctx.fillRect(gx - hw, ry, hw * 2, 2 * P);
        }
      }
      // reflexos de lente em pixels
      var pulse = 0.5 + 0.5 * Math.sin(t * 1.3);
      var flares = [[0.62, 0.22, 5, 0.10], [0.48, 0.38, 3, 0.12], [0.3, 0.6, 7, 0.06]];
      for (var f = 0; f < flares.length; f++) {
        var fx = W * flares[f][0], fy = H * flares[f][1], fr = flares[f][2] * P;
        ctx.fillStyle = 'rgba(255,250,220,' + (flares[f][3] * (0.7 + 0.3 * pulse)).toFixed(3) + ')';
        ctx.fillRect(Math.round(fx - fr), Math.round(fy - fr / 2), Math.round(fr * 2), Math.round(fr));
        ctx.fillRect(Math.round(fx - fr / 2), Math.round(fy - fr), Math.round(fr), Math.round(fr * 2));
      }
    }
  }

  return {
    HORSE_W: HORSE_W, HORSE_H: HORSE_H, GALLOP_FRAMES: GALLOP.length, FOOT_Y: FOOT_Y,
    // pontos úteis em pixels nativos (multiplique pela escala): traseira p/ rastro, focinho, sela
    ANCHORS: { rear: [8, 14], nose: [38, 8], saddle: [18, 10] },
    PALETTES: PALETTES,
    SILKS: SILKS,
    randomPalette: randomPalette,
    ELEMENTS: ['fogo', 'agua', 'grama', 'neutro'],
    drawHorse: drawHorse,
    horseCanvas: horseCanvas,
    drawTrack: drawTrack,
    drawWeather: drawWeather,

    man: ['..####..', '.#....#.', '#......#', '#.......', '#.....#.', '.#...###', '..#..#.#', '........'],

  function newState(starterId) {

  function sanitize(s) {
    if (!s || typeof s !== 'object') return null;

  function xpHtml(level, xp) {
    var need = E.xpToLevel(level);

      '<div class="barra barra--xp" role="img" aria-label="' + esc('Experiência ' + Math.round(pct) + '%') + '"><i style="width:' + (Math.round(pct / 5) * 5) + '%"></i></div></div>';

  function skillHtml(id) {

  // ===========================================================================
  // Navegação (+ botão Voltar do Android/navegador)
  // ===========================================================================
  var guardPushed = false, ignorePop = false;
  function isRoot(screen) { return screen === 'estabulo' || screen === 'inicial'; }
  function syncHistory(screen) {
    try {
      if (!isRoot(screen) && !guardPushed) { window.history.pushState({ galope: 1 }, ''); guardPushed = true; }
      else if (isRoot(screen) && guardPushed) { guardPushed = false; ignorePop = true; window.history.back(); }
    } catch (e) { guardPushed = false; }
  }
  window.addEventListener('popstate', function () {
    if (ignorePop) { ignorePop = false; return; }
    guardPushed = false;
    if (ui.screen === 'corrida') { if (raceView) raceView.skip(); else go('resultado'); }
    else if (!isRoot(ui.screen) && state) go('estabulo');
  });

  function go(screen) {
    if (raceView && screen !== 'corrida') { raceView.destroy(); raceView = null; }
    if (screen !== ui.screen) ui.confirmReset = false;
    ui.screen = screen;
    if (appEl) appEl.classList.toggle('app--corrida', screen === 'corrida');
    render();
    try { window.scrollTo(0, 0); } catch (e) { /* ignora */ }
    var h = telaEl.querySelector('[data-foco]');
    if (h) { try { h.focus({ preventScroll: true }); } catch (e2) { h.focus(); } }
    syncHistory(screen);
  }

  function render() {
    live = [];
    portraitQueue = [];
    var html;
    switch (ui.screen) {
      case 'estabulo': html = renderEstabulo(); break;
      case 'largada': html = renderLargada(); break;
      case 'corrida': html = renderCorrida(); break;
      case 'resultado': html = renderResultado(); break;
      default: html = renderInicial();
    }
    telaEl.innerHTML = ordFix(html);
    hydrate(telaEl);
    if (ui.screen === 'corrida') {
      if (raceView) raceView.destroy();
      raceView = createRaceView(ui.lobby, telaEl);
    }
  }

  function affordableTier(gold, wanted) {

    return ok.length ? ok[ok.length - 1] : null;

  // state.tier é a preferência; a entrada efetiva é calculada na hora (sem regravar a preferência).
  function effectiveTier() { return affordableTier(state.gold, state.tier); }

  // ===========================================================================
  // Sala de largada: campo sorteado uma vez (state.pending) e simulado só no "Largar!"
  // ===========================================================================
  function bestLevelFor(template, itemId, target, lo, hi) {
    var h = clone(template); // um clone por template, mudando só o level (clonar a cada nível custava ~10 ms por sala)
    var best = lo || 1, bestD = Infinity;
    for (var L = (lo || 1); L <= (hi || E.maxLevel || 50); L++) {
      h.level = L;
      var d = Math.abs(RS.powerRating(h, itemId) - target);
      if (d < bestD - 0.5) { bestD = d; best = L; }
    }
    return { level: best, diff: bestD };
  }
  // Faixa de nível plausível para um cavalo selvagem: perto do nível em que ele é achado.
  function levelBand(tpl) {
    var L0 = tpl.level || 1;
    return [Math.max(1, L0 - 10), Math.min(E.maxLevel || 50, L0 + 20)];
  }

  // Abre a sala pendente ou sorteia uma nova (contador +1). Voltar/recarregar não sorteia de novo.
  function openLobby(training) {
    var P = state.pending;
    if (P && !P.training && state.gold < P.fee) P = null;          // não dá mais para pagar (ex.: save editado)
    if (P && P.training && !training && state.gold >= MIN_ENTRY) P = null; // treino pendente vira corrida valendo
    if (!P) {
      var fee = training ? 0 : effectiveTier();
      if (fee == null) { training = true; fee = 0; } // sem Ouro para nenhuma entrada (ex.: save editado): vira treino
      state.raceCounter += 1;
      P = {
        // pareamento pelo cavalo (sem item): o item é escolha de estratégia na sala e não atrai rivais mais fortes
        counter: state.raceCounter, training: !!training, fee: fee,
        pr: RS.powerRating(playerHorse(), null)
      };
      state.pending = P;
      persist();
    }
    return buildLobby(P);
  }

  function buildLobby(P) {
    var counter = P.counter;
    var seed = RS.hash2(state.seedBase, counter);
    var rng = RS.mulberry32(RS.hash2(seed, 0xA11CE)); // aleatoriedade só de UI/matchmaking, derivada da seed

    // pista
    var cond = RS.randomConditions(seed), trackName = pick(TRACK_NAMES, rng), trackDesc = '';
    withRanges(cond);

    var n = (E.minRacers || 4) + Math.floor(rng() * ((E.maxRacers || 8) - (E.minRacers || 4) + 1));
    var pr = P.pr;
    var player = {
      isPlayer: true, name: PLAYER_NAME, horse: playerHorse(), itemId: state.equipped,
      silks: PLAYER_SILKS, silkIdx: -1
    };

    var names = shuffle(GD.BOT_NAMES.slice(), rng);
    var pool = GD.WILD_HORSES.concat(GD.STARTERS.filter(function (s) { return s.id !== state.starterId; }));
    var itemIds = Object.keys(GD.ITEMS);
    var used = {};
    var silkOrder = shuffle(BOT_SILKS.map(function (c, i) { return i; }), rng);
    var bots = [];
    for (var b = 0; b < n - 1; b++) {
      // alvo em torno do rating do jogador (−8,5%..+11,5%); o rating já pesa cada habilidade pela chance
      // do gatilho. O leve viés para cima mantém a margem da casa (~10%) também contra bots.
      var target = pr * (0.915 + 0.2 * rng());
      var itemId = rng() < 0.55 ? pick(itemIds, rng) : null;
      var inBand = pool.map(function (tpl) { var bd = levelBand(tpl); return { tpl: tpl, fit: bestLevelFor(tpl, itemId, target, bd[0], bd[1]) }; })
        .filter(function (c) { return c.fit.diff <= target * 0.06; });
      var fresh = inBand.filter(function (c) { return !used[c.tpl.id]; });
      var cands = fresh.length ? fresh : inBand;
      if (!cands.length) {
        // ninguém plausível na faixa: o mais próximo do alvo em qualquer nível
        var all = pool.map(function (tpl) { return { tpl: tpl, fit: bestLevelFor(tpl, itemId, target) }; });
        all.sort(function (x, y) { return x.fit.diff - y.fit.diff; });
        cands = all.slice(0, 3);
      }
      var choice = pick(cands, rng);
      used[choice.tpl.id] = true;
      var horse = clone(choice.tpl);
      horse.level = choice.fit.level;
      horse.id = choice.tpl.id + '-b' + b;
      var silkIdx = SP.SILKS.indexOf(BOT_SILKS[silkOrder[b % silkOrder.length]]);
      bots.push({
        isPlayer: false, name: names[b % names.length], horse: horse, itemId: itemId,
        silks: SP.SILKS[silkIdx], silkIdx: silkIdx,
        rating: RS.powerRating(horse, itemId)
      });
    }
    var racers = shuffle([player].concat(bots), rng);   // ordem = raia
    var playerIdx = racers.indexOf(player);

    return {
      counter: counter, seed: seed, training: !!P.training, fee: P.fee || 0, n: n,
      cond: cond, trackName: trackName, trackDesc: trackDesc,
      racers: racers, playerIdx: playerIdx, sim: null
    };
  }
  // trechos de subida/curva derivados dos blocos (só para desenhar: a simulação lê os blocos)
  function withRanges(cond) {
    cond.hills = RS.hillsFromBlocks(cond.blocks);
    cond.curves = RS.curvesFromBlocks(cond.blocks);
    return cond;
  }
  // o cavalo do jogador na sala reflete o item atual
  function refreshPlayerEntry(L) {
    var r = L.racers[L.playerIdx];
    r.horse = playerHorse(); r.itemId = state.equipped;
  }

  // ===========================================================================
  // Tela 3 — Sala de largada
  // ===========================================================================
  function sharePct(cond) {
    var out = {};
    ['reta', 'curva', 'subida'].forEach(function (t) { out[t] = Math.round(RS.blockShare(cond.blocks, t) * 100); });
    return out;
  }
  function conditionChips(cond) {
    var sh = sharePct(cond);
    return '<div class="chips">' +
      '<span class="chip"><span class="rotulo">Distância</span><b>' + esc(cond.distance + ' m') + '</b></span>' +
      '<span class="chip"><span class="rotulo">Piso</span><b>' + esc(GD.SURFACES[cond.surface].name) + '</b></span>' +
      '<span class="chip"><span class="rotulo">Clima inicial</span><b>' + esc(GD.WEATHERS[cond.weather].name) + '</b></span>' +
      '<span class="chip"><span class="rotulo">Traçado</span><b>' + esc(sh.reta + '% reta · ' + sh.curva + '% curva · ' + sh.subida + '% subida') + '</b></span></div>';
  }

  function strategyTips(L) {
    var tips = [];
    var sh = sharePct(L.cond);
    if (sh.curva >= 40) tips.push('Muitas curvas: Manobra segura a velocidade na curva e na saída dela.');
    if (sh.subida >= 30) tips.push('Muitas subidas: Força ajuda a não perder ritmo (a Ferradura Leve tira Força).');
    if (L.cond.distance >= 2000) tips.push('Pista longa: Estamina segura o ritmo até o fim.');
    var h = playerHorse();
    if (RS.weatherMult(h.element, L.cond.weather, false) < 1) {
      var capa = state.inventory.filter(function (id) { var it = GD.ITEMS[id]; return it && it.special && it.special.ignoreWeatherPenalty; })[0];
      if (capa && state.equipped !== capa) tips.push('A ' + GD.ITEMS[capa].name + ' anula a penalidade de clima.');
    }
    return tips;
  }

  function climaHints(L) {
    var h = playerHorse();
    var el = GD.ELEMENTS[h.element] || GD.ELEMENTS.neutro;
    var w = GD.WEATHERS[L.cond.weather];
    var m = RS.weatherMult(h.element, L.cond.weather, false);
    var pct = Math.round((m - 1) * 100);
    var eff = pct > 0 ? '+' + pct + '% para ' + el.name : pct < 0 ? '−' + Math.abs(pct) + '% para ' + el.name : 'neutro para ' + el.name;
    var sorte = RS.computeStats(h, state.equipped).sorte;
    var items = '<li' + (pct > 0 ? ' class="bom"' : pct < 0 ? ' class="ruim"' : '') + '>' + esc('Clima inicial ' + w.name + ': ' + eff) + '</li>' +
      '<li class="dica">' + esc('Dado da Sorte a 1/3 e 2/3 da pista: quem tira o maior dado puxa o clima para o seu elemento. Sua Sorte: ' + sorte + '% de rolar dois dados.') + '</li>';
    var tips = strategyTips(L).map(function (t) { return '<li class="dica">' + esc(t) + '</li>'; }).join('');
    return '<div class="tela-cabeca"><span class="rotulo">Clima e sorte</span><ul class="dicas">' + items + tips + '</ul></div>';
  }

  function racerRow(r, i) {
    var h = r.horse;
    var rating = r.isPlayer ? RS.powerRating(h, r.itemId) : r.rating;
    return '<li class="' + (r.isPlayer ? 'voce' : '') + '">' + laneChip(r, i) +
      '<div class="corredor"><b>' + (r.isPlayer ? '<span class="tag-voce">VOCÊ</span>' : '') +
        '<span class="nome">' + esc(r.isPlayer ? h.name : r.name) + '</span></b>' +
        '<small>' + (r.isPlayer ? '' : '<span>' + esc(h.name) + '</span>') + elementHtml(h.element) + rarityHtml(h.rarity) +
        '<span>Nv ' + h.level + '</span>' +
        (r.itemId ? '<span>' + esc(itemName(r.itemId)) + '</span>' : '') + '</small></div>' +
      '<div class="poder"><b>' + rating + '</b><small>Poder</small></div></li>';
  }

  function renderLargada() {
    var L = ui.lobby;
    refreshPlayerEntry(L);
    var D = L.cond.distance;
    var pay = L.training ? null : RS.payouts(L.fee, L.n, L.racers.map(function (r, i) { return i; }));
    var pote;
    if (L.training) {
      pote = '<section class="caixa" aria-labelledby="t-pote"><h2 class="titulo" id="t-pote">Treino gratuito</h2>' +
