<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body>
<title>Galope Elemental</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
@import url('https://fonts.googleapis.com/css2?family=Jersey+10&family=Press+Start+2P&display=swap');

/* Layout: uma coluna central (até 520px) de painéis no estilo "programa de corrida";
   a pista quebra a coluna (sangra até a borda no celular, cresce até 1120px no desktop).
   Mundo único: estábulo à noite (piso de tábuas), cerca creme e placar dourado.
   Grade de pixel: molduras e sombras em múltiplos de 2px; Press Start 2P só em 8, 16 ou 24px. */
:root {
  color-scheme: dark;
  /* chão e painéis */
  --noite: #0f1c17;
  --noite-2: #0b1611;
  --painel: #16271f;
  --painel-2: #1e3329;
  --painel-3: #284438;
  --linha: #335446;
  --sombra: #060d0a;
  /* madeira (placas) */
  --madeira: #6b4a2b;
  --madeira-2: #523720;
  --madeira-luz: #8a6440;
  /* texto */
  --texto: #f1e9d4;
  --texto-2: #b3c2b2;
  --texto-3: #95a99b;
  --tinta: #1a1405;
  /* acentos */
  --ouro: #f2c230;
  --ouro-claro: #ffe27a;
  --ouro-escuro: #9c7210;
  --ganho: #7be07a;
  --perda: #ff6b5e;
  --foco: #62e6ff;
  /* elementos (texto legível sobre o painel) */
  --fogo: #ff8a4c;
  --agua: #62b8ff;
  --grama: #86d86a;
  --neutro: #cfc8b4;
  /* raridades (GameData.RARITIES) */
  --r-comum: #9e9e9e;
  --r-magico: #4caf50;
  --r-raro: #2196f3;
  --r-lendario: #ff9800;
  --r-mitico: #9c27b0;
  /* ligas (GameData.LEAGUES) */
  --l-bronze: #b0703c;
  --l-prata: #b8c2cc;
  --l-ouro: #f2c230;
  --l-platina: #5fd3c8;
  --l-diamante: #7ab8ff;
  --l-lenda: #ff7a3d;
  /* sedas dos jóqueis (Sprites.SILKS) */
  --seda-0: #d8353b;
  --seda-1: #2f6fd8;
  --seda-2: #f2c230;
  --seda-3: #8a4ad8;
  --seda-4: #30b060;
  --seda-5: #f07a2a;
  --seda-6: #e85aa8;
  --seda-7: #2ab8b0;
  /* pódio */
  --prata: #c9d3dc;
  --bronze: #c98a52;
  /* cena dos retratos (baia) */
  --tabua: #243a31;
  --palha: #a5823f;
  --palha-2: #6f5526;
  /* véus e brilhos (sobreposições) */
  --escuro-35: rgb(0 0 0 / 0.35);
  --escuro-25: rgb(0 0 0 / 0.25);
  --brilho-08: rgb(255 255 255 / 0.08);
  --brilho-33: rgb(255 255 255 / 0.33);
  --veu: rgb(6 13 10 / 0.74);
  --holofote: rgb(255 226 122 / 0.06);
  /* tipografia */
  --fonte-display: 'Press Start 2P', ui-monospace, 'Courier New', monospace;
  --fonte-ui: 'Jersey 10', 'Arial Narrow', 'Roboto Condensed', 'Helvetica Neue', system-ui, sans-serif;
  --t-xs: 0.9375rem;
  --t-s: 1.0625rem;
  --t-m: 1.25rem;
  --t-l: 1.625rem;
  /* contorno em pixel (cantos recortados) */
  --px: 2px;
  --gl: max(16px, env(safe-area-inset-left, 0px));
  --gr: max(16px, env(safe-area-inset-right, 0px));
}

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
html { background: var(--noite); }
body {
  background-color: var(--noite);
  /* piso de tábuas do estábulo: linhas de 2px, sem gradiente suave */
  background-image:
    linear-gradient(var(--noite-2) 2px, transparent 2px),
    linear-gradient(90deg, var(--noite-2) 2px, transparent 2px);
  background-size: 100% 32px, 128px 32px;
  color: var(--texto);
  font: 400 var(--t-m)/1.25 var(--fonte-ui);
  font-synthesis: none;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; }
b, strong { font-weight: 400; color: var(--texto); }
.ord { font-size: 0.5em; vertical-align: 0.8em; line-height: 0; }
canvas { image-rendering: pixelated; image-rendering: crisp-edges; display: block; }
[hidden] { display: none !important; }
:focus-visible { outline: 3px solid var(--foco); outline-offset: 3px; }
[tabindex="-1"]:focus { outline: none; }
.sr { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }

.app {
  min-height: 100%;
  padding-left: var(--gl);
  padding-right: var(--gr);
  padding-block: 16px 40px;
  overflow-x: clip;
}
.app--corrida { padding-block: 8px max(8px, env(safe-area-inset-bottom, 0px)); }

/* ---------- telas ---------- */
.tela { max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
.tela--larga { max-width: 1120px; }
.tela-cabeca { display: flex; flex-direction: column; gap: 6px; }

h1, h2, h3 { margin: 0; text-wrap: balance; font-weight: 400; }
.logo {
  font-family: var(--fonte-display);
  font-size: 24px;
  line-height: 1.5;
  color: var(--ouro);
  text-shadow: 4px 4px 0 var(--sombra);
}
.logo-mini {
  font-family: var(--fonte-display); font-size: 8px; color: var(--ouro); line-height: 2;
  min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.titulo { font-family: var(--fonte-display); font-size: 16px; line-height: 1.5; color: var(--texto); }
.titulo--tela { text-shadow: 2px 2px 0 var(--sombra); }
.rotulo {
  font-size: var(--t-xs); font-weight: 600; text-transform: uppercase; letter-spacing: 0.12em; color: var(--texto-3);
}
.sub { color: var(--texto-2); margin: 0; max-width: 60ch; }
.nota { color: var(--texto-3); font-size: var(--t-s); margin: 0; }

/* ---------- caixas: moldura pixel (cantos recortados), bisel e sombra projetada ---------- */
.caixa {
  background: var(--painel);
  box-shadow:
    0 calc(-1 * var(--px)) 0 0 var(--linha),
    0 var(--px) 0 0 var(--linha),
    calc(-1 * var(--px)) 0 0 0 var(--linha),
    var(--px) 0 0 0 var(--linha),
    0 6px 0 0 var(--sombra),
    inset 0 2px 0 0 var(--brilho-08),
    inset 0 -2px 0 0 var(--escuro-25);
  padding: 14px;
  margin: var(--px) var(--px) 6px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  min-width: 0;
}
.caixa > h2 { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.caixa > h2.titulo::before {
  content: ""; flex: none; width: 8px; height: 8px; background: var(--ouro); box-shadow: 2px 2px 0 0 var(--sombra);
  align-self: center; margin-right: -2px;
}
.caixa > h2.titulo { justify-content: flex-start; }
.caixa > h2 .nota { font-family: var(--fonte-ui); font-size: var(--t-s); letter-spacing: 0; margin-left: auto; }

/* placa de madeira (título da sala de largada) */
.placa {
  background: var(--madeira);
  padding: 12px 14px;
  margin: var(--px) var(--px) 6px;
  box-shadow:
    0 -2px 0 0 var(--sombra), 0 2px 0 0 var(--sombra), -2px 0 0 0 var(--sombra), 2px 0 0 0 var(--sombra),
    0 6px 0 0 var(--sombra),
    inset 0 2px 0 0 var(--madeira-luz), inset 0 -4px 0 0 var(--madeira-2);
  background-image: linear-gradient(var(--madeira-2) 2px, transparent 2px);
  background-size: 100% 18px;
  background-position: 0 8px;
}
.placa .rotulo { color: #e8d7b0; }
.placa .nota { color: #e8d7b0; }

/* ---------- botões ---------- */
.btn {
  appearance: none;
  border: 0;
  margin: var(--px);
  min-height: 48px;
  padding: 10px 16px;
  background: var(--painel-2);
  color: var(--texto);
  font-family: var(--fonte-ui);
  font-weight: 600;
  font-size: var(--t-m);
  line-height: 1.15;
  cursor: pointer;
  box-shadow:
    0 calc(-1 * var(--px)) 0 0 var(--sombra),
    0 var(--px) 0 0 var(--sombra),
    calc(-1 * var(--px)) 0 0 0 var(--sombra),
    var(--px) 0 0 0 var(--sombra),
    inset 0 -4px 0 0 var(--escuro-35),
    inset 0 2px 0 0 var(--brilho-08);
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  text-align: center;
  touch-action: manipulation;
  -webkit-user-select: none; user-select: none;
}
.btn:hover:not(:disabled) { background: var(--painel-3); }
.btn:active:not(:disabled) {
  transform: translateY(2px);
  box-shadow:
    0 calc(-1 * var(--px)) 0 0 var(--sombra),
    0 var(--px) 0 0 var(--sombra),
    calc(-1 * var(--px)) 0 0 0 var(--sombra),
    var(--px) 0 0 0 var(--sombra),
    inset 0 -2px 0 0 var(--escuro-35);
}
.btn:disabled { opacity: 0.42; cursor: not-allowed; }
.btn:focus-visible { outline-offset: 5px; }
.btn--ouro { background: var(--ouro); color: var(--tinta); box-shadow:
    0 -2px 0 0 var(--sombra), 0 2px 0 0 var(--sombra), -2px 0 0 0 var(--sombra), 2px 0 0 0 var(--sombra),
    inset 0 -4px 0 0 var(--ouro-escuro), inset 0 2px 0 0 var(--ouro-claro); }
.btn--ouro:hover:not(:disabled) { background: var(--ouro-claro); }
.btn--grande { min-height: 56px; font-size: var(--t-l); width: calc(100% - 2 * var(--px)); }
.btn--pequeno { min-height: 48px; padding: 6px 12px; font-size: var(--t-s); }
.btn--texto { background: transparent; box-shadow: none; color: var(--texto-2); text-decoration: underline; text-underline-offset: 3px; min-height: 48px; }
.btn--texto:hover:not(:disabled) { background: transparent; color: var(--texto); }
.btn--perigo { color: var(--perda); }
.acoes { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; }
.barra-acao {
  position: sticky; bottom: 0; z-index: 5;
  padding-top: 16px; padding-bottom: max(12px, env(safe-area-inset-bottom, 0px));
  margin-bottom: -12px;
  /* degraus de pixel em vez de degradê suave */
  background: linear-gradient(to bottom, transparent 0 6px, rgb(15 28 23 / 0.6) 6px 10px, var(--noite) 10px);
}

/* resumo do equipamento (um quadrinho por slot + selo do conjunto) */
.slots { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.slot {
  display: inline-flex; align-items: center; justify-content: center; min-width: 36px; height: 32px; padding: 0 6px;
  border: 2px solid var(--linha); background: var(--painel-2); font-weight: 700; font-variant-numeric: tabular-nums;
}
.slot--cheio { border-color: var(--ouro-escuro); color: var(--ouro-claro); }
.slot--vazio { color: var(--texto-3); opacity: 0.5; }
.set-badge { padding: 2px 8px; border: 2px solid var(--ouro); color: var(--ouro); font-weight: 700; white-space: nowrap; }

/* tela de Equipamento: saldo de pedras, linhas de slot e lista de peças */
.topo-saldos { display: flex; align-items: center; gap: 8px; flex: none; }
.pedras { font-family: var(--fonte-display); font-size: 16px; white-space: nowrap; font-variant-numeric: tabular-nums; color: var(--texto); }
.set-linha { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; margin: 4px 0 0; }
.slot-linhas { display: flex; flex-direction: column; gap: 10px; }
.slot-linha { display: flex; flex-direction: column; gap: 8px; }
.slot-linha--aberta { background: var(--painel-2); padding-bottom: 8px; }
.slot-botao { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; width: 100%; text-align: left; min-height: 56px; }
.slot-nome { font-weight: 700; }
.slot-peca { font-size: var(--t-s); color: var(--texto-2); font-weight: 400; overflow-wrap: anywhere; }
.pecas { display: flex; flex-direction: column; gap: 8px; padding: 0 8px; }
.peca { display: flex; flex-direction: column; gap: 6px; padding: 8px; background: var(--painel); box-shadow: inset 4px 0 0 0 var(--linha); min-width: 0; }
.peca--equipada { box-shadow: inset 4px 0 0 0 var(--ouro); }
.peca-info { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.peca-poder { font-size: var(--t-s); color: var(--texto-2); }
.acoes-peca { display: flex; flex-wrap: wrap; gap: 8px; }
.acoes-peca .btn { flex: 1 1 auto; }

/* tela da Loja: abas por slot + pedras e cartões de produto */
.abas.abas--loja { grid-template-columns: repeat(3, minmax(0, 1fr)); margin-bottom: 8px; }
.abas--loja .opcao { min-height: 44px; min-width: 0; padding-left: 4px; padding-right: 4px; overflow-wrap: anywhere; }
.loja-grade { display: grid; grid-template-columns: 1fr; gap: 10px; }
@media (min-width: 601px) { .loja-grade { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.produto { display: flex; flex-direction: column; gap: 6px; padding: 8px; background: var(--painel-2); box-shadow: inset 4px 0 0 0 var(--linha); min-width: 0; }
.produto-nome { margin: 0; font-size: var(--t-m); overflow-wrap: anywhere; }
.produto-stats { margin: 0; font-weight: 700; }
.produto-diff { margin: 0; font-size: var(--t-s); color: var(--texto-2); }
.produto-preco { display: flex; justify-content: flex-end; }

/* opções selecionáveis (aria-pressed) */
.opcoes { display: grid; gap: 10px; }
.opcoes--3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.opcao {
  text-align: left; align-items: flex-start; justify-content: flex-start; flex-direction: column; gap: 2px;
  min-width: 0; font-weight: 500;
}
.opcao[aria-pressed="true"] {
  background: var(--painel-3);
  box-shadow:
    0 calc(-1 * var(--px)) 0 0 var(--ouro),
    0 var(--px) 0 0 var(--ouro),
    calc(-1 * var(--px)) 0 0 0 var(--ouro),
    var(--px) 0 0 0 var(--ouro),
    inset 0 -4px 0 0 var(--escuro-35);
}
.opcao .opcao-nome { font-weight: 700; display: flex; align-items: center; gap: 6px; }
.opcao .opcao-desc { font-size: var(--t-xs); color: var(--texto-2); font-weight: 400; line-height: 1.3; display: flex; flex-wrap: wrap; gap: 4px 6px; align-items: center; }
.opcao--centro { align-items: center; text-align: center; justify-content: center; }

/* ---------- moeda, chips, emblemas ---------- */
.ouro { display: inline-flex; align-items: center; gap: 6px; font-family: var(--fonte-display); font-size: 16px; line-height: 1; color: var(--ouro); white-space: nowrap; font-variant-numeric: tabular-nums; }
.ouro svg { width: 16px; height: 16px; flex: none; }
.saldo {
  background: var(--painel);
  padding: 8px 12px;
  margin: var(--px);
  flex: none;
  box-shadow: 0 -2px 0 0 var(--ouro-escuro), 0 2px 0 0 var(--ouro-escuro), -2px 0 0 0 var(--ouro-escuro), 2px 0 0 0 var(--ouro-escuro), 0 6px 0 0 var(--sombra);
}
.topo { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: nowrap; min-width: 0; }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  display: inline-flex; align-items: center; gap: 6px;
  background: var(--painel-2); color: var(--texto);
  padding: 4px 9px; font-size: var(--t-s); font-weight: 500; line-height: 1.3;
  box-shadow: 0 -2px 0 0 var(--linha), 0 2px 0 0 var(--linha), -2px 0 0 0 var(--linha), 2px 0 0 0 var(--linha);
  margin: 2px;
}
.chip b { font-weight: 700; }
.chip .rotulo { font-size: 0.875rem; letter-spacing: 0.1em; color: var(--texto-2); }

.el { display: inline-flex; align-items: center; gap: 5px; font-weight: 700; }
.el canvas { flex: none; }
.el--fogo { color: var(--fogo); }
.el--agua { color: var(--agua); }
.el--grama { color: var(--grama); }
.el--neutro { color: var(--neutro); }

.raridade {
  display: inline-block; font-size: 0.875rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em;
  padding: 1px 6px; color: var(--tinta); background: var(--r-comum); line-height: 1.5;
  box-shadow: inset 0 -2px 0 0 var(--escuro-25);
}
.raridade--magico { background: var(--r-magico); }
.raridade--raro { background: var(--r-raro); }
.raridade--lendario { background: var(--r-lendario); }
.raridade--mitico { background: var(--r-mitico); color: var(--texto); }

.liga { display: inline-flex; align-items: center; gap: 6px; font-weight: 700; }
.liga::before { content: ""; width: 10px; height: 10px; background: currentColor; box-shadow: 0 0 0 2px var(--sombra); }
.liga--bronze { color: var(--l-bronze); }
.liga--prata { color: var(--l-prata); }
.liga--ouro { color: var(--l-ouro); }
.liga--platina { color: var(--l-platina); }
.liga--diamante { color: var(--l-diamante); }
.liga--lenda { color: var(--l-lenda); }

.seda-0 { background: var(--seda-0); } .seda-1 { background: var(--seda-1); } .seda-2 { background: var(--seda-2); } .seda-3 { background: var(--seda-3); }
.seda-4 { background: var(--seda-4); } .seda-5 { background: var(--seda-5); } .seda-6 { background: var(--seda-6); } .seda-7 { background: var(--seda-7); }
.seda-voce { background: var(--ouro); }

/* ---------- status ---------- */
.status { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 8px 10px; align-items: center; margin: 0; }
.status dt { font-family: var(--fonte-display); font-size: 8px; color: var(--texto-2); display: flex; align-items: center; gap: 6px; min-width: 52px; }
.status dd { margin: 0; }
.status .valor { font-family: var(--fonte-display); font-size: 16px; text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; min-width: 3ch; }
.status .delta { font-family: var(--fonte-ui); font-size: var(--t-s); font-weight: 700; margin-left: 4px; }
.icone-status { width: 16px; height: 16px; flex: none; fill: var(--ouro); }
.icone-status--vel { fill: #ffd86a; }
.icone-status--acel { fill: var(--fogo); }
.icone-status--est { fill: var(--perda); }
.icone-status--forca { fill: var(--grama); }
.icone-status--garra { fill: var(--agua); }
.barra {
  position: relative; height: 12px; background: var(--sombra);
  box-shadow: 0 0 0 2px var(--sombra);
}
.barra > i { position: absolute; top: 0; bottom: 0; left: 0; display: block; background: var(--ouro); }
/* barra em segmentos inteiros (20 x 5 pontos) */
.barra--seg { display: flex; gap: 2px; background: var(--sombra); height: 12px; }
.barra--seg > i { position: static; flex: 1 1 0; background: var(--painel-3); }
.barra--seg > i.on { background: var(--ouro); box-shadow: inset 0 -2px 0 0 var(--ouro-escuro); }
.barra--seg > i.extra { background: var(--ganho); box-shadow: inset 0 -2px 0 0 #3f9a3e; }
.barra--seg > i.menos { background: transparent; box-shadow: inset 0 0 0 2px var(--perda); }
.barra--xp::after {
  content: ""; position: absolute; inset: 0;
  background-image: linear-gradient(90deg, transparent calc(100% - 2px), var(--sombra) 0);
  background-size: 5% 100%;
}
.mais { color: var(--ganho); }
.menos-t { color: var(--perda); }

.xp { display: flex; flex-direction: column; gap: 4px; }
.xp .barra { height: 10px; }
.xp .barra > i { background: var(--agua); }
.xp-linha { display: flex; justify-content: space-between; font-size: var(--t-xs); color: var(--texto-2); font-variant-numeric: tabular-nums; }

/* ---------- retrato do cavalo ---------- */
.retrato { flex: none; box-shadow: 0 0 0 2px var(--sombra), 0 6px 0 0 var(--sombra); }
.cavalo-cabeca { display: flex; gap: 14px; align-items: flex-start; }
.cavalo-info { display: flex; flex-direction: column; gap: 6px; min-width: 0; flex: 1; }
.cavalo-nome { font-family: var(--fonte-display); font-size: 16px; line-height: 1.5; color: var(--texto); text-shadow: 2px 2px 0 var(--sombra); }
.cavalo-titulo { color: var(--texto-2); font-size: var(--t-s); margin: 0; }
.linha-meta { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; font-size: var(--t-s); }
.nivel { font-family: var(--fonte-display); font-size: 8px; color: var(--texto); }

.habilidade { display: flex; flex-direction: column; gap: 2px; background: var(--painel-2); padding: 8px 10px; box-shadow: inset 4px 0 0 0 var(--ouro-escuro); }
.habilidade b { display: flex; align-items: center; gap: 6px; }
.habilidade span { font-size: var(--t-s); color: var(--texto-2); }

.afinidade { display: grid; grid-template-columns: auto 1fr; gap: 4px 10px; margin: 0; font-size: var(--t-s); }
.afinidade dt { color: var(--texto-3); font-weight: 600; text-transform: uppercase; font-size: 0.875rem; letter-spacing: 0.08em; padding-top: 2px; }
.afinidade dd { margin: 0; }

/* ---------- tela inicial ---------- */

      from = to;
    }
    var surface = SURF_LIST[Math.floor(rng() * 3)];
    var weather = WEATHER_LIST[Math.floor(rng() * 4)];
    return { distance: distance, surface: surface, weather: weather, blocks: blocks };
  }

  // Blocos são válidos se contíguos a partir de 0 e (quando dada) terminam em `distance`.
  function validBlocks(blocks, distance) {
    if (!blocks || !blocks.length) return false;
    var prev = 0;
    for (var i = 0; i < blocks.length; i++) {
      var b = blocks[i];
      if (!b || !GameData.BLOCK_TYPES[b.type]) return false;
      if (b.from !== Math.floor(b.from) || b.to !== Math.floor(b.to) || !(b.from < b.to)) return false;
      if (b.from !== prev) return false;
      prev = b.to;
    }
    return distance == null || prev === distance;
  }

  // Campos ausentes (ex.: pista de exemplo sem `weather`) são sorteados pela seed;
  // sem seed (dicas de UI) ficam neutros (1600 m, grama, nublado, uma reta única).
  function normalizeConditions(c, seed) {
    c = c || {};
    var rnd = (seed == null) ? null : randomConditions(seed);
    var given = c.distance || null;
    var blocks;
    if (validBlocks(c.blocks, given)) {
      blocks = c.blocks;
      if (!given) given = blocks[blocks.length - 1].to;
    } else {
      if (!given) given = rnd ? rnd.distance : 1600;
      if (rnd && rnd.distance === given) blocks = rnd.blocks;
      else blocks = rnd && !c.distance ? rnd.blocks : [{ type: 'reta', from: 0, to: given }];
    }
    return {
      distance: given,
      surface: GameData.SURFACES[c.surface] ? c.surface : (rnd ? rnd.surface : 'grama'),
      weather: GameData.WEATHERS[c.weather] ? c.weather : (rnd ? rnd.weather : 'nublado'),
      blocks: blocks.map(function (b) { return { type: b.type, from: b.from, to: b.to }; })
    };
  }

  // Índice do bloco que contém `pos` (varredura linear; pos >= fim -> último; pos < 0 -> 0).
  function blockAt(blocks, pos) {
    for (var i = 0; i < blocks.length; i++) if (pos < blocks[i].to) return i;
    return blocks.length - 1;
  }

  // Fração (0-1) do comprimento total ocupada por blocos do tipo dado.
  function blockShare(blocks, type) {
    var len = 0;
    for (var i = 0; i < blocks.length; i++) if (blocks[i].type === type) len += blocks[i].to - blocks[i].from;
    var total = blocks.length ? blocks[blocks.length - 1].to - blocks[0].from : 0;
    return total > 0 ? len / total : 0;
  }

  function rangesOf(blocks, type) {
    var out = [];
    for (var i = 0; i < blocks.length; i++) if (blocks[i].type === type) out.push([blocks[i].from, blocks[i].to]);
    return out;
  }
  function hillsFromBlocks(blocks) { return rangesOf(blocks, 'subida'); }
  function curvesFromBlocks(blocks) { return rangesOf(blocks, 'curva'); }

  // ---------------------------------------------------------------------------
  // Pagamentos
  // ---------------------------------------------------------------------------
  function payouts(entryFee, numRacers, finishOrder) {
    var E = GameData.ECONOMY;
    entryFee = Math.max(0, Math.floor(entryFee));
    var pot = entryFee * numRacers;
    var fee = Math.round(pot * E.houseFee);
    var dist = pot - fee;
    var order = finishOrder || [];
    var places = Math.min(E.payoutSplit.length, order.length, numRacers);
    var prizes = [];
    if (places <= 0) return { pot: pot, fee: pot, prizes: prizes };
    // divisão por tamanho do campo (ECONOMY.payoutSplitFor): em campos pequenos pagam menos
    // posições, para que todo lugar premiado receba pelo menos a entrada de volta.
    var full = (typeof E.payoutSplitFor === 'function' ? E.payoutSplitFor(numRacers) : null) || E.payoutSplit;
    places = Math.min(places, full.length);
    var split = full.slice(0, places);
    var tot = 0, i;
    for (i = 0; i < split.length; i++) tot += split[i];
    var given = 0;
    for (i = 0; i < places; i++) {
      var amount = (i === places - 1) ? dist - given : Math.floor(dist * split[i] / tot);
      given += amount;
      prizes.push({ racer: order[i], place: i + 1, amount: amount });
    }
    // o resto do arredondamento cai no último pago e, com fees minúsculos, invertia prêmios
    // (ex.: fee 1, n=6 → [2, 1, 2]); reordena os valores para nunca pagar mais a quem chega depois
    var amounts = prizes.map(function (p) { return p.amount; }).sort(function (a, b) { return b - a; });
    for (i = 0; i < places; i++) prizes[i].amount = amounts[i];
    return { pot: pot, fee: fee, prizes: prizes };
  }

  // ---------------------------------------------------------------------------
  // Simulação
  // ---------------------------------------------------------------------------
  // Fração do trecho [from, to) que cai em blocos de subida (usada na estimativa de gasto do jóquei).
  function hillFraction(blocks, from, to) {
    if (to <= from) return 0;
    var len = 0;
    for (var i = 0; i < blocks.length; i++) {
      if (blocks[i].type !== 'subida') continue;
      var a = Math.max(from, blocks[i].from), b = Math.min(to, blocks[i].to);
      if (b > a) len += b - a;
    }
    return len / (to - from);
  }

  // Maior ritmo constante s (fração de vMax) que o tanque restante sustenta até o fim.
  // gasto = rem/(s*v) * K * c * s^k / pool  =>  s = (avail*pool*v / (rem*K*c))^(1/(k-1))
  function affordablePace(avail, remaining, vRef, pool, cdrain) {
    if (avail <= 0) return 0;
    if (remaining <= 0) return 9;
    var x = avail * pool * vRef / (remaining * T.drainK * cdrain);
    return nthRoot(x, T.drainExp - 1);
  }

  // Multiplicador de clima de um elemento: dono do clima => T.weatherMult (T.weatherMultDouble
  // com skill de clima ativa); elemento penalizado => 2 - T.weatherMult (0,97); senão 1.
  function weatherMult(element, weather, doubled) {
    var w = GameData.WEATHERS[weather];
    var el = GameData.ELEMENTS[element];
    if (!w || !el) return 1;
    if (el.weather === weather) return doubled ? T.weatherMultDouble : T.weatherMult;
    if (w.penalizes === element) return 2 - T.weatherMult;
    return 1;
  }

  // (Re)calcula os números do corredor que dependem do clima. Pode ser chamada de novo no meio da
  // corrida (troca de clima, skill que dobra o bônus, bônus de Garra): só lê statsN e os totais.
  function applyWeather(r, weather) {
    var m = weatherMult(r.element, weather, r.weatherDouble);
    // 4 peças do conjunto do clima: ×1,07 no lugar de ×1,03 (só se a skill de clima não estiver dobrando)
    if (!r.weatherDouble && r.gearDoubleClimate === weather && m === T.weatherMult) m = T.weatherMultSet;
    if (m < 1 && r.ignoreWeatherPenalty) m = 1;   // equipamento: anula a penalidade
    var sn = r.statsN;
    r.weatherM = m;
    r.vMax = (T.vBase + T.vRange * sn.vel * m) * (1 + T.weatherVel * (m - 1));
    r.accel = T.aBase + T.aRange * sn.acel * m;
    r.nf = sn.forca * m;
    r.nm = sn.man * m;
    var ng = sn.garra * m;
    r.garraChance = clamp(T.garraChanceBase + T.garraChanceRange * ng + r.garraBonusTotal, 0, T.garraChanceMax);
    r.garraBoost = 1 + T.garraBoostBase + T.garraBoostRange * ng + r.garraBoostBonusTotal;
  }

  // Ordem das chamadas de r.rng() (fluxo próprio de cada corredor; manter estável):
  //   montagem: 1) startDelay, 2) jockeyErr;
  //   por tick: 3) tentativas de skill (só quando um gatilho acontece; na ordem dos gatilhos
  //   start/bloco/clima/lowStamina/final e, dentro de cada gatilho, na ordem da lista de skills),
  //   4) sorteio da Garra (uma vez, ao cruzar garraZone), 5) jitter.
  function buildRacer(entry, index, cond, rng) {
    var horse = entry.horse;
    var gear = (entry.gear && typeof entry.gear === 'object' && entry.gear.mods) ? entry.gear : null;
    var special = (gear && gear.special) || {};
    var stats = computeStats(horse, gear);
    var statsN = {};
    for (var i = 0; i < STAT_KEYS.length; i++) statsN[STAT_KEYS[i]] = stats[STAT_KEYS[i]] / 100;
    var skills = (horse.skills || []).filter(function (id) { return !!GameData.SKILLS[id]; });
    var r = {
      index: index,
      name: entry.name || horse.name,
      horseName: horse.name,
      element: horse.element,
      stats: stats,
      statsN: statsN,
      skillChance: skillChance(horse, stats, special.skillChanceBonus || 0),
      pool: T.poolBase + T.poolEst * statsN.est,   // tanque fixo (sem clima)
      ignoreWeatherPenalty: !!special.ignoreWeatherPenalty,
      garraBonusTotal: 0,
      gearDoubleClimate: special.weatherDoubleClimate || null,
      garraBoostBonusTotal: 0,
      weatherDouble: false,
      extraDice: 0,
      startDelay: rng() * T.startDelayMax * (1 - 0.5 * clamp(statsN.acel, 0, 1)),
      jockeyErr: T.jockeyErrMin + rng() * (T.jockeyErrMax - T.jockeyErrMin),
      rng: rng,
      skills: skills,
      started: false,
      blockIdx: -1,
      tried: {},
      effects: [],
      pos: 0, v: 0, stamina: 1,
      exhausted: false, finished: false, finishTime: null,
      garraRolled: false, garraMult: 1
    };
    applyWeather(r, cond.weather);
    return r;
  }

  // Dado da Sorte de uma montaria. Ordem das chamadas de rng() (manter estável): d1, sorteio do
  // 2º dado (sempre consumido, mesmo com sorte 0 ou 100), d2 (se houver), dado extra (Dado Viciado).
  // Sorte = chance, em %, de rolar dois dados e ficar com o melhor; extraDice limitado a 1 (até 3 dados).
  function rollDice(rng, sorte, extraDice) {
    var dice = [1 + Math.floor(rng() * 100)];
    var p = clamp((sorte || 0) / 100, 0, 1);
    if (rng() < p) dice.push(1 + Math.floor(rng() * 100));
    var extra = clamp(Math.floor(extraDice || 0), 0, 1);
    for (var k = 0; k < extra; k++) dice.push(1 + Math.floor(rng() * 100));
    var best = dice[0];
    for (k = 1; k < dice.length; k++) if (dice[k] > best) best = dice[k];
    return { dice: dice, best: best };
  }

  var DICE_PHRASE = { sol: 'o sol abre!', chuva: 'começa a chover!', nevoa: 'a névoa desce!' };

  function simulate(config) {
    config = config || {};
    var seed = (config.seed >>> 0);
    var cond = normalizeConditions(config.conditions || randomConditions(seed), seed);
    var D = cond.distance;
    var blocks = cond.blocks;
    var entries = config.racers || [];
    var n = entries.length;
    var dt = T.dt;
    var record = config.recordFrames !== false;
    var surf = GameData.SURFACES[cond.surface];
    // efeitos gerais do clima vigente (recalculados quando o Dado vira o clima)
    var weatherDrain, weatherSlow;
    function setWeatherGlobals(w) {
      weatherDrain = w === 'sol' ? T.sunDrain : 1;
      weatherSlow = w === 'chuva' ? (1 - T.rainSlow) : 1;
    }
    setWeatherGlobals(cond.weather);
    var distDrain = ratPow(T.drainRefDist / D, T.drainDistExp); // pistas longas gastam menos por segundo (mas duram mais)
    // clima vigente (o Dado da Sorte troca no meio da corrida e chama applyWeather de novo)
    cond.weatherAtual = cond.weather;
    // Dado da Sorte: fluxo próprio, para não perturbar os fluxos por corredor
    var diceRng = mulberry32(hash2(seed, 0xD1CE));
    var diceAt = T.diceAt || [];
    var diceIdx = 0;

    var R = [];
    for (var i = 0; i < n; i++) R.push(buildRacer(entries[i], i, cond, mulberry32(hash2(seed, i + 1))));
    // nome usado na narração: nome do cavalo; se dois corredores têm cavalos de mesmo nome, acrescenta o jogador
    for (i = 0; i < n; i++) {
      var dup = false;
      for (var q = 0; q < n; q++) if (q !== i && R[q].horseName === R[i].horseName) dup = true;
      R[i].label = (dup && R[i].name !== R[i].horseName) ? R[i].horseName + ' (' + R[i].name + ')' : R[i].horseName;
    }

    var events = [];
    function ev(t, racer, type, text) { events.push({ t: r2(t), racer: racer, type: type, text: text }); }

    var frames = [];
    function pushFrame(t) {
      if (!record) return;
      var pos = new Array(n), speed = new Array(n), stam = new Array(n);
      for (var j = 0; j < n; j++) { pos[j] = r2(R[j].pos); speed[j] = r2(R[j].v); stam[j] = r3(R[j].stamina); }
      frames.push({ t: t, pos: pos, speed: speed, stamina: stam });
    }
    pushFrame(0);

    // Uma tentativa por gatilho (por corrida; por bloco se blockScoped): sorteia contra r.skillChance.
    function tryFire(r, id, t, pos, blockTo) {
      var sk = GameData.SKILLS[id];
      var e = sk.effect || {};
      var key = e.blockScoped ? id + '#' + r.blockIdx : id;
      if (r.tried[key]) return;
      r.tried[key] = true;
      if (!(r.rng() < r.skillChance)) return;
      if (e.staminaRestore && !r.exhausted) r.stamina = Math.min(1, r.stamina + e.staminaRestore);
      if (e.extraDice) r.extraDice += e.extraDice;
      var reweather = false;
      if (e.garraChanceBonus) { r.garraBonusTotal += e.garraChanceBonus; reweather = true; }
      if (e.garraBoostBonus) { r.garraBoostBonusTotal += e.garraBoostBonus; reweather = true; }
      if (e.weatherDouble) { r.weatherDouble = true; reweather = true; }
      if (reweather) applyWeather(r, cond.weatherAtual);
      if (e.speedMult || e.accelMult || e.drainMult || e.curveBonus || e.hillBonus || e.hillDrainMult) {
        r.effects.push({
          untilT: e.durationS ? t + e.durationS : null,
          untilPos: e.distanceM ? pos + e.distanceM : (e.blockScoped ? blockTo : null),
          speedMult: e.speedMult || 1,
          accelMult: e.accelMult || 1,
          drainMult: e.drainMult || 1,
          curveBonus: e.curveBonus || 0,
          hillBonus: e.hillBonus || 0,
          hillDrainMult: e.hillDrainMult || 1
        });
      }
      ev(t, r.index, 'skill', r.label + ' ativou ' + sk.name + '!');
    }

    // Tenta todas as skills do corredor com o gatilho dado (na ordem da lista).
    function trigger(r, trig, t, pos, blockTo) {
      for (var s = 0; s < r.skills.length; s++) {
        if (GameData.SKILLS[r.skills[s]].trigger === trig) tryFire(r, r.skills[s], t, pos, blockTo);
      }
    }

    // Liderança
    var leader = -1, cand = -1, candSince = 0, lastLeadEvent = -1e9, leadInit = false;

    var finishedCount = 0;
    var step = 0;
    var prevPos = new Array(n);

    while (finishedCount < n) {
      step++;
      var t = step / 10; // dt = 0.1 exato, sem acumular erro
      if (t > T.maxTime) break;
      var tPrev = (step - 1) / 10;

      for (i = 0; i < n; i++) prevPos[i] = R[i].pos;

      for (i = 0; i < n; i++) {
        var r = R[i];
        if (r.finished) {
          r.v = Math.max(0, r.v - 8 * dt);
          continue;
        }
        var pos = prevPos[i];
        if (!r.started) { r.started = true; trigger(r, 'start', tPrev, pos, null); }
        if (tPrev < r.startDelay) continue;   // ainda reagindo ao sinal de largada
        var p = pos / D;
        var rem = D - pos;

        // gatilhos de bloco (checados antes de mover, com o bloco de `pos`)
        var bi = blockAt(blocks, pos);
        if (bi !== r.blockIdx) {
          var prevB = r.blockIdx;
          r.blockIdx = bi;
          var bTo = blocks[bi].to;
          if (prevB >= 0 && blocks[prevB].type === 'curva') trigger(r, 'curveExit', tPrev, pos, bTo);
          if (blocks[bi].type === 'curva') trigger(r, 'curve', tPrev, pos, bTo);
          else if (blocks[bi].type === 'subida') trigger(r, 'hill', tPrev, pos, bTo);
          else if (bi > 0 && blocks[bi].to - blocks[bi].from >= T.straightMinM) trigger(r, 'straight', tPrev, pos, bTo);
        }
        var blk = blocks[r.blockIdx];
        // clima (checado a cada tick: pode passar a valer quando o clima mudar)
        trigger(r, 'weather:' + cond.weatherAtual, tPrev, pos, blk.to);
        if (r.stamina <= T.lowStaminaAt && !r.exhausted) trigger(r, 'lowStamina', tPrev, pos, blk.to);
        if (p >= T.garraZone) trigger(r, 'final', tPrev, pos, blk.to);

        // efeitos ativos
        var effSpeed = 1, effAccel = 1, effDrain = 1, curveBonus = 0, hillBonus = 0, hillDrainMult = 1;
        for (var e = 0; e < r.effects.length; e++) {
          var fx = r.effects[e];
          if ((fx.untilT == null || tPrev < fx.untilT) && (fx.untilPos == null || pos < fx.untilPos)) {
            effSpeed *= fx.speedMult; effAccel *= fx.accelMult; effDrain *= fx.drainMult;
            curveBonus += fx.curveBonus; hillBonus += fx.hillBonus; hillDrainMult *= fx.hillDrainMult;
          }
        }

        // Garra
        if (!r.garraRolled && p >= T.garraZone) {
          r.garraRolled = true;
          if (r.rng() < r.garraChance) {
            r.garraMult = r.garraBoost;
            ev(tPrev, i, 'garra', r.label + ' mostrou GARRA na reta final!');
          }
        }

        // terreno e bloco
        var nf = clamp(r.nf, 0, 1.2), nm = clamp(r.nm, 0, 1.2);
        var speedMod = weatherSlow;
        var drainMod = surf.drain * weatherDrain * distDrain * effDrain;
        speedMod *= 1 - surf.slow * (1 - T.forcaSurfRelief * nf);
        var fatorBloco = 1;
        if (blk.type === 'curva') {
          fatorBloco = Math.min(1, T.curveBase + T.curveRange * nm + curveBonus);
        } else if (blk.type === 'subida') {
          fatorBloco = Math.min(1, T.hillBase + T.hillRange * nf + hillBonus);
          drainMod *= 1 + T.hillDrain * (1 - 0.5 * nf) * hillDrainMult;
        }
        // pelotão e vácuo (vácuo vale para todos)
        var neighbors = 0, drafting = false;
        for (var j = 0; j < n; j++) {
          if (j === i || R[j].finished) continue;
          var gap = prevPos[j] - pos;
          if (Math.abs(gap) <= T.crowdRange) neighbors++;
          if (gap >= T.draftMin && gap <= T.draftRange) drafting = true;
        }
        if (neighbors > 0) {
          speedMod *= 1 - T.crowdSlow * Math.min(neighbors, 3) / 3 * (1 - T.forcaCrowdRelief * nf);
        }
        if (drafting) drainMod *= 1 - T.draftSave;

        // ritmo do jóquei (perfil único)
        var s;
        if (r.exhausted) {
          s = T.exhaustPace;
        } else {
          var hf = hillFraction(blocks, pos, D);
          // na subida o gasto por segundo é o da reta (sEff já desconta o fatorSubida), mas o trecho
          // dura 1/fatorSubida a mais: o jóquei prevê isso na fração de subida restante
          var fsH = Math.min(1, T.hillBase + T.hillRange * nf);
          var cEst = surf.drain * weatherDrain * distDrain * (1 + hf * ((1 + T.hillDrain * (1 - 0.5 * nf)) / fsH - 1));
          var vRef = r.vMax * speedMod;
          var aff = affordablePace(r.stamina + r.jockeyErr - T.rationReserve, rem, vRef, r.pool, cEst);
          s = Math.min(p < T.pace.spurtStart ? T.pace.mid : T.pace.spurtCap, aff);
          s = Math.max(s, T.minPace);
        }

        var boost = effSpeed * r.garraMult;
        var jitter = 1 + (r.rng() - 0.5) * T.tickJitter;
        var vTarget = s * r.vMax * speedMod * fatorBloco * boost * jitter;

        if (r.v < vTarget) r.v = Math.min(vTarget, r.v + r.accel * effAccel * dt);
        else r.v = Math.max(vTarget, r.v - T.decel * dt);

        // gasto de estamina (boosts não custam)
        if (!r.exhausted) {
          // na subida o fatorBloco é esforço, não descanso: sem dividir por ele, quem é lento na
          // subida gasta menos estamina e recupera no fim (o especialista de Força perdia na subida)
          var sEff = r.v / (r.vMax * boost * (blk.type === 'subida' ? fatorBloco : 1));
          r.stamina -= T.drainK * powi(sEff, T.drainExp) * drainMod * dt / r.pool;
          if (r.stamina <= 0) {
            r.stamina = 0;
            r.exhausted = true;
            if (rem > D * 0.02) ev(t, i, 'cansou', r.label + ' cansou e perdeu o ritmo!');
          }
        }

        var newPos = pos + r.v * dt;
        if (newPos >= D) {
          r.finishTime = tPrev + (r.v > 0 ? (D - pos) / r.v : dt);
          r.pos = D;
          r.finished = true;
          finishedCount++;
        } else {
          r.pos = newPos;
        }
      }

      // Dado da Sorte: quando o líder cruza diceAt[k]·D, todos rolam (inclusive quem já chegou)
      var maxPos = 0;
      for (i = 0; i < n; i++) if (R[i].pos > maxPos) maxPos = R[i].pos;
      while (n > 0 && diceIdx < diceAt.length && maxPos >= diceAt[diceIdx] * D) {
        // gatilho 'dice' (Dado Viciado): tenta no fluxo do próprio corredor, antes de rolar
        for (i = 0; i < n; i++) trigger(R[i], 'dice', t, R[i].pos, null);
        var rolls = [], cands = [];
        for (i = 0; i < n; i++) {
          var rd = rollDice(diceRng, R[i].stats.sorte, R[i].extraDice);
          rolls.push({ racer: i, dice: rd.dice, best: rd.best, rerolls: 0 });
          cands.push(i);
        }
        // empate no topo: re-rola só os empatados até sobrar um. Teto de 20 rodadas de
        // desempate (na prática inalcançável); se ainda empatar, vence o menor índice
        // (tied segue a ordem crescente dos índices, então tied[0]).
        for (var tieRound = 0; ; tieRound++) {
          var top = -1, tied = [];
          for (q = 0; q < cands.length; q++) {
            var bq = rolls[cands[q]].best;
            if (bq > top) { top = bq; tied = [cands[q]]; } else if (bq === top) tied.push(cands[q]);
          }
          if (tied.length === 1 || tieRound >= 20) break;
          cands = tied;
          for (q = 0; q < cands.length; q++) {
            var ro = rolls[cands[q]];
            var rr = rollDice(diceRng, R[cands[q]].stats.sorte, R[cands[q]].extraDice);
            ro.dice = rr.dice; ro.best = rr.best; ro.rerolls++;
          }
        }
        var win = tied[0];
        var wEl = GameData.ELEMENTS[R[win].element];
        var novo = (wEl && wEl.weather) || cond.weatherAtual;
        var changed = novo !== cond.weatherAtual;
        if (changed) {
          cond.weatherAtual = novo;

 * (ECONOMY.breeding: mareWeight 0,6; levelSaturation 30). L=0 é o pior caso, L=1 o melhor.
 *
 * RARIDADE do potro: linha "same" se os pais têm a mesma raridade, senão "mixed". Base = a MENOR
 * ordem entre os pais. Quatro colunas (1 abaixo, igual, 1 acima, 2 acima da base), cada uma
 * interpolada em % entre lv1 e lv30: p = p0 + (p1 − p0)·L. Alvo da coluna k = base − 1 + k;
 * alvo fora de [0, maxRarityOrder] é preso ao limite e SOMA no alvo preso. Mítico nunca nasce
 * de cruzamento (maxRarityOrder = 3).
 *
 * GRAU (1–3 estrelas): gb = round(mareWeight·grau da égua + (1−mareWeight)·grau do garanhão); desce/mantém/sobe
 * interpolados por L; alvo fora de 1–3 soma em "mantém". Se a raridade SUBIU o potro nasce ★1;
 * se DESCEU, ★3 (sem sorteio de grau).
 *
 * ALUGUEL: Math.round(rentalBase[raridade] · grauMult[grau−1]); Mítico não se aluga (null).
 * CORCEL: montaria que já tem todas as skills "de linha" da sua raridade (CORCEL_SETS).
 *

 *   1. raridade (1 chamada); rarityChanged = sinal(ordem do resultado − menor ordem dos pais)
 *   2. grau (1 chamada, só se a raridade não mudou; subiu ⇒ ★1, desceu ⇒ ★3)
 *   3. elemento (1 chamada, só se os pais têm elementos diferentes: < 0,5 ⇒ égua)
 *   4. sexo (1 chamada: < 0,5 ⇒ fêmea)

/*
 * MMORPG Horse — equipamento (protótipo descartável). Módulo PURO: sem DOM, sem estado, sem Math.random;
 * as entradas nunca são mutadas. Todo sorteio usa RaceSim.mulberry32 + RaceSim.hash2.
 *

 *   - enhance(item, seedBase, counter): UMA chamada por tentativa,
 *     rng = mulberry32(hash2(seedBase, 0xE4A0 + counter)); sucesso se roll < chance do passo.
 *   - podiumStone(seed, place, fee): UMA chamada por prêmio, rng = mulberry32(hash2(seed, 0xB1AC)),
 *     só se fee > 0 e place em 1–3 (senão devolve 0 sem sortear).
 *   - resolve/botGear/enhanceOdds/sellPrice/ratingPts: não sorteiam.
 *
 * OBJETO RESOLVIDO (resolve e botGear):
 *   { mods: { vel, acel, man, forca, est, garra, sorte },        // sempre as 7 chaves
 *     special: { skillChanceBonus, weatherDoubleClimate, ignoreWeatherPenalty },
 *     set: { id, count },                                         // id null e count 0 sem peças de conjunto
 *     pieces: [{ slot, uid, id, plus }] }                         // ordem de GEAR_SLOTS, só peças válidas

 * Conjunto = o que tem mais peças (empate: ordem sol/chuva/nevoa). Bônus acumulam:
 *   >= 3: sorte +5 e skillChanceBonus 0,05 · >= 4: weatherDoubleClimate = set.id · >= 5: ignoreWeatherPenalty.
 *

 *   0 nada · 1 ferraduras-comum, sela-comum +0 · 2 cinco Comuns +2 · 3 cinco Mágicas +3 ·
 *   4 três Raras +4 do conjunto (ferraduras, sela, estribos) + testeira-magico, armadura-magico +3 ·
 *   5 cinco Raras +7 do conjunto.

      for (var r = 0; r < map.length; r++) {

        for (var c = 0; c < row.length; c++) {

          if (ch === '.' || ch === ' ') continue;
          var x = L.x + c, y = L.y + r;
          if (x < 0 || y < 0 || x >= HORSE_W || y >= HORSE_H) continue;

      '...oooo...'], pal: { o: '#2a2630', w: '#f0ece4', s: '#b8b2ac', d: '#7a7480', n: '#4a4450' } }
  };
  var iconCache = new Map();
  function drawElementIcon(ctx, x, y, element, scale) {
    var s = Math.max(1, Math.round(scale || 1));
    var ic = ICONS[element] || ICONS.neutro;
    var key = (element || 'neutro') + '|' + s;
    var c = iconCache.get(key);

  // ===================================================================
  // Rastro de elemento (partículas atrás do cavalo)
  // ===================================================================
  // Cada elemento tem estágios (nascimento -> fim) e algumas formas alternativas.
  var TRAIL = {
    fogo: {
      pal: { w: '#fff6c0', Y: '#ffd23a', y: '#ff9a1e', r: '#e2401a', d: '#8a2a1a', s: '#5a4a52' },
      stages: [
        [['..y..', '.yYy.', 'yYwYy', 'yrYry', '.rrr.'], ['.y...', '.Yy.y', 'yYwYy', 'rYYyr', '.rrr.']],
        [['.y.', 'yYy', 'ryr'], ['y..', 'yYy', '.rr']],
        [['yr', 'rd'], ['.y', 'rd']],
        [['ss', 'ss'], ['s.', 'ss']]
      ]
    },
    agua: {
      pal: { w: '#effeff', l: '#a8ecff', b: '#46c2f0', d: '#2382c6' },
      stages: [
        [['.w.', 'wlb', 'lbb', 'bbd', '.d.'], ['.w..', 'wlb.', 'lbbd', '.dd.']],
        [['.w.', 'wbb', '.d.'], ['wb', 'bd']],
        [['l.l', '.b.'], ['b.', '.l']],
        [['l'], ['.l', 'l.']]
      ]
    },
    grama: {
      pal: { l: '#c4f27a', g: '#56b640', d: '#2c6e2c', s: '#8a6a3a' },
      stages: [
        [['..lg', '.lgd', 'lgd.', 's...'], ['lg..', 'dlg.', '.dlg', '...s'], ['.ll.', 'lggd', '.dd.']],
        [['.l', 'lg', 'd.'], ['lg', '.d'], ['l.', 'gd']],
        [['.l', 'lg', 'd.'], ['lg', '.d'], ['l.', 'gd']],
        [['g'], ['l']]
      ]
    },
    neutro: {
      pal: { d: '#d8c8a8', D: '#bca888', l: '#efe4cc' },
      stages: [
        [['ld', 'dD']],
        [['.ld.', 'lddD', '.DD.']],
        [['.ll.', 'lddd', 'dddD', '.dD.']],
        [['.l.l', 'l.d.', '.d.l']]

  };
  function drawTrail(ctx, x, y, element, t, intensity, scale) {
    var s = Math.max(1, Math.round(scale || 2));
    var I = Math.max(0, Math.min(1, intensity == null ? 1 : intensity));
    if (I <= 0.01) return;
    var def = TRAIL[element] || TRAIL.neutro;
    var n = Math.round(5 + 13 * I);
    t = t || 0;
    for (var i = 0; i < n; i++) {
      var life = 0.5 + 0.35 * hash(i * 13 + 1);
      var u = t / life + hash(i * 7 + 3);
      var age = frac(u), cyc = Math.floor(u);
      var jx = hash(i * 31 + cyc * 17), jy = hash(i * 17 + cyc * 29);
      var px, py;
      if (element === 'fogo') {          // labaredas sobem e ficam para trás
        px = x - age * (16 + 14 * jx) * s - jx * 3 * s;
        py = y + (jy - 0.5) * 9 * s - age * (6 + 8 * jy) * s;
      } else if (element === 'agua') {   // gotas em arco que caem
        px = x - age * (18 + 12 * jx) * s - jx * 3 * s;
        py = y + (jy - 0.5) * 8 * s + (age * age * 20 - age * 9) * s;
      } else if (element === 'grama') {  // folhas rodopiando
        px = x - age * (20 + 14 * jx) * s;
        py = y + (jy - 0.5) * 10 * s + Math.sin(age * 8 + i) * 3 * s + age * 5 * s;
      } else {                           // poeira
        px = x - age * (10 + 8 * jx) * s - jx * 3 * s;
        py = y + 8 * s + (jy - 0.5) * 4 * s - age * 4 * s;
      }
      var st = def.stages[Math.min(def.stages.length - 1, Math.floor(age * def.stages.length))];
      var shape = st[(i + Math.floor(age * 7)) % st.length];
      ctx.globalAlpha = Math.max(0, (1 - age * age) * (0.55 + 0.45 * I));
      drawMap(ctx, shape, Math.round(px / s) * s, Math.round(py / s) * s, s, def.pal);
    }
    ctx.globalAlpha = 1;
  }

  // ===================================================================
  // PISTA
  // ===================================================================
  var SKY = {
    sol: ['#4aa6f0', '#63b8f6', '#7fc8f8', '#9ad6f8', '#b6e2f6', '#d2ecf2'],
    nublado: ['#7f93a8', '#8ea0b3', '#9caebd', '#aab9c6', '#b8c4ce', '#c6ced6'],
    chuva: ['#3c4858', '#45525f', '#4f5c68', '#5a6672', '#66717c', '#727c86']
  };
  var HILLS = {
    sol: { far: '#8fb8d8', mid: '#6aa65a', near: '#4f8f45', tree: '#3c7638', treeL: '#5ea24e' },
    nublado: { far: '#8e9fb0', mid: '#69906a', near: '#557d55', tree: '#436a45', treeL: '#5b875a' },
    chuva: { far: '#5d6a78', mid: '#4b6655', near: '#3f5a48', tree: '#33493b', treeL: '#46604c' }
  };
  var SURF = {
    grama: { a: '#5cb44a', b: '#4ea640', dark: '#3f8f36', lite: '#7ccc5c', edge: '#8a7a4c' },
    terra: { a: '#a46c3e', b: '#9a6337', dark: '#6e4324', lite: '#c08a58', edge: '#7a5030' },
    areia: { a: '#e2c98f', b: '#d9be82', dark: '#bf9f62', lite: '#f4e4b8', edge: '#c8aa70' }
  };

  // Névoa usa as mesmas cores apagadas do nublado (céu, colinas, gramados, arquibancada).
  function isDim(weather) { return weather === 'nublado' || weather === 'nevoa'; }
  function skyKey(weather) { return weather === 'nevoa' ? 'nublado' : weather; }

  var tileCache = new Map();
  function surfaceTile(surface, weather, artH) {
    var key = surface + '|' + weather + '|' + artH;
    var c = tileCache.get(key);
    if (c) return c;
    var TW = 64, S = SURF[surface] || SURF.grama;
    var cols = new Array(TW * artH);
    var wet = weather === 'chuva';
    for (var y = 0; y < artH; y++) {
      for (var x = 0; x < TW; x++) {
        var h = hash2(x, y), col;
        if (surface === 'grama') {
          col = (x < 32) ? S.a : S.b;
          var bl = hash2(x, y + 1);
          if (h < 0.035 || bl < 0.03) col = mix(col, S.dark, 0.75);
          else if (h > 0.975) col = S.lite;
          if (x === 0 || x === 32) col = mix(col, S.dark, 0.12);
        } else if (surface === 'terra') {
          col = (h < 0.5) ? S.a : S.b;
          if (y % 4 === 3 && hash2(x, 99) > 0.25) col = mix(col, S.dark, 0.35);
          if (h > 0.965) col = S.lite;
          var cl = hash2(Math.floor(x / 2), Math.floor(y / 2) + 500);
          if (cl < 0.035) col = S.dark;
        } else {
          col = (h < 0.5) ? S.a : S.b;
          var wave = Math.round(1.5 * Math.sin(x * 0.35 + y * 0.1));
          if ((y + wave) % 6 === 0) col = mix(col, S.dark, 0.35);

        }
        if (wet) {
          col = shade(col, 0.22);
          var pd = vnoise(x * 0.18 + y * 0.9) * vnoise(y * 0.5 + 11);
          if (surface !== 'grama' && pd > 0.42) col = mix(col, '#9fb4c8', 0.35);
          if (surface === 'grama' && h > 0.9) col = mix(col, '#cfe8ff', 0.4);
        }
        cols[y * TW + x] = col;
      }
    }
    c = gridToCanvas(cols, TW, artH);
    tileCache.set(key, c);
    if (tileCache.size > 60) tileCache.clear();
    return c;
  }

  // Arquibancada (tile em pixels de arte), 2 quadros de torcida.
  function standTile(weather, frame) {
    var key = 'stand|' + weather + '|' + frame;
    var c = tileCache.get(key);
    if (c) return c;
    var TW = 120, TH = 40;
    var cols = new Array(TW * TH).fill(null);
    function px(x, y, col) { if (x >= 0 && y >= 0 && x < TW && y < TH) cols[y * TW + x] = col; }
    var dim = weather === 'chuva' ? 0.35 : isDim(weather) ? 0.15 : 0;
    function C(h) { return dim ? shade(h, dim) : h; }
    // estrutura: x 6..86
    var x0 = 6, x1 = 88;
    for (var x = x0; x <= x1; x++) {
      // telhado
      px(x, 6, C('#7a2a30')); px(x, 7, C('#a83a3a')); px(x, 8, C(x % 6 < 3 ? '#e8e2d6' : '#c83c3c'));
      px(x, 9, C('#5a2026'));
      // fundo sombra interna
      for (var y = 10; y < 34; y++) px(x, y, C('#3c3446'));
      // degraus
      for (var yy = 12; yy < 34; yy += 4) px(x, yy, C('#6b6070'));
      // base
      for (var y2 = 34; y2 < 40; y2++) px(x, y2, C(y2 === 34 ? '#d6cfc2' : '#b8b0a2'));
    }
    // colunas
    for (var cx = x0; cx <= x1; cx += 16) for (var cy = 9; cy < 34; cy++) { px(cx, cy, C('#e6e0d4')); px(cx + 1, cy, C('#b8b0a2')); }
    // torcida
    var crowd = ['#e84a4a', '#3a7ae0', '#f2c230', '#f0f0f0', '#38b25a', '#e07ab8', '#f08a2a', '#7a5ae0'];
    var skin = ['#f1c8a0', '#d9a070', '#a86a40', '#7a4a2a'];
    for (var row = 0; row < 5; row++) {
      var by = 13 + row * 4;
      for (var hx = x0 + 3; hx < x1 - 1; hx += 2) {
        if ((hx - x0) % 16 < 2) continue;
        var hh = hash2(hx, row * 7);
        if (hh < 0.12) continue;
        var up = ((hash2(hx, row) > 0.5) ? 1 : 0) ^ frame ? 1 : 0;
        var bodyC = crowd[Math.floor(hash2(hx, row + 50) * crowd.length)];
        if (weather === 'chuva' && hash2(hx, row + 90) < 0.35) {
          // guarda-chuva
          var uc = crowd[Math.floor(hash2(hx, row + 91) * crowd.length)];
          px(hx - 1, by - 2 - up, C(uc)); px(hx, by - 3 - up, C(uc)); px(hx + 1, by - 2 - up, C(uc)); px(hx, by - 2 - up, C(uc));
          px(hx, by - 1 - up, C('#2a2a2a'));
        } else {
          px(hx, by - up, C(skin[Math.floor(hash2(hx, row + 70) * skin.length)]));
        }
        px(hx, by + 1 - up, C(bodyC));
        px(hx, by + 2, C(shade(bodyC, 0.3)));
      }
    }
    // bandeirinhas
    for (var fx = x0 + 8; fx < x1; fx += 16) {
      for (var fy = 0; fy < 6; fy++) px(fx, fy, C('#d8d2c6'));
      var fc = crowd[(fx >> 4) % crowd.length];
      var wv = frame ? 0 : 1;
      px(fx + 1, 0 + wv, C(fc)); px(fx + 2, 0 + wv, C(fc)); px(fx + 3, 1, C(fc)); px(fx + 1, 1 + wv, C(fc)); px(fx + 2, 1, C(fc));

    for (var tx = 94; tx < 118; tx += 9) {
      var th = 10 + Math.floor(hash(tx) * 8);
      for (var ty = 0; ty < th; ty++) {
        var wdt = Math.round(4 - Math.abs(ty - th * 0.45) * 0.5);
        for (var dx = -wdt; dx <= wdt; dx++) px(tx + dx, 34 - th - 2 + ty, C((dx + ty) % 3 === 0 ? HILLS.sol.treeL : HILLS.sol.tree));
      }
      for (var ty2 = 32; ty2 < 40; ty2++) { px(tx, ty2, C('#5a3a24')); }
    }
    c = gridToCanvas(cols, TW, TH);
    tileCache.set(key, c);
    return c;
  }

  // Nuvem de pixels (cache)
  function cloudCanvas(seed, P, tone) {
    var key = 'cloud|' + seed + '|' + P + '|' + tone;
    var c = tileCache.get(key);
    if (c) return c;
    var w = 34 + Math.floor(hash(seed) * 20), h = 12;
    var cols = new Array(w * h).fill(null);
    var blobs = [];
    var nb = 3 + Math.floor(hash(seed + 1) * 3);
    for (var i = 0; i < nb; i++) blobs.push([6 + hash(seed * 7 + i) * (w - 12), 5 + hash(seed * 3 + i) * 3, 4 + hash(seed * 5 + i) * 4]);
    var tones = {
      sol: ['#ffffff', '#e4f0fa', '#c4d8ea'],
      nublado: ['#e6eaee', '#c8d0d8', '#a4b0bc'],
      chuva: ['#8a949e', '#727c86', '#5c6670']
    }[tone] || ['#ffffff', '#e4f0fa', '#c4d8ea'];
    for (var y = 0; y < h; y++) for (var x = 0; x < w; x++) {
      var inside = false, top = 99;
      for (var b = 0; b < blobs.length; b++) {
        var dx = x - blobs[b][0], dy = (y - blobs[b][1]) * 1.4;
        if (dx * dx + dy * dy < blobs[b][2] * blobs[b][2]) { inside = true; top = Math.min(top, dy); }
      }
      if (y >= h - 2) inside = inside && x > 3 && x < w - 4;
      if (inside) cols[y * w + x] = y > h - 4 ? tones[2] : (y < 5 ? tones[0] : tones[1]);
    }
    c = scaleCanvas(gridToCanvas(cols, w, h), P);
    tileCache.set(key, c);
    return c;
  }

  // Placa com texto (borda escura)
  function drawBoard(ctx, cx, top, text, P, bg, fg) {
    var tw = measureText(text, P);
    var w = tw + 4 * P, h = 9 * P;
    var x = Math.round(cx - w / 2);
    ctx.fillStyle = '#1c1820'; ctx.fillRect(x - P, top - P, w + 2 * P, h + 2 * P);
    ctx.fillStyle = bg; ctx.fillRect(x, top, w, h);
    ctx.fillStyle = 'rgba(0,0,0,0.15)'; ctx.fillRect(x, top + h - P, w, P);
    drawText(ctx, text, x + 2 * P, top + 2 * P, { scale: P, color: fg });
    return { x: x, w: w, h: h };
  }

  // Subidas em relevo: a faixa da pista (e quem corre nela) sobe em rampa ao longo do trecho e
  // desce rápido no fim (placa FIM), o mesmo desenho do perfil da sala de largada. Em rampa (e não
  // em lombada) a inclinação aparece em qualquer ponto da subida, não só nas bordas.
  var HILL_AMP = 24;   // altura máxima em pixels de arte (trechos longos)
  function hillShape(m, a, b) {
    if (!(m > a && m < b)) return 0;
    var len = b - a, d = Math.min(0.3, 30 / len), u = (m - a) / len;
    return u < 1 - d ? u / (1 - d) : (1 - u) / d;
  }
  function hillAmp(a, b) { return Math.max(10, Math.min(HILL_AMP, Math.round((b - a) * 0.1))); }
  // maxLift (opcional): teto da altura quando falta espaço acima da pista (ex.: celular deitado)
  function hillLiftAt(m, hills, maxLift) {
    if (!hills) return 0;
    for (var i = 0; i < hills.length; i++) {
      var a = hills[i][0], b = hills[i][1];
      if (m > a && m < b) {
        var amp = hillAmp(a, b);
        if (maxLift != null) amp = Math.min(amp, maxLift);
        return Math.round(amp * hillShape(m, a, b));
      }
    }
    return 0;
  }

  function drawTrack(ctx, o) {
    var W = o.width, Hh = o.height;
    var lanes = o.lanes || 6, laneH = o.laneH || 24, laneTop = o.laneTop || Math.round(Hh * 0.35);
    var ppm = Math.max(0.05, o.pxPerMeter || 4), cam = o.cameraX || 0, t = o.t || 0;
    var weather = skyKey(o.weather || 'sol'), surface = o.surface || 'grama';
    var P = o.pixel || Math.max(1, Math.round(laneH / 12));
    var trackH = lanes * laneH, trackBottom = laneTop + trackH;
    var camPx = cam * ppm;
    function sx(m) { return Math.round((m - cam) * ppm); }
    crisp(ctx);

    // --- céu em faixas
    var sky = SKY[weather] || SKY.sol;
    var horizon = laneTop - 22 * P; // linha do chão atrás da arquibancada
    var bandH = Math.ceil(horizon / sky.length / P) * P;
    for (var b = 0; b < sky.length; b++) { ctx.fillStyle = sky[b]; ctx.fillRect(0, b * bandH, W, bandH + 1); }
    if (horizon > sky.length * bandH) { ctx.fillStyle = sky[sky.length - 1]; ctx.fillRect(0, sky.length * bandH, W, horizon - sky.length * bandH); }

    // sol de fundo
    if (weather === 'sol') {
      var sunX = Math.round(W * 0.82), sunY = Math.round(Math.max(10 * P, horizon * 0.25)), r = 7 * P;
      ctx.fillStyle = 'rgba(255,240,180,0.35)';
      ctx.fillRect(sunX - r - 3 * P, sunY - r + 2 * P, 2 * r + 6 * P, 2 * r - 4 * P);
      ctx.fillRect(sunX - r + 2 * P, sunY - r - 3 * P, 2 * r - 4 * P, 2 * r + 6 * P);
      ctx.fillStyle = '#fff3b0';
      ctx.fillRect(sunX - r, sunY - r + 2 * P, 2 * r, 2 * r - 4 * P);
      ctx.fillRect(sunX - r + 2 * P, sunY - r, 2 * r - 4 * P, 2 * r);
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(sunX - r + 3 * P, sunY - r + 2 * P, 3 * P, 2 * P);
    }

    // nuvens de fundo
    var nClouds = weather === 'sol' ? 3 : isDim(weather) ? 7 : 9;
    for (var ci = 0; ci < nClouds; ci++) {
      var cc = cloudCanvas(ci % 5, P, weather);
      var span = W + cc.width * 2;
      var cxp = mod(hash(ci + 40) * span - camPx * 0.02 - t * (3 + ci % 3) * P, span) - cc.width;
      var cyp = Math.round((0.08 + 0.55 * hash(ci + 70)) * (horizon - 30 * P));
      if (weather !== 'sol') cyp = Math.round((hash(ci + 70) * 0.6) * (horizon - 30 * P));
      ctx.drawImage(cc, Math.round(cxp), Math.max(0, cyp));
    }

    // montanhas distantes e colinas
    var HC = HILLS[weather] || HILLS.sol;
    function ridge(par, base, amp, freq, col, seedOff) {
      ctx.fillStyle = col;
      var off = camPx * par;
      for (var x = 0; x < W; x += P) {
        var wx = (x + off) / P;
        var hgt = base + amp * (0.65 * vnoise(wx * freq + seedOff) + 0.35 * vnoise(wx * freq * 3.1 + seedOff * 2));
        hgt = Math.round(hgt) * P;
        ctx.fillRect(x, horizon - hgt, P, hgt);
      }
    }
    ridge(0.03, 8, 22, 0.012, HC.far, 10);
    ridge(0.08, 4, 14, 0.02, HC.mid, 50);
    // copas de árvores na colina próxima
    ridge(0.15, 2, 6, 0.08, HC.near, 90);

    // arquibancada (tile repetido)
    var frame = Math.floor(t * 3) % 2;
    var st = standTile(weather, frame);
    var stW = st.width * P, stH = st.height * P;
    var stY = laneTop - 4 * P - stH;
    var stOff = mod(camPx * 0.35, stW);
    for (var sxp = -stOff; sxp < W; sxp += stW) ctx.drawImage(st, Math.round(sxp), stY, stW, stH);

    // gramado entre arquibancada e pista
    ctx.fillStyle = weather === 'chuva' ? '#3f6a3c' : isDim(weather) ? '#4a7c44' : '#58944a';
    ctx.fillRect(0, laneTop - 4 * P, W, 4 * P);

    // --- superfície da pista
    var artH = Math.ceil(trackH / P);
    var tile = surfaceTile(surface, weather, artH);
    var tw = tile.width * P;
    var tOff = mod(camPx, tw);
    for (var tx = -tOff; tx < W; tx += tw) ctx.drawImage(tile, Math.round(tx), laneTop, tw, artH * P);

    // divisórias de raia
    var SC = SURF[surface] || SURF.grama;
    for (var l = 1; l < lanes; l++) {
      var ly = laneTop + l * laneH;
      ctx.fillStyle = rgba('#ffffff', surface === 'areia' ? 0.28 : 0.16);
      var dash = 6 * P, gap = 4 * P, dOff = mod(camPx, dash + gap);
      for (var dx = -dOff; dx < W; dx += dash + gap) ctx.fillRect(Math.round(dx), ly - Math.floor(P / 2), dash, Math.max(1, Math.floor(P / 2) || 1));
    }
    // borda escura no topo da pista (sombra da cerca)
    ctx.fillStyle = 'rgba(0,0,0,0.18)'; ctx.fillRect(0, laneTop, W, P);
    // raia destacada (a do jogador): faixa dourada translúcida com bordas tracejadas
    var hl = o.highlightLane;
    if (hl != null && hl >= 0 && hl < lanes) {
      var hly = laneTop + hl * laneH;
      ctx.fillStyle = 'rgba(242,194,48,0.12)'; ctx.fillRect(0, hly, W, laneH);
      ctx.fillStyle = 'rgba(242,194,48,0.6)';
      var hd = 4 * P, hOff = mod(camPx, hd * 2);
      for (var hlx = -hOff; hlx < W; hlx += hd * 2) { ctx.fillRect(Math.round(hlx), hly, hd, P); ctx.fillRect(Math.round(hlx), hly + laneH - P, hd, P); }
    }

    // --- subidas
    var hills = o.hills || [];
    for (var hi = 0; hi < hills.length; hi++) {
      var a = sx(hills[hi][0]), bb = sx(hills[hi][1]);
      if (bb < -60 * P || a > W + 60 * P) continue;
      var x0 = Math.max(0, a), x1 = Math.min(W, bb);
      if (x1 > x0) {
        ctx.fillStyle = 'rgba(40,20,10,0.22)'; ctx.fillRect(x0, laneTop, x1 - x0, trackH);
        // hachura diagonal ancorada no mundo
        ctx.fillStyle = 'rgba(255,255,255,0.07)';
        var step = 10 * P;
        for (var yy = laneTop; yy < trackBottom; yy += P) {

    // --- curvas: tinta azulada sobre as raias e setas ↪ ao longo da cerca externa (ancoradas no mundo)

    for (var mm = mStart; mm <= mEnd; mm += ev) {

      if (ha > -40 * P && ha < W + 40 * P) {
        ctx.fillStyle = '#5a3a24'; ctx.fillRect(ha, laneTop - 16 * P, P, 16 * P);
        var bd = drawBoard(ctx, ha, laneTop - 26 * P, 'SUBIDA', P, '#f2c230', '#1c1820');
        // rampinha
        ctx.fillStyle = '#1c1820';
        for (var q = 0; q < 4; q++) ctx.fillRect(bd.x + bd.w + 2 * P + q * P, laneTop - 19 * P - q * P, P, (q + 1) * P);
      }
      if (hb > -40 * P && hb < W + 40 * P) {
        ctx.fillStyle = '#5a3a24'; ctx.fillRect(hb, laneTop - 12 * P, P, 12 * P);
        drawBoard(ctx, hb, laneTop - 22 * P, 'FIM', P, '#f2c230', '#1c1820');

      var aStep = 40 * P, aFrom = ka + aStep / 2;
      if (aFrom < 0) aFrom += Math.ceil(-aFrom / aStep) * aStep;
      ctx.fillStyle = '#7ab8ff';

        var ay = laneTop - 10 * P;

        ctx.fillRect(ax + 2 * P, ay, P, P); ctx.fillRect(ax + 3 * P, ay + P, P, P); ctx.fillRect(ax + 2 * P, ay + 2 * P, P, P);
      }
      if (ka > -40 * P && ka < W + 40 * P) {
        ctx.fillStyle = '#2a4a78'; ctx.fillRect(ka, laneTop - 16 * P, P, 16 * P);
        drawBoard(ctx, ka, laneTop - 26 * P, 'CURVA', P, '#7ab8ff', '#1c1820');
      }
      if (kb > -40 * P && kb < W + 40 * P) {
        ctx.fillStyle = '#2a4a78'; ctx.fillRect(kb, laneTop - 12 * P, P, 12 * P);
        drawBoard(ctx, kb, laneTop - 22 * P, 'FIM', P, '#7ab8ff', '#1c1820');
      }
    }
    if (sx0 > -40 * P && sx0 < W + 40 * P) {
      ctx.fillStyle = '#e8e2d6'; ctx.fillRect(sx0, laneTop - 14 * P, P, 14 * P);

    if (fx > -60 * P && fx < W + 60 * P) {

      ctx.fillStyle = '#f6f2ea'; ctx.fillRect(fx, postTop, 2 * P, laneTop - postTop);

      ctx.fillStyle = '#d83030'; ctx.fillRect(fx - 2 * P, postTop - 6 * P, 6 * P, 5 * P);

  // ===================================================================
  // CLIMA (sobreposição em tela)
  // ===================================================================
  function drawWeather(ctx, weather, t, W, H, pixel) {

        var px = Math.round(hash(j * 7 + cyc * 13) * W), py = Math.round((0.4 + 0.6 * hash(j * 11 + cyc * 3)) * H);
        ctx.fillStyle = 'rgba(220,235,255,0.6)';

        ctx.fillRect(px - spread * P, py - P, P, P); ctx.fillRect(px + spread * P, py - P, P, P); ctx.fillRect(px, py - 2 * P, P, P);
      }

    } else if (weather === 'nublado') {
      ctx.fillStyle = 'rgba(70,92,125,0.16)'; ctx.fillRect(0, 0, W, H);
      // sombras de nuvens passando
      for (var s = 0; s < 3; s++) {
        var cw = W * (0.5 + 0.3 * hash(s + 5));
        var cx = mod(hash(s + 1) * (W + cw) - t * (14 + 6 * s) * P, W + cw) - cw / 2;
        var cy = H * (0.35 + 0.4 * hash(s + 3));

          ctx.fillRect(Math.round(cx / P) * P - rw, Math.round(cy / P) * P - rh, rw * 2, rh * 2);

      for (var c = 0; c < 4; c++) {
        var cc = cloudCanvas(10 + c, P * 2, 'nublado');

        ctx.globalAlpha = 0.85;

        var bx = Math.round((mod(hash(bi + 31) * bspan + t * (10 + 5 * bi) * P, bspan) - bw) / P) * P;

      ctx.fillStyle = 'rgba(255,196,110,0.06)'; ctx.fillRect(0, 0, W, H);
      // brilho do sol em 3 degraus de pixel (sem gradiente suave)
      var gx = Math.round(W * 0.86), R0 = Math.max(W, H) * 0.5;
      var steps = [[1.0, 0.05], [0.62, 0.06], [0.32, 0.08]];
      for (var gs = 0; gs < steps.length; gs++) {
        var rr = Math.round(R0 * steps[gs][0] / P) * P;
        ctx.fillStyle = 'rgba(255,240,190,' + steps[gs][1] + ')';
        for (var ry = 0; ry < rr; ry += 2 * P) {

          ctx.fillRect(gx - hw, ry, hw * 2, 2 * P);

      var pulse = 0.5 + 0.5 * Math.sin(t * 1.3);
      var flares = [[0.62, 0.22, 5, 0.10], [0.48, 0.38, 3, 0.12], [0.3, 0.6, 7, 0.06]];
      for (var f = 0; f < flares.length; f++) {
        var fx = W * flares[f][0], fy = H * flares[f][1], fr = flares[f][2] * P;
        ctx.fillStyle = 'rgba(255,250,220,' + (flares[f][3] * (0.7 + 0.3 * pulse)).toFixed(3) + ')';
        ctx.fillRect(Math.round(fx - fr), Math.round(fy - fr / 2), Math.round(fr * 2), Math.round(fr));
        ctx.fillRect(Math.round(fx - fr / 2), Math.round(fy - fr), Math.round(fr), Math.round(fr * 2));
      }
    }
  }

  return {
    HORSE_W: HORSE_W, HORSE_H: HORSE_H, GALLOP_FRAMES: GALLOP.length, FOOT_Y: FOOT_Y,
    // pontos úteis em pixels nativos (multiplique pela escala): traseira p/ rastro, focinho, sela
    ANCHORS: { rear: [8, 14], nose: [38, 8], saddle: [18, 10] },
    PALETTES: PALETTES,
    SILKS: SILKS,
    randomPalette: randomPalette,
    ELEMENTS: ['fogo', 'agua', 'grama', 'neutro'],
    drawHorse: drawHorse,
    horseCanvas: horseCanvas,
    drawTrack: drawTrack,
    drawWeather: drawWeather,
    drawTrail: drawTrail,
    drawElementIcon: drawElementIcon,
    hillLiftAt: hillLiftAt,
    hillShape: hillShape,
    HILL_AMP: HILL_AMP,

  };
}));

<script>
/* src/game.js */
/*
 * Galope Elemental — interface jogável do protótipo (descartável).

  var TRACK_NAMES = [

  // ===========================================================================

  var BR = E.breeding;

  // cria uma peça +0 no save st (uid 'i' + nextItemUid) e devolve a instância

    st.items.push(it);
    st.nextItemUid += 1;

  }

  function newState(starterId) {
    var idx = Math.max(0, GD.STARTERS.map(function (h) { return h.id; }).indexOf(starterId));

      v: 4,

      gold: E.startingGold,

  // Itens do save v1–v3 -> peça do catálogo novo (spec §11). null: sem peça (rapadura vira 3 Pedras Negras).

  // Peças, pedras e equipamento (sobrescreve o equipamento inicial de newState). v4: lê s.items;

  // Skills salvas de uma montaria: só ids que ela pode ter (mesmas regras do RaceSim.learnSkill:

  function validSkills(list, mount) {

    var slots = (GD.RARITIES[mount.rarity] || GD.RARITIES.comum).skillSlots;
    var out = [];
    if (Array.isArray(list)) {
      list.forEach(function (id) {
        var sk = typeof id === 'string' && hasOwn(GD.SKILLS, id) ? GD.SKILLS[id] : null;
        if (!sk || out.indexOf(id) >= 0 || out.length >= slots) return;
        if (sk.exclusive && sk.exclusive !== mount.templateId) return;
        if (sk.element !== 'neutro' && sk.element !== mount.element) return;
        out.push(id);
      });
    }
    return out.length ? out : (st ? st.skills.slice() : []);
  }

  // Montaria ativa: a instância viva (para mutar). playerHorse() devolve um clone dela.

    return clone(activeMount());

    return null;
  }

    return null;

  function playerGear() { return gearOf(activeMount()); }
  function newItem(id) { return addItem(state, id); }

  function isEquipped(uid) {

  }

  // XP ganho -> níveis (até o máximo) e, a cada nível, chance de aprender uma skill
  // (sorteio determinístico pela seed do save, pelo seedTag (nº do páreo) e pelo nível alcançado).
  function applyXp(mount, xpGain, seedTag) {
    var levels = 0, learned = [];
    mount.xp += xpGain;
    while (mount.level < MAX_LEVEL && mount.xp >= E.xpToLevel(mount.level)) {
      mount.xp -= E.xpToLevel(mount.level);
      mount.level += 1;
      levels += 1;
    }
    if (mount.level >= MAX_LEVEL) mount.xp = Math.min(mount.xp, E.xpToLevel(mount.level));
    for (var k = 1; k <= levels; k++) {
      var lrng = RS.mulberry32(RS.hash2(state.seedBase, seedTag * 100 + (mount.level - levels + k)));
      // learnSkill confere a exclusiva por .id: a instância usa o id do template de origem
      var sid = RS.learnSkill({ id: mount.templateId, element: mount.element, rarity: mount.rarity, skills: mount.skills }, lrng);
      if (sid) { mount.skills.push(sid); learned.push(sid); }
    }
    return { levels: levels, learned: learned };
  }

  // ===========================================================================
  // Estado de UI (não persistido)
  // ===========================================================================
  var state = null;
  var ui = { screen: 'inicial', lobby: null, result: null, confirmReset: false, confirmLiberar: null, notice: null, haras: null, equip: null, tab: 'estabulo' };
  var live = [];          // canvases animados da tela atual
  var raceView = null;
  var portraitQueue = [];

  // Outra aba gravou um save mais novo: adota e volta para um ponto seguro.
  function adoptExternal(raw) {
    var s = sanitize(raw);
    if (!s) {
      state = null; ui.lobby = null; ui.result = null;
      go('inicial');
      return;
    }
    state = s;
    if (ui.screen === 'corrida' || ui.screen === 'resultado') return;  // o resultado já mostrado continua válido
    ui.notice = 'O jogo foi atualizado em outra aba; este é o progresso mais recente.';
    ui.lobby = null;
    go(ui.screen === 'inicial' ? 'inicial' : 'estabulo');
  }

  // ===========================================================================
  // Canvas nítido (escala inteira em pixels de dispositivo)
  // ===========================================================================
  function setupCanvas(cv, artW, artH, cssScale) {
    var r = dpr();
    var k = Math.max(1, Math.round(cssScale * r));
    cv.width = artW * k;
    cv.height = artH * k;
    cv.style.width = (artW * k / r) + 'px';
    cv.style.height = (artH * k / r) + 'px';
    var ctx = cv.getContext('2d');
    ctx.imageSmoothingEnabled = false;
    return { ctx: ctx, k: k };
  }

  function iconHtml(element) {
    return '<canvas class="icone" data-icon="' + esc(element) + '" aria-hidden="true"></canvas>';
  }

  // Retrato: baia com parede de tábuas e palha; cavalo parado (respira, pisca, abana o rabo,
  // descansa um posterior e abaixa a cabeça de vez em quando).
  var PORTRAIT_W = 48, PORTRAIT_H = 36;
  function portraitHtml(horse, opts) {
    opts = opts || {};
    var id = portraitQueue.length;
    portraitQueue.push({ horse: horse, opts: opts });
    return '<canvas class="retrato" data-retrato="' + id + '" role="img" aria-label="' +
      esc('Retrato de ' + horse.name) + '"></canvas>';
  }

  function drawStall(ctx, k, w, h, seed) {
    ctx.fillStyle = C.painel2; ctx.fillRect(0, 0, w * k, h * k);
    ctx.fillStyle = C.tabua;
    for (var y = 5; y < 31; y += 6) ctx.fillRect(0, y * k, w * k, k);
    for (var row = 0; row < 5; row++) {
      var off = (row * 13 + seed * 7) % 17;
      for (var x = off; x < w; x += 17) ctx.fillRect(x * k, (row * 6 + 6) * k, k, 5 * k);
    }
    // palha
    ctx.fillStyle = C.palha2; ctx.fillRect(0, 31 * k, w * k, (h - 31) * k);
    ctx.fillStyle = C.palha;
    for (var i = 0; i < 26; i++) {
      var px = (i * 11 + seed * 5) % w, py = 32 + (i * 7) % (h - 32);
      ctx.fillRect(px * k, py * k, 2 * k, k);
    }
    ctx.fillStyle = C.escuro; ctx.fillRect(0, 31 * k, w * k, k);
  }

  function hydrate(root) {
    var icons = root.querySelectorAll('canvas[data-icon]');
    for (var i = 0; i < icons.length; i++) {
      var cv = icons[i];
      var s = setupCanvas(cv, 10, 10, 2);
      SP.drawElementIcon(s.ctx, 0, 0, cv.getAttribute('data-icon'), s.k);
    }
    var ps = root.querySelectorAll('canvas[data-retrato]');
    for (var j = 0; j < ps.length; j++) {
      (function (cv) {
        var entry = portraitQueue[Number(cv.getAttribute('data-retrato'))];
        if (!entry) return;
        var o = entry.opts, horse = entry.horse;
        var s = setupCanvas(cv, PORTRAIT_W, PORTRAIT_H, PORTRAIT_SCALE);
        var seed = (horse.name.charCodeAt(0) || 0) + (horse.name.length * 3);
        var phase = (seed % 10) * 0.37;
        var item = {
          drawn: false,
          draw: function (t) {
            if (item.drawn && reduced()) return;
            item.drawn = true;
            drawStall(s.ctx, s.k, PORTRAIT_W, PORTRAIT_H, seed);
            SP.drawHorse(s.ctx, 5 * s.k, 1 * s.k, {
              palette: horse.palette, element: horse.element, idle: true, t: reduced() ? 0.5 : t + phase,
              scale: s.k, jockey: !!o.jockey, silks: o.silks || PLAYER_SILKS
            });
          }
        };
        item.draw(0);
        live.push(item);
      })(ps[j]);
    }
    var perfis = root.querySelectorAll('canvas[data-perfil]');
    for (var q = 0; q < perfis.length; q++) drawProfileCanvas(perfis[q]);
    var podios = root.querySelectorAll('canvas[data-podio]');
    for (var z = 0; z < podios.length; z++) setupPodium(podios[z]);
  }

  // Barras em 20 segmentos inteiros (cada um = 5 pontos): nada de meio segmento.
  function barHtml(v, b) {
    var SEG = 20;
    var fill = clamp(Math.round(v / 5), 0, SEG), base = b == null ? fill : clamp(Math.round(b / 5), 0, SEG);
    var out = '';
    for (var i = 0; i < SEG; i++) {
      var cls = '';
      if (i < Math.min(fill, base)) cls = 'on';
      else if (i < fill) cls = 'on extra';
      else if (i < base) cls = 'menos';
      out += '<i' + (cls ? ' class="' + cls + '"' : '') + '></i>';
    }
    return out;
  }
  function statsHtml(stats, baseStats) {
    var out = '<dl class="status">';
    STAT_KEYS.forEach(function (k) {
      var info = GD.STATS[k];
      var v = stats[k], b = baseStats ? baseStats[k] : v, d = v - b;
      var delta = d ? '<span class="delta ' + (d > 0 ? 'mais' : 'menos-t') + '">' + (d > 0 ? '+' : '−') + Math.abs(d) + '</span>' : '';
      out += '<dt title="' + esc(info.name + ': ' + info.desc) + '">' + statIcon(k) + '<span>' + esc(info.short) + '</span></dt>' +
        '<dd><div class="barra barra--seg" role="img" aria-label="' + esc(info.name + ' ' + v) + '">' + barHtml(v, b) + '</div></dd>' +
        '<dd class="valor">' + v + delta + '</dd>';
    });
    return out + '</dl>';
  }
  function xpHtml(level, xp) {
    var need = E.xpToLevel(level);
    var maxed = level >= (E.maxLevel || 50);
    var pct = maxed ? 100 : clamp(xp / need * 100, 0, 100);
    return '<div class="xp"><div class="xp-linha"><span class="nivel">Nv ' + level + '</span><span>' +
      (maxed ? 'Nível máximo' : fmt(xp) + ' / ' + fmt(need) + ' XP') + '</span></div>' +
      '<div class="barra barra--xp" role="img" aria-label="' + esc('Experiência ' + Math.round(pct) + '%') + '"><i style="width:' + (Math.round(pct / 5) * 5) + '%"></i></div></div>';
  }
  function skillHtml(id) {
    var sk = GD.SKILLS[id];
    if (!sk) return '';
    return '<div class="habilidade"><b>' + iconHtml(sk.element) + esc(sk.name) + '</b><span>' + esc(sk.desc) + '</span></div>';
  }
  function silkClass(r) { return r.isPlayer ? 'seda-voce' : 'seda-' + r.silkIdx; }
  function laneChip(r, i, extra) {
    return '<span class="raia ' + silkClass(r) + (extra ? ' ' + extra : '') + '" aria-label="Raia ' + (i + 1) + '">' + (i + 1) + '</span>';

  // selo do conjunto (a partir de 3 peças, quando o bônus começa)
  function setBadgeHtml(gear) {
    if (!gear || !gear.set || !gear.set.id || gear.set.count < 3 || !hasOwn(GD.GEAR_SETS, gear.set.id)) return '';
    return '<span class="set-badge">' + esc(GD.GEAR_SETS[gear.set.id].name + ' ×' + gear.set.count) + '</span>';

  // resumo do equipamento de uma montaria: um quadrinho por slot (+N ou vazio) e o selo do conjunto
  function gearSummaryHtml(mount) {

    gear.pieces.forEach(function (p) { bySlot[p.slot] = p; });
