<title>Galope Elemental</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
@import url('https://fonts.googleapis.com/css2?family=Jersey+10&family=Press+Start+2P&display=swap');

/* Layout: uma coluna central (até 520px) de painéis no estilo "programa de corrida";
   a pista quebra a coluna (sangra até a borda no celular, cresce até 1120px no desktop).
   Mundo único: estábulo à noite (piso de tábuas), cerca creme e placar dourado.
   Grade de pixel: molduras e sombras em múltiplos de 2px; Press Start 2P só em 8, 16 ou 24px. */
:root {
  color-scheme: dark;
  /* chão e painéis */
  --noite: #0f1c17;
  --noite-2: #0b1611;
  --painel: #16271f;
  --painel-2: #1e3329;
  --painel-3: #284438;
  --linha: #335446;
  --sombra: #060d0a;
  /* madeira (placas) */
  --madeira: #6b4a2b;
  --madeira-2: #523720;
  --madeira-luz: #8a6440;
  /* texto */
  --texto: #f1e9d4;
  --texto-2: #b3c2b2;
  --texto-3: #95a99b;
  --tinta: #1a1405;
  /* acentos */
  --ouro: #f2c230;
  --ouro-claro: #ffe27a;
  --ouro-escuro: #9c7210;
  --ganho: #7be07a;
  --perda: #ff6b5e;
  --foco: #62e6ff;
  /* elementos (texto legível sobre o painel) */
  --fogo: #ff8a4c;
  --agua: #62b8ff;
  --grama: #86d86a;
  --geral: #cfc8b4;
  /* raridades (GameData.RARITIES) */
  --r-comum: #9e9e9e;
  --r-magico: #4caf50;
  --r-raro: #2196f3;
  --r-lendario: #ff9800;
  --r-mitico: #9c27b0;
  /* ligas (GameData.LEAGUES) */
  --l-bronze: #b0703c;
  --l-prata: #b8c2cc;
  --l-ouro: #f2c230;
  --l-platina: #5fd3c8;
  --l-diamante: #7ab8ff;
  --l-lenda: #ff7a3d;
  /* sedas dos jóqueis (Sprites.SILKS) */
  --seda-0: #d8353b;
  --seda-1: #2f6fd8;
  --seda-2: #f2c230;
  --seda-3: #8a4ad8;
  --seda-4: #30b060;
  --seda-5: #f07a2a;
  --seda-6: #e85aa8;
  --seda-7: #2ab8b0;
  /* pódio */
  --prata: #c9d3dc;
  --bronze: #c98a52;
  /* cena dos retratos (baia) */
  --tabua: #243a31;
  --palha: #a5823f;
  --palha-2: #6f5526;
  /* véus e brilhos (sobreposições) */
  --escuro-35: rgb(0 0 0 / 0.35);
  --escuro-25: rgb(0 0 0 / 0.25);
  --brilho-08: rgb(255 255 255 / 0.08);
  --brilho-33: rgb(255 255 255 / 0.33);
  --veu: rgb(6 13 10 / 0.74);
  --holofote: rgb(255 226 122 / 0.06);
  /* tipografia */
  --fonte-display: 'Press Start 2P', ui-monospace, 'Courier New', monospace;
  --fonte-ui: 'Jersey 10', 'Arial Narrow', 'Roboto Condensed', 'Helvetica Neue', system-ui, sans-serif;
  --t-xs: 0.9375rem;
  --t-s: 1.0625rem;
  --t-m: 1.25rem;
  --t-l: 1.625rem;
  /* contorno em pixel (cantos recortados) */
  --px: 2px;
  --sat: env(safe-area-inset-top, 0px);   /* área segura do topo (entalhe/barra de status com viewport-fit=cover) */
  --gl: max(16px, env(safe-area-inset-left, 0px));
  --gr: max(16px, env(safe-area-inset-right, 0px));
}

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
html { background: var(--noite); }
body {
  background-color: var(--noite);
  /* piso de tábuas do estábulo: linhas de 2px, sem gradiente suave */
  background-image:
    linear-gradient(var(--noite-2) 2px, transparent 2px),
    linear-gradient(90deg, var(--noite-2) 2px, transparent 2px);
  background-size: 100% 32px, 128px 32px;
  color: var(--texto);
  font: 400 var(--t-m)/1.25 var(--fonte-ui);
  font-synthesis: none;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; }
b, strong { font-weight: 400; color: var(--texto); }
.ord { font-size: 0.5em; vertical-align: 0.8em; line-height: 0; }
/* pixelated por último: é o que o Chrome aplica (crisp-edges fica de reserva); a corrida pode ser ampliada pelo CSS */
canvas { image-rendering: crisp-edges; image-rendering: pixelated; display: block; }
[hidden] { display: none !important; }
:focus-visible { outline: 3px solid var(--foco); outline-offset: 3px; }
[tabindex="-1"]:focus { outline: none; }
.sr { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }

.app {
  min-height: 100%;
  padding-left: var(--gl);
  padding-right: var(--gr);
  padding-block: calc(16px + var(--sat)) 40px;
  overflow-x: clip;
}
.app--corrida { padding-block: calc(8px + var(--sat)) max(8px, env(safe-area-inset-bottom, 0px)); }

/* ---------- telas ---------- */
.tela { max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
.tela--larga { max-width: 1120px; }
.tela-cabeca { display: flex; flex-direction: column; gap: 6px; }

h1, h2, h3 { margin: 0; text-wrap: balance; font-weight: 400; }
.logo {
  font-family: var(--fonte-display);
  font-size: 24px;
  line-height: 1.5;
  color: var(--ouro);
  text-shadow: 4px 4px 0 var(--sombra);
}
.logo-mini {
  font-family: var(--fonte-display); font-size: 8px; color: var(--ouro); line-height: 2;
  min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.titulo { font-family: var(--fonte-display); font-size: 16px; line-height: 1.5; color: var(--texto); }
.titulo--tela { text-shadow: 2px 2px 0 var(--sombra); }
.rotulo {
  font-size: var(--t-xs); font-weight: 600; text-transform: uppercase; letter-spacing: 0.12em; color: var(--texto-3);
}
.sub { color: var(--texto-2); margin: 0; max-width: 60ch; }
.nota { color: var(--texto-3); font-size: var(--t-s); margin: 0; }

/* ---------- caixas: moldura pixel (cantos recortados), bisel e sombra projetada ---------- */
.caixa {
  background: var(--painel);
  box-shadow:
    0 calc(-1 * var(--px)) 0 0 var(--linha),
    0 var(--px) 0 0 var(--linha),
    calc(-1 * var(--px)) 0 0 0 var(--linha),
    var(--px) 0 0 0 var(--linha),
    0 6px 0 0 var(--sombra),
    inset 0 2px 0 0 var(--brilho-08),
    inset 0 -2px 0 0 var(--escuro-25);
  padding: 14px;
  margin: var(--px) var(--px) 6px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  min-width: 0;
}
.caixa > h2 { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.caixa > h2.titulo::before {
  content: ""; flex: none; width: 8px; height: 8px; background: var(--ouro); box-shadow: 2px 2px 0 0 var(--sombra);
  align-self: center; margin-right: -2px;
}
.caixa > h2.titulo { justify-content: flex-start; }
.caixa > h2 .nota { font-family: var(--fonte-ui); font-size: var(--t-s); letter-spacing: 0; margin-left: auto; }

/* placa de madeira (título da sala de largada) */
.placa {
  background: var(--madeira);
  padding: 12px 14px;
  margin: var(--px) var(--px) 6px;
  box-shadow:
    0 -2px 0 0 var(--sombra), 0 2px 0 0 var(--sombra), -2px 0 0 0 var(--sombra), 2px 0 0 0 var(--sombra),
    0 6px 0 0 var(--sombra),
    inset 0 2px 0 0 var(--madeira-luz), inset 0 -4px 0 0 var(--madeira-2);
  background-image: linear-gradient(var(--madeira-2) 2px, transparent 2px);
  background-size: 100% 18px;
  background-position: 0 8px;
}
.placa .rotulo { color: #e8d7b0; }
.placa .nota { color: #e8d7b0; }

/* ---------- botões ---------- */
.btn {
  appearance: none;
  border: 0;
  margin: var(--px);
  min-height: 48px;
  padding: 10px 16px;
  background: var(--painel-2);
  color: var(--texto);
  font-family: var(--fonte-ui);
  font-weight: 600;
  font-size: var(--t-m);
  line-height: 1.15;
  cursor: pointer;
  box-shadow:
    0 calc(-1 * var(--px)) 0 0 var(--sombra),
    0 var(--px) 0 0 var(--sombra),
    calc(-1 * var(--px)) 0 0 0 var(--sombra),
    var(--px) 0 0 0 var(--sombra),
    inset 0 -4px 0 0 var(--escuro-35),
    inset 0 2px 0 0 var(--brilho-08);
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  text-align: center;
  touch-action: manipulation;
  -webkit-user-select: none; user-select: none;
}
.btn:hover:not(:disabled) { background: var(--painel-3); }
.btn:active:not(:disabled) {
  transform: translateY(2px);
  box-shadow:
    0 calc(-1 * var(--px)) 0 0 var(--sombra),
    0 var(--px) 0 0 var(--sombra),
    calc(-1 * var(--px)) 0 0 0 var(--sombra),
    var(--px) 0 0 0 var(--sombra),
    inset 0 -2px 0 0 var(--escuro-35);
}
.btn:disabled { opacity: 0.42; cursor: not-allowed; }
.btn:focus-visible { outline-offset: 5px; }
.btn--ouro { background: var(--ouro); color: var(--tinta); box-shadow:
    0 -2px 0 0 var(--sombra), 0 2px 0 0 var(--sombra), -2px 0 0 0 var(--sombra), 2px 0 0 0 var(--sombra),
    inset 0 -4px 0 0 var(--ouro-escuro), inset 0 2px 0 0 var(--ouro-claro); }
.btn--ouro:hover:not(:disabled) { background: var(--ouro-claro); }
.btn--grande { min-height: 56px; font-size: var(--t-l); width: calc(100% - 2 * var(--px)); }
.btn--pequeno { min-height: 48px; padding: 6px 12px; font-size: var(--t-s); }
.btn--texto { background: transparent; box-shadow: none; color: var(--texto-2); text-decoration: underline; text-underline-offset: 3px; min-height: 48px; }
.btn--texto:hover:not(:disabled) { background: transparent; color: var(--texto); }
.btn--perigo { color: var(--perda); }
.acoes { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; }
.barra-acao {
  position: sticky; bottom: 0; z-index: 5;
  padding-top: 16px; padding-bottom: max(12px, env(safe-area-inset-bottom, 0px));
  margin-bottom: -12px;
  /* degraus de pixel em vez de degradê suave */
  background: linear-gradient(to bottom, transparent 0 6px, rgb(15 28 23 / 0.6) 6px 10px, var(--noite) 10px);
}

/* resumo do equipamento (um quadrinho por slot + selo do conjunto) */
.slots { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.slot {
  display: inline-flex; align-items: center; justify-content: center; min-width: 36px; height: 32px; padding: 0 6px;
  border: 2px solid var(--linha); background: var(--painel-2); font-weight: 700; font-variant-numeric: tabular-nums;
}
.slot--cheio { border-color: var(--ouro-escuro); color: var(--ouro-claro); }
.slot--vazio { color: var(--texto-3); opacity: 0.5; }
.set-badge { padding: 2px 8px; border: 2px solid var(--ouro); color: var(--ouro); font-weight: 700; white-space: nowrap; }

/* tela de Equipamento: saldo de pedras, linhas de slot e lista de peças */
.topo-saldos { display: flex; align-items: center; gap: 8px; flex: none; }
.pedras { font-family: var(--fonte-display); font-size: 16px; white-space: nowrap; font-variant-numeric: tabular-nums; color: var(--texto); }
.set-linha { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; margin: 4px 0 0; }
.slot-linhas { display: flex; flex-direction: column; gap: 10px; }
.slot-linha { display: flex; flex-direction: column; gap: 8px; }
.slot-linha--aberta { background: var(--painel-2); padding-bottom: 8px; }
.slot-botao { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; width: 100%; text-align: left; min-height: 56px; }
.slot-nome { font-weight: 700; }
.slot-peca { font-size: var(--t-s); color: var(--texto-2); font-weight: 400; overflow-wrap: anywhere; }
.pecas { display: flex; flex-direction: column; gap: 8px; padding: 0 8px; }
.peca { display: flex; flex-direction: column; gap: 6px; padding: 8px; background: var(--painel); box-shadow: inset 4px 0 0 0 var(--linha); min-width: 0; }
.peca--equipada { box-shadow: inset 4px 0 0 0 var(--ouro); }
.peca-info { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.peca-poder { font-size: var(--t-s); color: var(--texto-2); }
.acoes-peca { display: flex; flex-wrap: wrap; gap: 8px; }
.acoes-peca .btn { flex: 1 1 auto; }

/* tela da Loja: abas por slot + pedras e cartões de produto */
.abas.abas--loja { grid-template-columns: repeat(3, minmax(0, 1fr)); margin-bottom: 8px; }
.abas--loja .opcao { min-height: 44px; min-width: 0; padding-left: 4px; padding-right: 4px; overflow-wrap: anywhere; }
.loja-grade { display: grid; grid-template-columns: 1fr; gap: 10px; }
@media (min-width: 601px) { .loja-grade { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.produto { display: flex; flex-direction: column; gap: 6px; padding: 8px; background: var(--painel-2); box-shadow: inset 4px 0 0 0 var(--linha); min-width: 0; }
.produto-nome { margin: 0; font-size: var(--t-m); overflow-wrap: anywhere; }
.produto-stats { margin: 0; font-weight: 700; }
.produto-diff { margin: 0; font-size: var(--t-s); color: var(--texto-2); }
.produto-preco { display: flex; justify-content: flex-end; }

/* opções selecionáveis (aria-pressed) */
.opcoes { display: grid; gap: 10px; }
.opcoes--3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.opcao {
  text-align: left; align-items: flex-start; justify-content: flex-start; flex-direction: column; gap: 2px;
  min-width: 0; font-weight: 500;
}
.opcao[aria-pressed="true"] {
  background: var(--painel-3);
  box-shadow:
    0 calc(-1 * var(--px)) 0 0 var(--ouro),
    0 var(--px) 0 0 var(--ouro),
    calc(-1 * var(--px)) 0 0 0 var(--ouro),
    var(--px) 0 0 0 var(--ouro),
    inset 0 -4px 0 0 var(--escuro-35);
}
.opcao .opcao-nome { font-weight: 700; display: flex; align-items: center; gap: 6px; }
.opcao .opcao-desc { font-size: var(--t-xs); color: var(--texto-2); font-weight: 400; line-height: 1.3; display: flex; flex-wrap: wrap; gap: 4px 6px; align-items: center; }
.opcao--centro { align-items: center; text-align: center; justify-content: center; }

/* ---------- moeda, chips, emblemas ---------- */
.ouro { display: inline-flex; align-items: center; gap: 6px; font-family: var(--fonte-display); font-size: 16px; line-height: 1; color: var(--ouro); white-space: nowrap; font-variant-numeric: tabular-nums; }
.ouro svg { width: 16px; height: 16px; flex: none; }
.saldo {
  background: var(--painel);
  padding: 8px 12px;
  margin: var(--px);
  flex: none;
  box-shadow: 0 -2px 0 0 var(--ouro-escuro), 0 2px 0 0 var(--ouro-escuro), -2px 0 0 0 var(--ouro-escuro), 2px 0 0 0 var(--ouro-escuro), 0 6px 0 0 var(--sombra);
}
.topo { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: nowrap; min-width: 0; }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  display: inline-flex; align-items: center; gap: 6px;
  background: var(--painel-2); color: var(--texto);
  padding: 4px 9px; font-size: var(--t-s); font-weight: 500; line-height: 1.3;
  box-shadow: 0 -2px 0 0 var(--linha), 0 2px 0 0 var(--linha), -2px 0 0 0 var(--linha), 2px 0 0 0 var(--linha);
  margin: 2px;
}
.chip b { font-weight: 700; }
.chip .rotulo { font-size: 0.875rem; letter-spacing: 0.1em; color: var(--texto-2); }

.el { display: inline-flex; align-items: center; gap: 5px; font-weight: 700; }
.el canvas { flex: none; }
.el--fogo { color: var(--fogo); }
.el--agua { color: var(--agua); }
.el--grama { color: var(--grama); }
.el--geral { color: var(--geral); }   /* skills gerais */

.raridade {
  display: inline-flex; align-items: center; gap: 4px; font-size: 0.875rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em;
  padding: 1px 6px; color: var(--tinta); background: var(--r-comum); line-height: 1.5;
  box-shadow: inset 0 -2px 0 0 var(--escuro-25);
}
.raridade--magico { background: var(--r-magico); }
.raridade--raro { background: var(--r-raro); }
.raridade--lendario { background: var(--r-lendario); }
.raridade--mitico { background: var(--r-mitico); color: var(--texto); }

.liga { display: inline-flex; align-items: center; gap: 6px; font-weight: 700; }
.liga::before { content: ""; width: 10px; height: 10px; background: currentColor; box-shadow: 0 0 0 2px var(--sombra); }
.liga--bronze { color: var(--l-bronze); }
.liga--prata { color: var(--l-prata); }
.liga--ouro { color: var(--l-ouro); }
.liga--platina { color: var(--l-platina); }
.liga--diamante { color: var(--l-diamante); }
.liga--lenda { color: var(--l-lenda); }
.liga--icone::before { content: none; }   /* com o escudo (liga-*), sem o quadradinho */

.seda-0 { background: var(--seda-0); } .seda-1 { background: var(--seda-1); } .seda-2 { background: var(--seda-2); } .seda-3 { background: var(--seda-3); }
.seda-4 { background: var(--seda-4); } .seda-5 { background: var(--seda-5); } .seda-6 { background: var(--seda-6); } .seda-7 { background: var(--seda-7); }
.seda-voce { background: var(--ouro); }

/* ---------- status ---------- */
.status { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 8px 10px; align-items: center; margin: 0; }
.status dt { font-family: var(--fonte-display); font-size: 11px; color: var(--texto-2); display: flex; align-items: center; gap: 6px; min-width: 52px; }
.status dd { margin: 0; }
.status .valor { font-family: var(--fonte-display); font-size: 16px; text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; min-width: 3ch; }
.status .delta { font-family: var(--fonte-ui); font-size: var(--t-s); font-weight: 700; margin-left: 4px; }
.icone-status { width: 16px; height: 16px; flex: none; fill: var(--ouro); }
.icone-status--vel { fill: #ffd86a; }
.icone-status--acel { fill: var(--fogo); }
.icone-status--est { fill: var(--perda); }
.icone-status--forca { fill: var(--grama); }
.icone-status--garra { fill: var(--agua); }
.barra {
  position: relative; height: 12px; background: var(--sombra);
  box-shadow: 0 0 0 2px var(--sombra);
}
.barra > i { position: absolute; top: 0; bottom: 0; left: 0; display: block; background: var(--ouro); }
/* barra em segmentos inteiros (30 x 5 pontos, até o teto de 150) */
.barra--seg { display: flex; gap: 2px; background: var(--sombra); height: 12px; }
.barra--seg > i { position: static; flex: 1 1 0; background: var(--painel-3); }
.barra--seg > i.on { background: var(--ouro); box-shadow: inset 0 -2px 0 0 var(--ouro-escuro); }
.barra--seg > i.extra { background: var(--ganho); box-shadow: inset 0 -2px 0 0 #3f9a3e; }
.barra--seg > i.menos { background: transparent; box-shadow: inset 0 0 0 2px var(--perda); }
.barra--xp::after {
  content: ""; position: absolute; inset: 0;
  background-image: linear-gradient(90deg, transparent calc(100% - 2px), var(--sombra) 0);
  background-size: 5% 100%;
}
.mais { color: var(--ganho); }
.menos-t { color: var(--perda); }

.xp { display: flex; flex-direction: column; gap: 4px; }
.xp .barra { height: 10px; }
.xp .barra > i { background: var(--agua); }
.xp-linha { display: flex; justify-content: space-between; font-size: var(--t-xs); color: var(--texto-2); font-variant-numeric: tabular-nums; }

/* ---------- retrato do cavalo ---------- */
.retrato { flex: none; box-shadow: 0 0 0 2px var(--sombra), 0 6px 0 0 var(--sombra); }
/* moldura do retrato com o selo de nível (canto de baixo à esquerda) e o aviso "+N" de pontos (canto de cima à direita) */
.retrato-moldura { position: relative; display: inline-block; flex: none; line-height: 0; }
.retrato-moldura .retrato { display: block; }
.selo-nivel, .pontos-livres--selo {
  position: absolute; font-family: var(--fonte-display); font-size: 11px; line-height: 1; padding: 4px 5px; white-space: nowrap;
  box-shadow: 0 0 0 2px var(--sombra);
}
.selo-nivel { left: 0; bottom: 0; color: var(--texto); background: var(--sombra); }
.pontos-livres--selo { right: 0; top: 0; color: var(--tinta); background: var(--ganho); }
.cavalo-cabeca { display: flex; gap: 14px; align-items: flex-start; }
.cavalo-info { display: flex; flex-direction: column; gap: 6px; min-width: 0; flex: 1; }
.cavalo-nome { font-family: var(--fonte-display); font-size: 16px; line-height: 1.5; color: var(--texto); text-shadow: 2px 2px 0 var(--sombra); }
.cavalo-titulo { color: var(--texto-2); font-size: var(--t-s); margin: 0; }
.linha-meta { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; font-size: var(--t-s); }
.nivel { font-family: var(--fonte-display); font-size: 12px; line-height: 1.2; color: var(--texto); white-space: nowrap; }

.build-topo { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; margin-bottom: 10px; }
.build-topo .pontos-livres { margin: 0; font-family: var(--fonte-display); font-size: 12px; line-height: 1.6; color: var(--texto); }
.build-topo .pontos-livres b { color: var(--ganho); }
.build { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
/* linha de um status (bloco 1b §11): nome, nota, barra até 150 e valor; embaixo, o custo do próximo ponto e +1, +5, +10 */
.build-linha {
  display: grid; grid-template-columns: 110px auto minmax(0, 1fr) 148px; grid-template-areas: "nome nota barra valor" "custo custo custo acao";
  align-items: center; gap: 4px 10px; padding-bottom: 10px; border-bottom: 2px solid var(--linha);
}
.build-linha:last-child { padding-bottom: 0; border-bottom: 0; }
.build-custo { grid-area: custo; font-size: var(--t-xs); color: var(--texto-3); }
.build-nome { grid-area: nome; font-family: var(--fonte-display); font-size: 11px; color: var(--texto-2); display: flex; align-items: center; gap: 6px; }
.build-barra { grid-area: barra; }
.build-linha .valor { grid-area: valor; font-family: var(--fonte-display); font-size: 16px; text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; min-width: 3ch; }
.build-linha .valor--rascunho { color: var(--ganho); }
.build-linha .delta { font-family: var(--fonte-ui); font-size: var(--t-s); font-weight: 700; margin-left: 4px; }
/* 3 botões de 44 px (+ a margem de 2 px do .btn) com 2 px entre eles: 148 px, a 4ª coluna da linha no computador
   (fixa, para as barras ficarem alinhadas também na linha da Sorte, que não tem botões) */
.build-acao { grid-area: acao; display: flex; justify-content: flex-end; gap: 2px; }
.build-mais { width: 44px; min-width: 44px; min-height: 44px; padding: 0; font-family: var(--fonte-display); font-size: 12px; }
.nota-genetica {
  grid-area: nota; font-family: var(--fonte-display); font-size: 11px; line-height: 1; padding: 4px 5px; text-align: center; min-width: 2ch;
  color: var(--tinta); background: var(--r-comum);
}
.nota-genetica--b { background: var(--r-magico); }
.nota-genetica--a { background: var(--r-raro); }
.nota-genetica--s { background: var(--ouro); }
.build-acoes { margin-top: 10px; }
/* "Redistribuir pontos" (bloco 1b §9): embaixo, separado dos botões de compra por um filete */
.redistribuir { margin-top: 12px; padding-top: 10px; border-top: 2px solid var(--linha); display: flex; flex-direction: column; gap: 8px; }
.redistribuir .nota { margin: 0; }
@media (max-width: 600px) {
  /* celular: nome, nota e valor numa linha; a barra inteira embaixo; depois o custo e os botões */
  .build-linha { grid-template-columns: auto auto minmax(0, 1fr) auto; grid-template-areas: "nome nota . valor" "barra barra barra barra" "custo custo custo acao"; gap: 6px 8px; }
  .build-linha .valor { text-align: right; }
}

/* skill de tipo: vaga própria, destacada na cor do tipo */
.vaga-tipo { display: flex; flex-direction: column; gap: 3px; background: var(--painel-3); padding: 8px 10px; box-shadow: inset 4px 0 0 0 var(--ouro), inset 0 0 0 2px var(--linha); }
.vaga-tipo--fogo { box-shadow: inset 4px 0 0 0 var(--fogo), inset 0 0 0 2px var(--linha); }
.vaga-tipo--agua { box-shadow: inset 4px 0 0 0 var(--agua), inset 0 0 0 2px var(--linha); }
.vaga-tipo--grama { box-shadow: inset 4px 0 0 0 var(--grama), inset 0 0 0 2px var(--linha); }
.vaga-tipo b { display: flex; align-items: center; gap: 6px; }
.vaga-tipo > span { font-size: var(--t-s); color: var(--texto-2); }
.vaga-tipo .vaga-tipo-rotulo { font-size: var(--t-xs); font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: var(--texto-3); }
.vaga-tipo .vaga-tipo-forca { font-size: var(--t-xs); color: var(--texto-3); }
.vaga-tipo .vaga-tipo-pontos { color: var(--texto); font-weight: 600; }   /* o efeito em pontos para este cavalo */
.vaga-tipo .ord { font-size: 11px; vertical-align: 0.5em; }   /* o "º" de "1º terço": o sobrescrito não fica abaixo do mínimo de 11 px */
.caixa[aria-label="Skills"] .vaga-tipo { margin-bottom: 8px; }
.inicial-fortes { margin: 0; font-size: var(--t-s); color: var(--texto-2); }
.inicial-fortes b { color: var(--texto); }

.habilidade { display: flex; flex-direction: column; gap: 2px; background: var(--painel-2); padding: 8px 10px; box-shadow: inset 4px 0 0 0 var(--ouro-escuro); }
.habilidade b { display: flex; align-items: center; gap: 6px; }
.habilidade span { font-size: var(--t-s); color: var(--texto-2); }

.afinidade { display: grid; grid-template-columns: auto 1fr; gap: 4px 10px; margin: 0; font-size: var(--t-s); }
.afinidade dt { color: var(--texto-3); font-weight: 600; text-transform: uppercase; font-size: 0.875rem; letter-spacing: 0.08em; padding-top: 2px; }
.afinidade dd { margin: 0; }

/* ---------- tela inicial ---------- */
.iniciais { display: grid; gap: 18px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); align-items: stretch; }
.inicial > .btn--grande { margin-top: auto; }
@media (min-width: 960px) { .inicial .cavalo-titulo { min-height: 4.2em; } .iniciais-nav { display: none; } }
.inicial .retrato-palco { position: relative; display: flex; justify-content: center; background: var(--painel-2); padding: 8px 0 10px; margin: -14px -14px 0; box-shadow: inset 0 -2px 0 0 var(--linha); }
.inicial .contador { position: absolute; right: 8px; top: 8px; font-family: var(--fonte-display); font-size: 11px; color: var(--texto-2); background: var(--sombra); padding: 4px 6px; }
.inicial .cavalo-nome { font-size: 24px; }
.inicial-topo { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.iniciais-nav { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.iniciais-nav .pilula { min-height: 48px; padding-inline: 10px; gap: 6px; }
.iniciais-nav .nota { flex-basis: 100%; }

/* ---------- estábulo ---------- */
.selvagens { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
.selvagem { background: var(--painel-2); padding: 8px; display: flex; flex-direction: column; gap: 4px; align-items: flex-start; min-width: 0; }
.selvagem .retrato { align-self: center; margin-bottom: 6px; }
.selvagem b { font-size: var(--t-m); }
.selvagem .nota { font-size: var(--t-xs); line-height: 1.3; }
.selvagem--comum { box-shadow: inset 0 -4px 0 0 var(--r-comum); }
.selvagem--magico { box-shadow: inset 0 -4px 0 0 var(--r-magico); }
.selvagem--raro { box-shadow: inset 0 -4px 0 0 var(--r-raro); }
.selvagem--lendario { box-shadow: inset 0 -4px 0 0 var(--r-lendario); }
.selvagem--mitico { box-shadow: inset 0 -4px 0 0 var(--r-mitico); }
.montarias { display: grid; grid-template-columns: 1fr; gap: 12px; margin-bottom: 12px; }
@media (min-width: 601px) { .montarias { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.montaria { background: var(--painel-2); padding: 8px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.montaria .retrato, .montaria .retrato-moldura { align-self: center; }
.montaria .cavalo-nome { overflow-wrap: anywhere; }
.montaria .cavalo-nome small { color: var(--texto-2); font-size: var(--t-xs); text-shadow: none; }
.montaria--ativa { box-shadow: inset 0 0 0 2px var(--ouro); }
.estrelas { color: var(--ouro); letter-spacing: 1px; display: inline-flex; align-items: center; gap: 1px; vertical-align: middle; }
.corcel { color: var(--ouro); font-size: var(--t-xs); }
.badge-ativa { font-family: var(--fonte-display); font-size: 11px; line-height: 1; color: var(--tinta); background: var(--ouro); padding: 3px 4px; }
.montaria-acoes { display: flex; flex-wrap: wrap; gap: 8px; }
.montaria-acoes .btn { flex: 1 1 auto; }
/* tela da Montaria: cabeça (retrato, nome, ações) e sub-abas Status / Skills / Equipamento */
.tela > [data-acao="montaria-voltar"], .tela > [data-acao="perfil-voltar"] { align-self: flex-start; }
.montaria-cabeca .cavalo-info .titulo { overflow-wrap: anywhere; }
.montaria-cabeca .titulo small { color: var(--texto-2); font-size: var(--t-xs); text-shadow: none; }
.subabas { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.subabas .opcao { min-height: 48px; min-width: 0; padding-left: 4px; padding-right: 4px; overflow-wrap: anywhere; }
.aviso { background: var(--painel-2); padding: 10px 12px; color: var(--texto); font-size: var(--t-s); box-shadow: inset 4px 0 0 0 var(--ouro); margin: 0; }
.aviso--perda { box-shadow: inset 4px 0 0 0 var(--perda); }
.confirma { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
/* renomear montaria: campo na própria tela (sem window.prompt) */
.renomear { display: flex; flex-direction: column; gap: 8px; }
.campo {
  width: 100%; min-width: 0; min-height: 44px; margin: 0; padding: 6px 8px; border: 2px solid var(--linha); border-radius: 0;
  background: var(--painel-2); color: var(--texto); font-family: var(--fonte-ui); font-size: 16px;
}
.campo:focus-visible { outline: 2px solid var(--ouro); outline-offset: 2px; }
/* ---------- haras ---------- */
.abas { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.haras-sel { display: grid; grid-auto-flow: column; grid-auto-columns: 148px; gap: 12px; overflow-x: auto; overscroll-behavior-x: contain; padding: 4px 4px 10px; min-width: 0; position: relative; }
.haras-card { gap: 4px; padding: 8px; font-size: var(--t-s); }
.haras-card .retrato { align-self: center; width: 96px !important; height: 72px !important; margin-bottom: 4px; }
.haras-card .retrato-moldura { align-self: center; margin-bottom: 4px; }
.haras-card .retrato-moldura .retrato { margin-bottom: 0; }
.haras-card .linha-meta { gap: 4px 8px; font-size: var(--t-xs); }
.haras-card.sel--on { background: var(--painel-3); box-shadow: inset 0 0 0 3px var(--ouro), inset 0 -4px 0 0 var(--escuro-35); }
.haras-nome { overflow-wrap: anywhere; }
.calc p { margin: 0; font-size: var(--t-s); }
.calc-barras { display: flex; flex-direction: column; gap: 6px; }
.calc-linha { display: grid; grid-template-columns: minmax(0, 11em) minmax(0, 1fr); gap: 8px; align-items: center; font-size: var(--t-s); }
.calc-barra { height: 10px; background: var(--painel-2); box-shadow: inset 0 0 0 1px var(--linha); }
.calc-barra > i { display: block; height: 100%; background: var(--ouro); }
.calc-barra--comum > i { background: var(--r-comum); }
.calc-barra--magico > i { background: var(--r-magico); }
.calc-barra--raro > i { background: var(--r-raro); }
.calc-barra--lendario > i { background: var(--r-lendario); }
.calc-custo { font-weight: 700; }

/* ---------- sala de largada ---------- */
.perfil { margin: 0 auto; }
.dicas { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; font-size: var(--t-s); }
.dicas li { display: flex; gap: 8px; align-items: baseline; }
.dicas li::before { content: ""; flex: none; width: 8px; height: 8px; background: var(--texto-3); transform: translateY(-1px); }
.dicas li.bom::before { background: var(--ganho); }
.dicas li.ruim::before { background: var(--perda); }
.dicas li.dica { color: var(--texto-2); }
.dicas li.dica::before { background: var(--ouro); }

.programa { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.programa li {
  display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; gap: 10px; align-items: center;
  background: var(--painel-2); padding: 7px 10px 7px 7px;
}
.programa li.voce { background: var(--painel-3); box-shadow: inset 0 0 0 2px var(--ouro); }
.raia {
  width: 34px; height: 34px; display: grid; place-items: center; flex: none;
  font-family: var(--fonte-display); font-size: 16px; color: var(--texto);
  text-shadow: 2px 2px 0 var(--sombra); box-shadow: 0 0 0 2px var(--sombra), inset 0 -3px 0 0 var(--escuro-25);
}
/* dígito escuro sobre sedas claras (contraste) */
.raia.seda-2, .raia.seda-4, .raia.seda-5, .raia.seda-6, .raia.seda-7, .raia.seda-voce { color: var(--tinta); text-shadow: none; }
.raia--mini { width: 20px; height: 20px; font-size: 11px; text-shadow: none; box-shadow: 0 0 0 2px var(--sombra); }
.raia--mini:not(.seda-2):not(.seda-4):not(.seda-5):not(.seda-6):not(.seda-7):not(.seda-voce) { text-shadow: 1px 1px 0 var(--sombra); }
.corredor { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.corredor b { display: flex; align-items: center; gap: 6px; min-width: 0; }
.corredor b .nome { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.corredor small { color: var(--texto-2); font-size: var(--t-xs); display: flex; flex-wrap: wrap; gap: 2px 8px; align-items: center; }
.poder { text-align: right; display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
.poder b { font-family: var(--fonte-display); font-size: 12px; line-height: 1.2; font-variant-numeric: tabular-nums; }
.poder small { font-size: var(--t-xs); color: var(--texto-2); }
.tag-voce { font-family: var(--fonte-display); font-size: 11px; line-height: 1; color: var(--tinta); background: var(--ouro); padding: 3px 4px; flex: none; }

.pote { display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; margin: 0; font-variant-numeric: tabular-nums; }
.pote dt { color: var(--texto-2); }
.pote dd { margin: 0; text-align: right; font-weight: 600; }
.pote .total dt, .pote .total dd { color: var(--texto); font-weight: 700; }
.premios { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.premios--2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.premio { background: var(--painel-2); padding: 10px 8px; display: flex; flex-direction: column; align-items: center; gap: 8px; box-shadow: inset 0 -4px 0 0 var(--escuro-25); }
.premio .lugar { font-family: var(--fonte-display); font-size: 16px; }
.premio--1 .lugar { color: var(--ouro); }
.premio--2 .lugar { color: var(--prata); }
.premio--3 .lugar { color: var(--bronze); }

/* ---------- corrida: tela cheia sem rolagem (altura do canvas calculada no JS) ---------- */
.tela--corrida { gap: 8px; -webkit-user-select: none; user-select: none; }
.corrida-topo { display: flex; justify-content: space-between; align-items: center; gap: 10px; min-height: 48px; }
.corrida-titulo { display: flex; flex-direction: column; gap: 0; min-width: 0; }
.corrida-nome { font-family: var(--fonte-ui); font-size: var(--t-l); line-height: 1.1; color: var(--texto); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-wrap: nowrap; }
.corrida-titulo .rotulo { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.saldo--pote { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; padding: 6px 10px; flex: none; }
.saldo--pote .rotulo { font-size: 0.8125rem; color: var(--texto-2); }
.palco { position: relative; background: var(--sombra); line-height: 0; overflow: hidden; flex: none; }
.palco canvas { margin: 0 auto; }
.corrida-baixo { display: flex; flex-direction: column; gap: 8px; }
.feed { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; height: 66px; overflow: hidden; }
.feed li {
  display: flex; gap: 8px; align-items: center; flex: none;
  background: var(--painel); padding: 3px 8px; font-size: var(--t-s); line-height: 1.2; min-height: 31px;
}
.feed li time { flex: none; width: 34px; color: var(--texto-2); font-variant-numeric: tabular-nums; }
.feed li > span:last-child { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.feed li.voce { box-shadow: inset 4px 0 0 0 var(--ouro); }
.feed li.tipo-garra > span:last-child, .feed li.tipo-skill > span:last-child { color: var(--ouro-claro); }
.feed li.tipo-cansou > span:last-child { color: var(--perda); }
.controles { display: flex; gap: 10px; flex-wrap: nowrap; align-items: center; }
.controles .vel { display: flex; gap: 8px; }
.controles .vel .btn { min-width: 58px; font-family: var(--fonte-display); font-size: 16px; }
.controles .vel .btn[aria-pressed="true"] { background: var(--ouro); color: var(--tinta); }
.controles .pular { margin-left: auto; }
@media (min-width: 860px) {
  .corrida-baixo { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 16px; align-items: center; }
  .feed { height: 66px; }
}
/* paisagem / telas baixas: o canvas fica com quase toda a altura */
@media (max-height: 500px) {
  .tela--corrida { gap: 6px; }
  .corrida-topo { min-height: 40px; }
  .corrida-titulo .rotulo { display: none; }
  .feed { display: none; }
  .saldo--pote { flex-direction: row; align-items: center; padding: 4px 8px; }
}

/* ---------- resultado ---------- */
/* lista estática no resultado (Dados da Sorte): fluxo normal, sem altura fixa, texto quebra */
.feed.feed--estatica { display: flex; height: auto; overflow: visible; }
.feed--estatica li > span:last-child { white-space: normal; overflow: visible; }
.podio-palco { display: flex; flex-direction: column; align-items: center; gap: 6px; background: var(--painel); padding: 10px 0 12px; box-shadow: 0 6px 0 0 var(--sombra); margin-bottom: 6px; }
.podio-nomes { display: grid; grid-template-columns: repeat(3, 1fr); width: 100%; max-width: 336px; text-align: center; gap: 4px; }
.podio-nomes div { display: flex; flex-direction: column; min-width: 0; font-size: var(--t-xs); color: var(--texto-2); line-height: 1.25; }
.podio-nomes b { color: var(--texto); font-size: var(--t-s); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.podio-nomes .voce b { color: var(--ouro); }
.manchete { font-family: var(--fonte-display); font-size: 16px; line-height: 1.6; color: var(--texto); text-shadow: 2px 2px 0 var(--sombra); }
.manchete em { font-style: normal; color: var(--ouro); }
.balanco { display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; margin: 0; font-variant-numeric: tabular-nums; }
.balanco dt { color: var(--texto-2); }
.balanco dd { margin: 0; text-align: right; font-weight: 700; }
.balanco .final dt, .balanco .final dd { color: var(--texto); padding-top: 6px; border-top: 2px solid var(--linha); }
.balanco .final dt { margin-right: -12px; padding-right: 12px; }
.levelup { background: var(--painel-2); padding: 10px 12px; box-shadow: inset 0 0 0 2px var(--ouro); display: flex; flex-direction: column; gap: 6px; }
.levelup b { font-family: var(--fonte-display); font-size: 11px; line-height: 1.6; color: var(--ouro); }
.ganhos { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: var(--t-s); }
.ganhos span { font-variant-numeric: tabular-nums; }
.rolagem { overflow-x: auto; margin: 0 -4px; padding: 0 4px; }
.tabela { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; font-size: var(--t-s); }
.tabela th { text-align: left; font-size: 0.875rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--texto-2); font-weight: 600; padding: 4px 6px; }
.tabela td { padding: 7px 6px; border-top: 2px solid var(--painel-2); vertical-align: top; }
.tabela td.num, .tabela th.num { text-align: right; white-space: nowrap; }
.tabela tr.voce td { background: var(--painel-2); }
.tabela tr.voce td:first-child { box-shadow: inset 4px 0 0 0 var(--ouro); }
.tabela .pos { font-family: var(--fonte-display); font-size: 16px; white-space: nowrap; }
.tabela .quem { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.tabela .quem b { display: flex; align-items: center; gap: 6px; font-weight: 700; }
.tabela .quem small { color: var(--texto-2); font-size: var(--t-xs); }
.tabela td.num small { display: block; color: var(--texto-2); font-size: var(--t-xs); }
.tabela .tempo { font-weight: 600; }

/* ---------- celular ---------- */
@media (max-width: 600px) {
  .opcoes--tier .opcao { padding-inline: 6px; }
  .opcoes--tier .opcao-nome { font-size: var(--t-s); }
  .palco { margin-left: calc(-1 * var(--gl)); margin-right: calc(-1 * var(--gr)); }
  /* iniciais em carrossel: o próximo cartão aparece na borda (há 3 para comparar) */
  .iniciais {
    display: grid; grid-auto-flow: column; grid-auto-columns: 86%; grid-template-columns: none;
    overflow-x: auto; scroll-snap-type: x mandatory; overscroll-behavior-x: contain;
    margin-inline: calc(-1 * var(--gl)) calc(-1 * var(--gr)); padding: 2px var(--gr) 10px var(--gl);
    scroll-padding-inline: var(--gl); scrollbar-width: none; gap: 12px;
  }
  .iniciais::-webkit-scrollbar { display: none; }
  .inicial { scroll-snap-align: start; }
}
@media (max-width: 380px) {
  .cavalo-cabeca { flex-direction: column; align-items: stretch; }
  .cavalo-cabeca .retrato, .cavalo-cabeca .retrato-moldura { align-self: center; }
}

/* movimento reduzido: a classe vem do game.js (opção "Animações" do Perfil; "Seguir o sistema" usa
   prefers-reduced-motion), então "Completas" vale mesmo com o aparelho pedindo menos movimento */
html.mov-reduzido *, html.mov-reduzido *::before, html.mov-reduzido *::after { transition: none !important; animation: none !important; scroll-behavior: auto !important; }
html.mov-reduzido .btn:active:not(:disabled) { transform: none; }

/* ---------- casca: cabeçalho fixo e barra de abas (abas e sub-telas) ---------- */
.app-topo {
  /* o fundo cobre a área segura do topo; o conteúdo do cabeçalho fica nos 48px abaixo dela */
  position: fixed; top: 0; left: 0; right: 0; z-index: 40; height: calc(48px + var(--sat)); padding-top: var(--sat);
  display: flex; align-items: center; gap: 8px;
  padding-left: var(--gl); padding-right: var(--gr);
  background: var(--painel); border-bottom: 2px solid var(--linha);
}
.app-topo .logo-mini { flex: 1 1 auto; }
.app-topo .saldo { padding: 4px 8px; }
.app-topo .ouro, .app-topo .pedras { font-size: 12px; }
.app-topo .ouro svg { width: 12px; height: 12px; }
.app-perfil { flex: none; min-width: 40px; }
.app-conteudo { display: block; padding-top: calc(56px + var(--sat)); padding-bottom: calc(72px + env(safe-area-inset-bottom, 0px)); }
.app-abas {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 40;
  height: calc(56px + env(safe-area-inset-bottom, 0px)); padding-bottom: env(safe-area-inset-bottom, 0px);
  display: grid; grid-template-columns: repeat(5, 1fr);
  background: var(--painel); border-top: 2px solid var(--linha);
}
.app-aba {
  position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  min-width: 0; min-height: 48px; padding: 4px 2px; margin: 0;
  background: none; border: 0; color: var(--texto-2); cursor: pointer; font-size: 12px; line-height: 1;
}
.app-aba-icone { position: relative; font-size: 20px; line-height: 1; }
.app-aba-rotulo { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.app-aba--ativa { color: var(--ouro); box-shadow: inset 0 3px 0 var(--ouro); }
.app-aba--ponto .app-aba-icone::after {
  content: ''; position: absolute; top: -2px; right: -6px; width: 8px; height: 8px; background: var(--ouro);
}
.app-aba:focus-visible { outline-offset: -3px; }
/* o foco por teclado nunca fica atrás do cabeçalho fixo nem da barra de abas */
html.app-com-abas { scroll-padding: calc(56px + var(--sat)) 0 calc(72px + env(safe-area-inset-bottom, 0px)); }
/* o cartão inteiro da montaria abre a montaria */
.montaria[data-acao] { cursor: pointer; }
@media (min-width: 900px) {
  .app-abas {
    top: 0; bottom: 0; left: 0; right: auto; width: 200px; height: auto;
    grid-template-columns: 1fr; grid-auto-rows: 56px; align-content: start;
    border-top: 0; border-right: 2px solid var(--linha); padding-top: var(--sat);
  }
  .app-aba { flex-direction: row; gap: 10px; justify-content: flex-start; padding-left: 16px; font-size: 14px; }
  .app-aba--ativa { box-shadow: inset 3px 0 0 var(--ouro); }
  .app-topo, .app-conteudo { margin-left: 200px; }
  .app-conteudo { padding-bottom: 16px; }
  html.app-com-abas { scroll-padding-bottom: 16px; }
}

a.btn { text-decoration: none; }

/* ---------- modo DEV (?dev=1): faixa fixa no topo, botão "DEV" e gaveta que sobe do rodapé ---------- */
/* Fora do jogo de produção: o build.mjs tira o bloco @dev do dist/jogo.html. */
/*@dev:inicio*/
/* a faixa (24px) empurra o cabeçalho fixo, a barra lateral do desktop e o conteúdo (a corrida lê o padding do .app) */
/* com área segura no topo, a faixa a cobre e o cabeçalho desce para baixo das duas */
html.dev-ativo .app { padding-top: calc(40px + var(--sat)); }
html.dev-ativo .app--corrida { padding-top: calc(32px + var(--sat)); }
html.dev-ativo .app-topo { top: calc(24px + var(--sat)); height: 48px; padding-top: 0; }
html.dev-ativo.app-com-abas { scroll-padding-top: calc(80px + var(--sat)); }
.dev-faixa {
  position: fixed; top: 0; left: 0; right: 0; z-index: 60; height: calc(24px + var(--sat));
  display: flex; align-items: center; justify-content: center; padding: var(--sat) var(--gr) 0 var(--gl);
  background: var(--perda); color: var(--tinta); font-family: var(--fonte-display); font-size: 8px; line-height: 1;
  white-space: nowrap; overflow: hidden; box-shadow: 0 2px 0 0 var(--sombra);
}
.dev-botao {
  position: fixed; right: var(--gr); bottom: calc(12px + env(safe-area-inset-bottom, 0px)); z-index: 55;
  margin: 0; min-width: 64px; background: var(--perda); color: var(--tinta); font-family: var(--fonte-display); font-size: 8px;
}
.dev-botao:hover:not(:disabled) { background: var(--perda); filter: brightness(1.1); }
.dev-botao--armado { box-shadow: 0 0 0 2px var(--sombra), 0 0 0 4px var(--ouro); }
html.app-com-abas .dev-botao { bottom: calc(68px + env(safe-area-inset-bottom, 0px)); }
.dev-espaco { height: 72px; }
/* telas cheias (largada): a barra de ação fixa sobe acima do botão DEV em vez de ficar coberta por ele */
html.dev-ativo:not(.app-com-abas) .barra-acao { bottom: calc(64px + env(safe-area-inset-bottom, 0px)); }
.dev-gaveta {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 70; margin: 0 auto; max-width: 560px;
  max-height: 82vh; max-height: 82dvh; overflow-x: hidden; overflow-y: auto; overscroll-behavior: contain;
  display: flex; flex-direction: column; gap: 12px;
  padding: 12px var(--gr) calc(16px + env(safe-area-inset-bottom, 0px)) var(--gl);
  background: var(--noite); box-shadow: 0 -2px 0 0 var(--perda), 0 -6px 0 0 var(--sombra);
}
.dev-cabeca { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.dev-grupo { gap: 10px; }
.dev-campos { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; align-items: end; }
.dev-campos--1 { grid-template-columns: minmax(0, 1fr); }
.dev-campos--4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.dev-campo { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.dev-campo .rotulo { overflow-wrap: anywhere; }
.dev-campo select, .dev-campo input {
  width: 100%; min-width: 0; min-height: 44px; margin: 0; padding: 6px 8px; border: 2px solid var(--linha); border-radius: 0;
  background: var(--painel-2); color: var(--texto); font-family: var(--fonte-ui); font-size: var(--t-s);
}
.dev-campo input[type="color"] { padding: 2px; cursor: pointer; }
.dev-check { display: flex; align-items: center; gap: 10px; min-height: 44px; font-size: var(--t-s); cursor: pointer; }
.dev-check input { flex: none; width: 22px; height: 22px; margin: 0; accent-color: var(--ouro); }
.dev-acoes { display: flex; flex-wrap: wrap; gap: 8px; }
.dev-acoes .btn { flex: 1 1 auto; min-width: 0; }
.dev-acoes--base { align-self: end; }
.dev-armado { margin: 0; font-size: var(--t-s); color: var(--texto-3); }
.dev-armado--on { color: var(--ouro-claro); }
@media (min-width: 900px) {
  html.dev-ativo .app-abas { top: calc(24px + var(--sat)); padding-top: 0; }
  html.app-com-abas .dev-botao { bottom: calc(12px + env(safe-area-inset-bottom, 0px)); }
}
/*@dev:fim*/

/* ---------- ícones do PixelLab e logotipo do Canva ---------- */
/* 32x32 reduzido a 16px: suavizado (auto) lê melhor; pixelated só em escala 1x (barra de abas). Halo claro para
   o contorno escuro não sumir no fundo escuro da interface. */
img.icone { width: 16px; height: 16px; flex: none; image-rendering: auto; vertical-align: middle;
  filter: drop-shadow(0 0 1px rgba(241, 233, 212, 0.6)) drop-shadow(0 0 1px rgba(241, 233, 212, 0.4)); }
.app-aba-icone img.icone { width: 32px; height: 32px; display: block; image-rendering: pixelated; }
img.icone.icone--32 { width: 32px; height: 32px; image-rendering: pixelated; }   /* tamanho cheio (cartão de skill) */
.estrelas img.icone { margin: 0; }
/* ícone em linha antes do texto (sem gap de flex) */
.afinidade dd img.icone, #clima-atual img.icone, .lugar img.icone, .tabela .pos img.icone { margin-right: 4px; }
.ouro img.icone { margin: 0; }
.pedras { display: inline-flex; align-items: center; gap: 4px; }
.slot { gap: 4px; }
.slot-nome { display: inline-flex; align-items: center; gap: 6px; }
.slot--vazio img.icone { opacity: 0.6; }
.logo-img { display: block; max-width: 100%; height: auto; image-rendering: pixelated; }
.logo .logo-img { width: 320px; }
.app-topo .logo-mini { display: flex; align-items: center; }
.app-topo .logo-img { height: 24px; width: auto; max-width: 100%; image-rendering: auto; }   /* 63 -> 24 px: redução suavizada */

/* editor do jóquei (Perfil) */
.joquei-previa { display: flex; justify-content: center; background: var(--painel-2); padding: 8px 0; }
.capacetes { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.capacete-btn { min-width: 40px; min-height: 40px; padding: 0; }
.capacete-btn[aria-pressed="true"] {
  box-shadow:
    0 calc(-1 * var(--px)) 0 0 var(--ouro), 0 var(--px) 0 0 var(--ouro),
    calc(-1 * var(--px)) 0 0 0 var(--ouro), var(--px) 0 0 0 var(--ouro);
  /* sem outline próprio: o anel de foco (:focus-visible, --foco) continua valendo no botão selecionado */
}
@media (min-width: 640px) { .capacetes { grid-template-columns: repeat(8, minmax(0, 1fr)); } }

/* "ⓘ" (bloco 1b §11): glifo pequeno com área de toque de 44 px; as margens negativas devolvem o espaço, e a linha não cresce */
.ajuda {
  appearance: none; flex: 0 0 auto; box-sizing: border-box; width: 44px; height: 44px; min-width: 44px; min-height: 44px;
  margin: -14px -12px; padding: 0; border: 0; background: transparent; color: var(--texto-2);

}

.ajuda:focus-visible { outline: 3px solid var(--ouro); outline-offset: -6px; }
.ajuda-txt { grid-column: 1 / -1; flex: 1 1 100%; margin: 4px 0 0; padding: 6px 8px; background: var(--painel-3); box-shadow: inset 3px 0 0 0 var(--ouro);

      surfaces: pick(GameData.SURFACES, ['slow', 'drain']),

  // ---------------------------------------------------------------------------
  // Status

    var x = Number(v);

  function starsOf(horse) {

  function rarityOf(horse) {

    var r0 = T.ptsRate0, r1 = T.ptsRate1;

    Object.keys(GameData.SKILLS).forEach(function (id) {

  // ---------------------------------------------------------------------------

  // Índice do bloco que contém `pos` (varredura linear; pos >= fim -> último; pos < 0 -> 0).

  // ---------------------------------------------------------------------------
  // Pagamentos
  // ---------------------------------------------------------------------------
  function payouts(entryFee, numRacers, finishOrder) {
    var E = GameData.ECONOMY;
    entryFee = Math.max(0, Math.floor(entryFee));
    var pot = entryFee * numRacers;
    var fee = Math.round(pot * Math.round(E.houseFee * 100) / 100);
    var dist = pot - fee;
    var order = finishOrder || [];
    var places = Math.min(E.payoutSplit.length, order.length, numRacers);
    var prizes = [];
    if (places <= 0) return { pot: pot, fee: pot, prizes: prizes };
    // divisão por tamanho do campo (ECONOMY.payoutSplitFor): em campos pequenos pagam menos
    // posições, para que todo lugar premiado receba pelo menos a entrada de volta.
    var full = (typeof E.payoutSplitFor === 'function' ? E.payoutSplitFor(numRacers) : null) || E.payoutSplit;
    places = Math.min(places, full.length);

    var pcts = [], tot = 0, i;
    for (i = 0; i < places; i++) { pcts.push(Math.round(full[i] * 100)); tot += pcts[i]; }
    var given = 0;
    for (i = 0; i < places; i++) {
      var amount = Math.floor(dist * pcts[i] / tot);
      given += amount;
      prizes.push({ racer: order[i], place: i + 1, amount: amount });
    }
    prizes[0].amount += dist - given;   // o resto do arredondamento vai para o 1º
    // defesa: reordena os valores para nunca pagar mais a quem chega depois
    var amounts = prizes.map(function (p) { return p.amount; }).sort(function (a, b) { return b - a; });
    for (i = 0; i < places; i++) prizes[i].amount = amounts[i];
    return { pot: pot, fee: fee, prizes: prizes };
  }

  // ---------------------------------------------------------------------------
  // Simulação
  // ---------------------------------------------------------------------------
  // Fração do trecho [from, to) que cai em blocos de subida (usada na estimativa de gasto do jóquei).
  function hillFraction(blocks, from, to) {
    if (to <= from) return 0;
    var len = 0;
    for (var i = 0; i < blocks.length; i++) {
      if (blocks[i].type !== 'subida') continue;
      var a = Math.max(from, blocks[i].from), b = Math.min(to, blocks[i].to);
      if (b > a) len += b - a;
    }
    return len / (to - from);
  }

  // Maior ritmo constante s (fração de vMax) que o tanque restante sustenta até o fim.
  // gasto = rem/(s*v) * K * c * s^k / pool  =>  s = (avail*pool*v / (rem*K*c))^(1/(k-1))
  function affordablePace(avail, remaining, vRef, pool, cdrain) {
    if (avail <= 0) return 0;
    if (remaining <= 0) return 9;
    var x = avail * pool * vRef / (remaining * T.drainK * cdrain);
    return nthRoot(x, T.drainExp - 1);
  }

  // Multiplicador de clima de um elemento: dono do clima => T.weatherMult (T.weatherMultDouble
  // com skill de clima ativa); elemento penalizado => 2 - T.weatherMult (0,97); senão 1.
  function weatherMult(element, weather, doubled) {
    var w = GameData.WEATHERS[weather];
    var el = GameData.ELEMENTS[element];
    if (!w || !el) return 1;
    if (el.weather === weather) return doubled ? T.weatherMultDouble : T.weatherMult;
    if (w.penalizes === element) return 2 - T.weatherMult;
    return 1;
  }

  // (Re)calcula os números do corredor que dependem do clima. Pode ser chamada de novo no meio da
  // corrida (troca de clima, skill que reforça o bônus, bônus de Garra): só lê statsN e os totais.
  function applyWeather(r, weather) {
    var m = weatherMult(r.element, weather, r.weatherDouble);
    r.weatherM = m;
    derive(r, r, m, null);
    // skill de tipo com statMul: no seu terço, os dois status do tipo valem × (1 + mul) (valores em r.Z)
    var tsk = r.typeSkill;
    if (tsk && tsk.mul) { var mm = {}; for (var q = 0; q < tsk.keys.length; q++) mm[tsk.keys[q]] = 1 + tsk.mul; r.Z = r.Z || {}; derive(r, r.Z, m, mm); }
  }
  // Valores do corredor que saem dos status: o clima soma (m − 1)·weatherAdd a n (o mesmo efeito em
  // qualquer nível); `mul` multiplica o n de alguns status antes disso.
  function derive(r, o, m, mul) {
    var sn = r.statsN, wd = (m - 1) * T.weatherAdd;
    function nx(k) { return sn[k] * (mul && mul[k] ? mul[k] : 1) + wd; }
    o.vMax = (T.vBase + T.vRange * nx('vel')) * (1 + T.weatherVel * (m - 1));
    // aceleração: 1/accel cai em linha reta com n (cada ponto rende o mesmo na largada)
    o.accel = 1 / Math.max(T.aInvMin, T.aInv0 - T.aInv1 * nx('acel'));
    o.nf = nx('forca');
    o.nm = nx('man');
    o.estN = sn.est * (mul && mul.est ? mul.est : 1);
    var ng = nx('garra');
    o.garraChance = clamp(T.garraChanceBase + T.garraChanceRange * ng + r.garraBonusTotal, 0, T.garraChanceMax);
    o.garraBoost = 1 + T.garraBoostBase + T.garraBoostRange * ng + r.garraBoostBonusTotal;
  }

  // Ordem das chamadas de r.rng() (fluxo próprio de cada corredor; manter estável):
  //   montagem: 1) startDelay, 2) jockeyErr;
  //   por tick: 3) tentativas de skill (só quando um gatilho acontece; na ordem dos gatilhos
  //   start/bloco/clima/lowStamina/final e, dentro de cada gatilho, na ordem da lista de skills),
  //   4) sorteio da Garra (uma vez, ao cruzar r.garraFrom), 5) jitter.
  //   A skill de tipo não consome a RNG.
  function buildRacer(entry, index, cond, rng) {
    var horse = entry.horse;
    // o equipamento não entra na corrida (por enquanto). entry.statAdd: gancho de teste do balance.js
    // (como noTypeSkill): soma ao status, preso a 1–statMax.
    var stats = computeStats(horse);
    if (entry.statAdd && typeof entry.statAdd === 'object') {
      for (var sa = 0; sa < STAT_KEYS.length; sa++) {
        var sk0 = STAT_KEYS[sa], add = Number(entry.statAdd[sk0]);
        if (isFinite(add) && add) stats[sk0] = clamp(Math.round(stats[sk0] + add), 1, T.statMax);
      }
    }
    var statsN = {};
    for (var i = 0; i < STAT_KEYS.length; i++) statsN[STAT_KEYS[i]] = stats[STAT_KEYS[i]] / 100;
    var skills = (horse.skills || []).filter(function (id) { return !!GameData.SKILLS[id]; });
    var r = {
      index: index,
      name: entry.name || horse.name,
      horseName: horse.name,
      element: horse.element,
      stats: stats,
      statsN: statsN,
      skillChance: skillChance(horse, stats, 0),
      pool: T.poolBase + T.poolEst * statsN.est,   // tanque fixo (sem clima)
      garraBonusTotal: 0,
      garraBoostBonusTotal: 0,
      weatherDouble: false,
      extraDice: 0,
      startDelay: rng() * T.startDelayMax * (1 - T.startAcelK * clamp(statsN.acel, 0, T.startAcelMax)),
      jockeyErr: T.jockeyErrMin + rng() * (T.jockeyErrMax - T.jockeyErrMin),
      rng: rng,
      skills: skills,
      started: false,
      blockIdx: -1,
      tried: {},
      effects: [],
      pos: 0, v: 0, stamina: 1,
      exhausted: false, finished: false, finishTime: null,
      garraRolled: false, garraMult: 1,
      // início da arrancada: garraZone, adiantado pela Garra (garraZoneK por unidade de n, centrado em 50)
      garraFrom: clamp(T.garraZone - T.garraZoneK * (statsN.garra - 0.5), 0.5, 0.95),
      typeSkill: null
    };
    // skill de tipo: sempre ativa no terço [zone[0]·D, zone[1]·D), força typePower; montada sem RNG.
    // entry.noTypeSkill desliga (comparações do balance.js).
    var ts = entry.noTypeSkill ? null : typeSkill(horse);
    if (ts) {
      var te = ts.effect, P = ts.power, D = cond.distance;
      var from = ts.zone[0] * D, to = ts.zone[1] * D;
      r.typeSkill = { id: ts.id, name: ts.name, from: from, to: to, restore: (te.staminaRestore || 0) * P, entered: false,
        mul: (te.statMul || 0) * P, keys: te.statKeys || TYPE_STATS[horse.element] };
      r.effects.push({
        untilT: null, fromPos: from, untilPos: ts.zone[1] >= 1 ? null : to,
        speedMult: 1 + (te.speedMult || 0) * P,
        accelMult: 1 + (te.accelMult || 0) * P,
        drainMult: Math.max(0.05, 1 - (te.drainCut || 0) * P),
        curveBonus: 0, hillBonus: 0, hillDrainMult: 1,
        forcaAdd: (te.forcaAdd || 0) * P,
        manAdd: (te.manAdd || 0) * P
      });
    }
    applyWeather(r, cond.weather);
    return r;
  }

  // Dado da Sorte de uma montaria. Ordem das chamadas de rng() (manter estável): d1, sorteio do
  // 2º dado (sempre consumido, mesmo com sorte 0 ou 100), d2 (se houver), dado extra (Dado Viciado).
  // Chance de rolar o 2º dado e ficar com o melhor = (sorte − sorteDiceLo)/(sorteDiceFull − sorteDiceLo), presa a
  // 0–1 (Sorte 40 → 0, 60 → 0,5, 80 ou mais → 1); extraDice limitado a 1 (até 3 dados).
  function rollDice(rng, sorte, extraDice) {
    var dice = [1 + Math.floor(rng() * 100)];
    var p = clamp(((sorte || 0) - T.sorteDiceLo) / (T.sorteDiceFull - T.sorteDiceLo), 0, 1);
    if (rng() < p) dice.push(1 + Math.floor(rng() * 100));
    var extra = clamp(Math.floor(extraDice || 0), 0, 1);
    for (var k = 0; k < extra; k++) dice.push(1 + Math.floor(rng() * 100));
    var best = dice[0];
    for (k = 1; k < dice.length; k++) if (dice[k] > best) best = dice[k];
    return { dice: dice, best: best };
  }

  var DICE_PHRASE = { sol: 'o sol abre!', chuva: 'começa a chover!', nevoa: 'a névoa desce!' };

  function simulate(config) {
    config = config || {};
    var seed = (config.seed >>> 0);
    var cond = normalizeConditions(config.conditions || randomConditions(seed), seed);
    var D = cond.distance;
    var blocks = cond.blocks;
    var entries = config.racers || [];
    var n = entries.length;
    var dt = T.dt;
    var record = config.recordFrames !== false;
    var skillsAlways = !!(config.dev && config.dev.skillsAlways);   // modo DEV (ver o cabeçalho)
    var surf = GameData.SURFACES[cond.surface];
    // efeitos gerais do clima vigente (recalculados quando o Dado vira o clima)
    var weatherDrain, weatherSlow;
    function setWeatherGlobals(w) {
      weatherDrain = w === 'sol' ? T.sunDrain : 1;
      weatherSlow = w === 'chuva' ? (1 - T.rainSlow) : 1;
    }
    setWeatherGlobals(cond.weather);
    var distDrain = ratPow(T.drainRefDist / D, T.drainDistExp); // pistas longas gastam menos por segundo (mas duram mais)
    // clima vigente (o Dado da Sorte troca no meio da corrida e chama applyWeather de novo)
    cond.weatherAtual = cond.weather;
    // Dado da Sorte: fluxo próprio, para não perturbar os fluxos por corredor
    var diceRng = mulberry32(hash2(seed, 0xD1CE));
    var diceAt = T.diceAt || [];
    var diceIdx = 0;

    var R = [];
    for (var i = 0; i < n; i++) R.push(buildRacer(entries[i], i, cond, mulberry32(hash2(seed, i + 1))));
    // nome usado na narração: nome do cavalo; se dois corredores têm cavalos de mesmo nome, acrescenta o jogador
    for (i = 0; i < n; i++) {
      var dup = false;
      for (var q = 0; q < n; q++) if (q !== i && R[q].horseName === R[i].horseName) dup = true;
      R[i].label = (dup && R[i].name !== R[i].horseName) ? R[i].horseName + ' (' + R[i].name + ')' : R[i].horseName;
    }

    var events = [];
    function ev(t, racer, type, text) { events.push({ t: r2(t), racer: racer, type: type, text: text }); }

    var frames = [];
    function pushFrame(t) {
      if (!record) return;
      var pos = new Array(n), speed = new Array(n), stam = new Array(n);
      for (var j = 0; j < n; j++) { pos[j] = r2(R[j].pos); speed[j] = r2(R[j].v); stam[j] = r3(R[j].stamina); }
      frames.push({ t: t, pos: pos, speed: speed, stamina: stam });
    }
    pushFrame(0);

    // Uma tentativa por gatilho (por corrida; por bloco se blockScoped): sorteia contra r.skillChance.
    function tryFire(r, id, t, pos, blockTo) {
      var sk = GameData.SKILLS[id];
      var e = sk.effect || {};
      var key = e.blockScoped ? id + '#' + r.blockIdx : id;
      if (r.tried[key]) return;
      r.tried[key] = true;
      // o número é sempre sorteado (a ordem das chamadas não muda); com config.dev.skillsAlways
      // (só o modo DEV) a skill ativa mesmo que ele saia acima da chance
      var roll = r.rng();
      if (!(roll < r.skillChance) && !skillsAlways) return;
      if (e.staminaRestore && !r.exhausted) r.stamina = Math.min(1, r.stamina + e.staminaRestore);
      if (e.extraDice) r.extraDice += e.extraDice;
      var reweather = false;
      if (e.garraChanceBonus) { r.garraBonusTotal += e.garraChanceBonus; reweather = true; }
      if (e.garraBoostBonus) { r.garraBoostBonusTotal += e.garraBoostBonus; reweather = true; }
      if (e.weatherDouble) { r.weatherDouble = true; reweather = true; }
      if (reweather) applyWeather(r, cond.weatherAtual);
      if (e.speedMult || e.accelMult || e.drainMult || e.curveBonus || e.hillBonus || e.hillDrainMult) {
        r.effects.push({
          untilT: e.durationS ? t + e.durationS : null,
          untilPos: e.distanceM ? pos + e.distanceM : (e.blockScoped ? blockTo : null),
          speedMult: e.speedMult || 1,
          accelMult: e.accelMult || 1,
          drainMult: e.drainMult || 1,
          curveBonus: e.curveBonus || 0,
          hillBonus: e.hillBonus || 0,
          hillDrainMult: e.hillDrainMult || 1
        });
      }
      ev(t, r.index, 'skill', r.label + ' ativou ' + sk.name + '!');
    }

    // Tenta todas as skills do corredor com o gatilho dado (na ordem da lista).
    function trigger(r, trig, t, pos, blockTo) {
      for (var s = 0; s < r.skills.length; s++) {
        if (GameData.SKILLS[r.skills[s]].trigger === trig) tryFire(r, r.skills[s], t, pos, blockTo);
      }
    }

    // Liderança
    var leader = -1, cand = -1, candSince = 0, lastLeadEvent = -1e9, leadInit = false;

    var finishedCount = 0;
    var step = 0;
    var prevPos = new Array(n);

    while (finishedCount < n) {
      step++;
      var t = step / 10; // dt = 0.1 exato, sem acumular erro
      if (t > T.maxTime) break;
      var tPrev = (step - 1) / 10;

      for (i = 0; i < n; i++) prevPos[i] = R[i].pos;

      for (i = 0; i < n; i++) {
        var r = R[i];
        if (r.finished) {
          r.v = Math.max(0, r.v - 8 * dt);
          continue;
        }
        var pos = prevPos[i];
        if (!r.started) { r.started = true; trigger(r, 'start', tPrev, pos, null); }
        if (tPrev < r.startDelay) continue;   // ainda reagindo ao sinal de largada
        var p = pos / D;
        var rem = D - pos;

        // gatilhos de bloco (checados antes de mover, com o bloco de `pos`)
        var bi = blockAt(blocks, pos);
        if (bi !== r.blockIdx) {
          var prevB = r.blockIdx;
          r.blockIdx = bi;
          var bTo = blocks[bi].to;
          if (prevB >= 0 && blocks[prevB].type === 'curva') trigger(r, 'curveExit', tPrev, pos, bTo);
          if (blocks[bi].type === 'curva') trigger(r, 'curve', tPrev, pos, bTo);
          else if (blocks[bi].type === 'subida') trigger(r, 'hill', tPrev, pos, bTo);
          else if (bi > 0 && blocks[bi].to - blocks[bi].from >= T.straightMinM) trigger(r, 'straight', tPrev, pos, bTo);
        }
        var blk = blocks[r.blockIdx];
        // clima (checado a cada tick: pode passar a valer quando o clima mudar)
        trigger(r, 'weather:' + cond.weatherAtual, tPrev, pos, blk.to);
        if (r.stamina <= T.lowStaminaAt && !r.exhausted) trigger(r, 'lowStamina', tPrev, pos, blk.to);
        if (p >= r.garraFrom) trigger(r, 'final', tPrev, pos, blk.to);   // reta final = início da arrancada do cavalo

        // skill de tipo: entrada no terço (uma vez): recupera estamina (se não estiver exausto) e narra
        var tsk = r.typeSkill;
        if (tsk && !tsk.entered && pos >= tsk.from) {
          tsk.entered = true;
          if (tsk.restore && !r.exhausted) r.stamina = Math.min(1, r.stamina + tsk.restore);
          events.push({ t: r2(tPrev), racer: r.index, type: 'skill', text: r.label + ' ativou ' + tsk.name + '!', typeSkill: true });
        }
        // no terço da skill de tipo (statMul), os valores dos dois status do tipo vêm de r.Z
        var Z = (tsk && tsk.mul && pos >= tsk.from && pos < tsk.to) ? r.Z : r;

        // efeitos ativos (fromPos/untilPos: trecho da pista onde valem)
        var effSpeed = 1, effAccel = 1, effDrain = 1, curveBonus = 0, hillBonus = 0, hillDrainMult = 1, forcaAdd = 0, manAdd = 0;
        for (var e = 0; e < r.effects.length; e++) {
          var fx = r.effects[e];
          if ((fx.untilT == null || tPrev < fx.untilT) && (fx.untilPos == null || pos < fx.untilPos) && (fx.fromPos == null || pos >= fx.fromPos)) {
            effSpeed *= fx.speedMult; effAccel *= fx.accelMult; effDrain *= fx.drainMult;
            curveBonus += fx.curveBonus; hillBonus += fx.hillBonus; hillDrainMult *= fx.hillDrainMult;
            if (fx.forcaAdd) forcaAdd += fx.forcaAdd;
            if (fx.manAdd) manAdd += fx.manAdd;
          }
        }

        // Garra
        if (!r.garraRolled && p >= r.garraFrom) {
          r.garraRolled = true;
          if (r.rng() < Z.garraChance) {
            r.garraMult = Z.garraBoost;
            ev(tPrev, i, 'garra', r.label + ' mostrou GARRA na reta final!');
          }
        }

        // terreno e bloco
        var nf = clamp(Z.nf + forcaAdd, 0, T.nEffMax), nm = clamp(Z.nm + manAdd, 0, T.nEffMax);
        var speedMod = weatherSlow;
        var drainMod = surf.drain * weatherDrain * distDrain * effDrain;
        speedMod *= 1 - surf.slow * (1 - T.forcaSurfRelief * nf);
        var fatorBloco = 1;
        if (blk.type === 'curva') {
          fatorBloco = Math.min(1, T.curveBase + T.curveRange * nm + curveBonus);
        } else if (blk.type === 'subida') {
          fatorBloco = Math.min(1, T.hillBase + T.hillRange * nf + hillBonus);
          drainMod *= 1 + T.hillDrain * (1 - 0.5 * nf) * hillDrainMult;
        }
        // pelotão e vácuo (vácuo vale para todos)
        var neighbors = 0, drafting = false;
        for (var j = 0; j < n; j++) {
          if (j === i || R[j].finished) continue;
          var gap = prevPos[j] - pos;
          if (Math.abs(gap) <= T.crowdRange) neighbors++;
          if (gap >= T.draftMin && gap <= T.draftRange) drafting = true;
        }
        if (neighbors > 0) {
          speedMod *= 1 - T.crowdSlow * Math.min(neighbors, 3) / 3 * Math.max(0, 1 - T.forcaCrowdRelief * nf);
        }
        if (drafting) drainMod *= 1 - T.draftSave;

        // ritmo do jóquei (perfil único)
        var s;
        if (r.exhausted) {
          s = T.exhaustPace;
        } else {
          var hf = hillFraction(blocks, pos, D);
          // na subida o gasto por segundo é o da reta (sEff já desconta o fatorSubida), mas o trecho
          // dura 1/fatorSubida a mais: o jóquei prevê isso na fração de subida restante
          var fsH = Math.min(1, T.hillBase + T.hillRange * nf);
          var cEst = surf.drain * weatherDrain * distDrain * (1 + hf * ((1 + T.hillDrain * (1 - 0.5 * nf)) / fsH - 1));
          var vRef = Z.vMax * speedMod;
          var aff = affordablePace(r.stamina + r.jockeyErr - T.rationReserve, rem, vRef, r.pool, cEst);
          // teto do ritmo: o da fase, mais o da Estamina (centrado em 50: midEst/spurtEst por unidade de n)
          var capS = p < T.pace.spurtStart ? T.pace.mid + T.pace.midEst * (Z.estN - 0.5) : T.pace.spurtCap + T.pace.spurtEst * (Z.estN - 0.5);
          s = Math.min(capS, aff);
          s = Math.max(s, T.minPace);
        }

        var boost = effSpeed * r.garraMult;
        var jitter = 1 + (r.rng() - 0.5) * T.tickJitter;
        var vTarget = s * Z.vMax * speedMod * fatorBloco * boost * jitter;

        if (r.v < vTarget) r.v = Math.min(vTarget, r.v + Z.accel * effAccel * dt);
        else r.v = Math.max(vTarget, r.v - T.decel * dt);

        // gasto de estamina (boosts não custam)
        if (!r.exhausted) {
          // na subida o fatorBloco é esforço, não descanso: sem dividir por ele, quem é lento na
          // subida gasta menos estamina e recupera no fim (o especialista de Força perdia na subida)
          var sEff = r.v / (Z.vMax * boost * (blk.type === 'subida' ? fatorBloco : 1));
          r.stamina -= T.drainK * powi(sEff, T.drainExp) * drainMod * dt / r.pool;
          if (r.stamina <= 0) {
            r.stamina = 0;
            r.exhausted = true;
            if (rem > D * 0.02) ev(t, i, 'cansou', r.label + ' cansou e perdeu o ritmo!');
          }
        }

        var newPos = pos + r.v * dt;
        if (newPos >= D) {
          r.finishTime = tPrev + (r.v > 0 ? (D - pos) / r.v : dt);
          r.pos = D;
          r.finished = true;
          finishedCount++;
        } else {
          r.pos = newPos;
        }
      }

      // Dado da Sorte: quando o líder cruza diceAt[k]·D, todos rolam (inclusive quem já chegou)
      var maxPos = 0;
      for (i = 0; i < n; i++) if (R[i].pos > maxPos) maxPos = R[i].pos;
      while (n > 0 && diceIdx < diceAt.length && maxPos >= diceAt[diceIdx] * D) {
        // gatilho 'dice' (Dado Viciado): tenta no fluxo do próprio corredor, antes de rolar
        for (i = 0; i < n; i++) trigger(R[i], 'dice', t, R[i].pos, null);
        var rolls = [], cands = [];
        for (i = 0; i < n; i++) {
          var rd = rollDice(diceRng, R[i].stats.sorte, R[i].extraDice);
          rolls.push({ racer: i, dice: rd.dice, best: rd.best, rerolls: 0 });
          cands.push(i);
        }
        // empate no topo: re-rola só os empatados até sobrar um. Teto de 20 rodadas de
        // desempate (na prática inalcançável); se ainda empatar, vence o menor índice
        // (tied segue a ordem crescente dos índices, então tied[0]).
        for (var tieRound = 0; ; tieRound++) {
          var top = -1, tied = [];
          for (q = 0; q < cands.length; q++) {
            var bq = rolls[cands[q]].best;
            if (bq > top) { top = bq; tied = [cands[q]]; } else if (bq === top) tied.push(cands[q]);
          }
          if (tied.length === 1 || tieRound >= 20) break;
          cands = tied;
          for (q = 0; q < cands.length; q++) {
            var ro = rolls[cands[q]];
            var rr = rollDice(diceRng, R[cands[q]].stats.sorte, R[cands[q]].extraDice);
            ro.dice = rr.dice; ro.best = rr.best; ro.rerolls++;
          }
        }
        var win = tied[0];
        var wEl = GameData.ELEMENTS[R[win].element];
        var novo = (wEl && wEl.weather) || cond.weatherAtual;
        var changed = novo !== cond.weatherAtual;
        if (changed) {
          cond.weatherAtual = novo;
          setWeatherGlobals(novo);
          for (i = 0; i < n; i++) applyWeather(R[i], novo);
        }
        events.push({
          t: r2(t), racer: win, type: 'dado', at: diceAt[diceIdx], rolls: rolls, winner: win,
          weather: cond.weatherAtual, changed: changed,
          text: '🎲 ' + R[win].label + ' tirou ' + rolls[win].best +
            (changed ? ' — ' + DICE_PHRASE[novo] : ' — o clima segura!')
        });
        if (changed) {
          events.push({ t: r2(t), racer: -1, type: 'clima', weather: novo,
            text: 'O clima virou: ' + GameData.WEATHERS[novo].name + '!' });
        }
        diceIdx++;
      }

      // troca de liderança (antes do primeiro chegar)
      var L = 0;
      for (i = 1; i < n; i++) if (R[i].pos > R[L].pos) L = i;
      var anyFinished = false;

  //     a mesma linha de chão do sprite por código;

  // Num quadro de altura fixa (opção `quadro`: retratos e pódio) o cavalo fica centrado no x do sprite e a escala

  // e moldesConjunto = null, sem exceção, com um console.warn do motivo (o jogo segue com o desenho por código).
  // Chave a mais na tabela (a de um molde antigo '<estilo>') é ignorada.
